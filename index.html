    <script>
      (function () {
        var recoveryStarted = false;
        var retryKey = "kumepume-reload";

        window.__kumepumeRecover = function () {
          if (recoveryStarted) return false;
          recoveryStarted = true;

          var url = new URL(window.location.href);
          var previousRetry = Number(url.searchParams.get(retryKey) || 0);
          var now = Date.now();
          if (previousRetry && now - previousRetry < 60000) return false;

          url.searchParams.set(retryKey, String(now));
          window.location.replace(url.toString());
          return true;
        };

        window.addEventListener("vite:preloadError", function (event) {
          event.preventDefault();
          window.__kumepumeRecover();
        });

        window.addEventListener("error", function (event) {
          var target = event.target;
          var message = String(event.message || "");
          var failedModule = target instanceof HTMLScriptElement && target.type === "module";
          var failedChunk = /dynamically imported module|module script|loading chunk|chunkloaderror/i.test(message);
          if (failedModule || failedChunk) window.__kumepumeRecover();
        }, true);
      })();
    </script>
