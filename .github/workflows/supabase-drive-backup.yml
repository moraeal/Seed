name: Encrypted Supabase backup

on:
  workflow_dispatch:
  schedule:
    # 03:30 Korea Standard Time every day.
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Check backup configuration
        id: preflight
        shell: bash
        run: |
          if [[ -z "$SUPABASE_DB_URL" || -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "::notice::Backup secrets are not configured yet; this run is safely skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backup tools
        if: steps.preflight.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg

      - name: Dump Supabase roles, schema, and data
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seedvoice-backup/sql"
          npx --yes supabase@2.117.0 db dump --db-url "$SUPABASE_DB_URL" \
            -f "$RUNNER_TEMP/seedvoice-backup/sql/roles.sql" --role-only
          npx --yes supabase@2.117.0 db dump --db-url "$SUPABASE_DB_URL" \
            -f "$RUNNER_TEMP/seedvoice-backup/sql/schema.sql"
          npx --yes supabase@2.117.0 db dump --db-url "$SUPABASE_DB_URL" \
            -f "$RUNNER_TEMP/seedvoice-backup/sql/data.sql" --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Create and encrypt backup archive
        if: steps.preflight.outputs.ready == 'true'
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          archive_name="seedvoice-supabase-${timestamp}.tar.gz"
          encrypted_name="${archive_name}.gpg"
          output_dir="$RUNNER_TEMP/seedvoice-upload"
          mkdir -p "$output_dir"

          cat > "$RUNNER_TEMP/seedvoice-backup/manifest.txt" <<EOF
          project_ref=wajlmbahjyazkftwaeem
          created_at_utc=${timestamp}
          supabase_cli=2.117.0
          contents=roles.sql,schema.sql,data.sql
          storage_objects=not_included
          EOF
          (
            cd "$RUNNER_TEMP/seedvoice-backup/sql"
            sha256sum ./*.sql > SHA256SUMS
          )
          tar -C "$RUNNER_TEMP/seedvoice-backup" -czf "$RUNNER_TEMP/$archive_name" .
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "$output_dir/$encrypted_name" "$RUNNER_TEMP/$archive_name"
          sha256sum "$output_dir/$encrypted_name" \
            | sed "s#${output_dir}/##" > "$output_dir/${encrypted_name}.sha256"

          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "encrypted_name=$encrypted_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=seedvoice-supabase-${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Stage encrypted backup for Google Drive transfer
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove plaintext backup files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/seedvoice-backup" "$RUNNER_TEMP/seedvoice-upload"
          rm -f "$RUNNER_TEMP"/seedvoice-supabase-*.tar.gz
