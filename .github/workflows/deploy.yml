name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh database-backed article routes and 1200x630 previews after unattended publishing.
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep a running deployment alive when newer content commits arrive.
# GitHub may still replace an older pending run with the newest pending run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Stable runner avoids intermittent apt stalls seen on the latest runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure image converters and Korean fonts are available
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # The GitHub-hosted Azure Ubuntu mirror intermittently stalls while
          # fetching Nanum fonts. Use the primary Ubuntu archive for this job.
          if command -v convert >/dev/null 2>&1 && command -v rsvg-convert >/dev/null 2>&1 && fc-list | grep -qi 'Nanum'; then
            echo "Image converters and Korean fonts already available."
          else
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends imagemagick librsvg2-bin fonts-nanum
          fi
          command -v convert
          command -v rsvg-convert
          fc-list | grep -i 'Nanum' | sed -n '1p'

      - name: Build
        run: node scripts/check-editorial-images.mjs && node scripts/validate-hot-issues.mjs && pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Public Turnstile site key is injected at build time; rebuild after key updates.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Inspect the published essay after Pages confirms deployment.
  # This HTTP smoke check does not substitute for mobile/browser review.
  verify-public-column:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public column route and social image
        run: node scripts/verify-latest-column.mjs

  # IndexNow is a notification channel, not an indexing guarantee.
  # Only run after successful production deployment, not hourly refreshes.
  notify-indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout public key and submitter
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live search files and submit to IndexNow
        # Failure must be visible in logs but must not mark an already
        # successful site deployment as failed.
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
