name: Public image backup snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/image-backup.yml
      - scripts/image-backup.py
  schedule:
    - cron: '25 19 * * *'
permissions:
  contents: read
concurrency:
  group: public-image-backup
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install inventory client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Collect and verify all public image originals
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/image-backup.py snapshot --output "$RUNNER_TEMP/image-snapshot"
      - name: Stage complete snapshot for incremental Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: seedvoice-public-image-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/image-snapshot
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
