name: News tracker public UI smoke test

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/smoke-news-tracker-public.mjs"
      - ".github/workflows/news-tracker-public-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-tracker-visual-check
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check that the runner has Chrome
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Install pinned browser automation runtime
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify public tracker index and details at desktop and mobile widths
        run: node scripts/smoke-news-tracker-public.mjs
      - name: Retain visual screenshots and check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-tracker-ui-smoke
          path: tracker-smoke-artifacts/
          retention-days: 7
