name: Normalize Seed Language titles

on:
  push:
    paths:
      - '.github/workflows/normalize-seed-language-titles.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'chore: add one-time seed language title migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize article titles and references
        shell: python
        run: |
          from pathlib import Path
          import re

          files = sorted(Path('src/data').glob('seedLanguage*.ts'))
          article_pattern = re.compile(r'(\bslug:\s*"[^"]+"[\s\S]{0,1200}?\btitle:\s*")([^"]+)(")')
          replacements = {}

          for path in files:
              text = path.read_text(encoding='utf-8')
              def collect(match):
                  title = match.group(2)
                  if '아니라' in title and title.endswith('다') and not title.endswith('말이다'):
                      new_title = title[:-1] + '라는 말이다'
                      replacements[title] = new_title
                      return match.group(1) + new_title + match.group(3)
                  return match.group(0)
              new_text = article_pattern.sub(collect, text)
              path.write_text(new_text, encoding='utf-8')

          # Keep related-article labels and duplicated title references synchronized.
          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          rules = Path('CONTENT_PUBLISHING_RULES.md')
          rule_text = rules.read_text(encoding='utf-8')
          marker = '## 씨앗언어 제목 규칙'
          if marker not in rule_text:
              rule_text += '''\n\n## 씨앗언어 제목 규칙\n\n- 씨앗언어 콘텐츠의 한국어 제목은 원칙적으로 **“A는 B가 아니라 C라는 말이다”** 형식을 사용한다.\n- 기존 통념(B)을 짚은 뒤 씨앗의 재정의(C)를 제시하는 구조로 작성한다.\n- 대표 글과 ‘깊게 읽기’ 제목 모두 같은 문법을 우선 적용한다.\n- 관련 글 버튼·홈 목록·SEO 등 제목을 참조하는 모든 위치는 원문 제목과 동일하게 유지한다.\n'''
              rules.write_text(rule_text, encoding='utf-8')

          print('Updated titles:')
          for old, new in replacements.items():
              print(f'- {old} -> {new}')

      - name: Commit normalized titles
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/seedLanguage*.ts CONTENT_PUBLISHING_RULES.md
          git commit -m 'content: normalize 씨앗언어 title format'
          git push origin HEAD:main
