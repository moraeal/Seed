name: Preview build

on:
  push:
    branches:
      - redesign/home-main-2026-09
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure image converters are available
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if command -v convert >/dev/null 2>&1 && command -v rsvg-convert >/dev/null 2>&1; then
            echo "Image converters already available."
          else
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends imagemagick librsvg2-bin
          fi
          command -v convert
          command -v rsvg-convert

      - name: Build preview
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-home-redesign-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
