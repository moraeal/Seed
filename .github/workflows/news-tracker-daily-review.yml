name: News tracker daily editorial review

on:
  push:
    branches: [main]
    paths:
      - "scripts/news-tracker-daily-review.mjs"
      - ".github/workflows/news-tracker-daily-review.yml"
  schedule:
    # 07:15 KST every day (22:15 UTC previous day); GitHub schedules may start late.
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: news-tracker-daily-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test RSS and tracker date parsing
        run: node scripts/news-tracker-daily-review.mjs --self-test
      - name: Collect unverified news leads
        run: node scripts/news-tracker-daily-review.mjs /tmp/news-tracker-daily-review.md
      - name: Verify issue-report merge protection
        run: node scripts/merge-news-tracker-report.mjs --self-test
      - name: Create or safely refresh the daily editorial issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Asia/Seoul date +%F)"
          TITLE="[뉴스트래커 점검] $DAY"
          EXISTING="$(gh issue list --state all --limit 200 --json number,title | jq -r --arg title "$TITLE" '.[] | select(.title == $title) | .number' | head -n 1)"
          touch /tmp/news-tracker-previous.md
          if [ -n "$EXISTING" ]; then
            gh issue view "$EXISTING" --json body --jq '.body' > /tmp/news-tracker-previous.md
          fi
          node scripts/merge-news-tracker-report.mjs /tmp/news-tracker-previous.md /tmp/news-tracker-daily-review.md /tmp/news-tracker-merged.md
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/news-tracker-merged.md
            echo "Updated existing daily issue #$EXISTING without replacing editor notes"
          else
            gh issue create --title "$TITLE" --body-file /tmp/news-tracker-merged.md
          fi
