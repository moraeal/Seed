name: Temporary import approved SEED VOICE editorial image
on:
  push:
    branches:
      - "media/tolerance-ai-photo-20261029"
    paths:
      - ".github/workflows/import-tolerance-image-temp.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download staged AI editorial photo and commit permanent image
        env:
          SOURCE_URL: "https://post-bridge-media.14090c935c4546008df28ad1da52238b.r2.cloudflarestorage.com/post_media/1b66f8a5-620e-4be6-9a2e-8e1db1e9d86c/IMG_6c88d4c570381661100ace13?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=a96bcaa354d3a6b00a03c907a03334a9%2F20261028%2Fauto%2Fs3%2Faws4_request&X-Amz-Date=20261028T231443Z&X-Amz-Expires=86400&X-Amz-Signature=8faf2009185004fc77a8d0b91f0949ec846f8f18074ad88d1acab9367ea77292&X-Amz-SignedHeaders=host&x-amz-checksum-mode=ENABLED&x-id=GetObject"
        run: |
          set -euo pipefail
          target="public/images/seed-language/tolerance-social-cohesion-2026/tolerance-protest-ai-photo-20261029.jpg"
          mkdir -p "$(dirname "$target")"
          curl -fL --retry 3 --retry-delay 2 --max-time 120 "$SOURCE_URL" -o "$target"
          test "$(wc -c < "$target")" -gt 50000
          test "$(file --mime-type -b "$target")" = "image/jpeg"
          test "$(head -c 3 "$target" | xxd -p)" = "ffd8ff"
          echo "Image captured: $(wc -c < "$target") bytes"
          git config user.name "SEED VOICE image importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Add permanent photo-realistic AI protest image to civic-language assets"
          git push origin "HEAD:$GITHUB_REF_NAME"
