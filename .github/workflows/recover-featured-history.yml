name: Recover homepage selection records
on:
  push:
    branches: [recovery/featured-history-20261002]
    paths: [.github/workflows/recover-featured-history.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only homepage selections from encrypted backups
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: python
        run: |
          import io, json, os, re, subprocess, tarfile, urllib.request, urllib.parse, zipfile
          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          secret = os.environ.get('BACKUP_ENCRYPTION_PASSPHRASE', '')
          if not secret:
              raise SystemExit('Backup decryption is not configured')
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, url):
                  redirected = super().redirect_request(request, response, code, message, headers, url)
                  if urllib.parse.urlparse(url).netloc != urllib.parse.urlparse(request.full_url).netloc:
                      redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(SafeRedirect())
          def get(url):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with opener.open(request, timeout=60) as response:
                  return response.read()
          records = {}
          artifacts = json.loads(get('https://api.github.com/repos/' + repo + '/actions/artifacts?per_page=100'))['artifacts']
          for artifact in artifacts:
              if artifact['expired'] or not artifact['name'].startswith('seedvoice-supabase-'):
                  continue
              with zipfile.ZipFile(io.BytesIO(get(artifact['archive_download_url']))) as zipped:
                  encrypted_paths = [p for p in zipped.namelist() if p.endswith('.tar.gz.gpg')]
                  if len(encrypted_paths) != 1:
                      raise SystemExit('Unexpected backup archive contents')
                  encrypted = zipped.read(encrypted_paths[0])
              # Supply the passphrase through a private pipe; never use arguments or logs.
              read_fd, write_fd = os.pipe()
              os.write(write_fd, secret.encode())
              os.close(write_fd)
              try:
                  decoded = subprocess.run(['gpg', '--batch', '--quiet', '--pinentry-mode', 'loopback', '--passphrase-fd', str(read_fd), '--decrypt'], input=encrypted, stdout=subprocess.PIPE, stderr=subprocess.PIPE, pass_fds=(read_fd,), check=True).stdout
              finally:
                  os.close(read_fd)
              with tarfile.open(fileobj=io.BytesIO(decoded), mode='r:gz') as archive:
                  member = next(m for m in archive.getmembers() if m.name.endswith('/data.sql'))
                  data = archive.extractfile(member).read().decode('utf-8')
              for match in re.finditer(r'COPY "?public"?\."?homepage_featured_(?:content|history)"? \(([^\n]+)\) FROM stdin;\n(.*?)\n\\\.', data, re.S):
                  columns = [c.strip().strip('"') for c in match.group(1).split(',')]
                  for row in match.group(2).splitlines():
                      values = dict(zip(columns, row.split('\t')))
                      path = values.get('content_path', '')
                      timestamp = values.get('featured_at', values.get('updated_at', ''))
                      if not re.fullmatch(r'/((columns|news|briefings|seed-language)|monitoring(/(legislation|tax)(/commentary)?)?)/[a-z0-9][a-z0-9-]*', path):
                          continue
                      if path not in records or timestamp > records[path]['featured_at']:
                          records[path] = {'content_path': path, 'featured_at': timestamp}
          print('FEATURED_HISTORY_RECORDS=' + json.dumps(sorted(records.values(), key=lambda r: r['featured_at'], reverse=True), ensure_ascii=True))
          print('BACKUPS_CHECKED=' + str(sum(not a['expired'] and a['name'].startswith('seedvoice-supabase-') for a in artifacts)))
