name: Import permanent founding hero
on:
  push:
    paths:
      - .github/workflows/import-founding-hero.yml
permissions:
  contents: write
jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Store generated hero image in repository
        env:
          SOURCE_URL: "https://post-bridge-media.14090c935c4546008df28ad1da52238b.r2.cloudflarestorage.com/post_media/1b66f8a5-620e-4be6-9a2e-8e1db1e9d86c/IMG_4e175eaca2d67a97b357ed13?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=a96bcaa354d3a6b00a03c907a03334a9%2F20261021%2Fauto%2Fs3%2Faws4_request&X-Amz-Date=20261021T005441Z&X-Amz-Expires=86400&X-Amz-Signature=9b4ae677cb6afe5d00ec26d98112fc19f9a44e5d999e20d6dee9b04992099c24&X-Amz-SignedHeaders=host&x-amz-checksum-mode=ENABLED&x-id=GetObject"
        run: |
          set -euo pipefail
          mkdir -p public/images/seed-language/founding-state-1948-2026
          curl --fail --show-error --silent --location --retry 3 "$SOURCE_URL" -o public/images/seed-language/founding-state-1948-2026/republic-born-hero.png
          test "$(stat -c '%s' public/images/seed-language/founding-state-1948-2026/republic-born-hero.png)" -gt 100000
          file public/images/seed-language/founding-state-1948-2026/republic-born-hero.png | grep -q 'PNG image data'
          git config user.name "Seed Voice automated publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/seed-language/founding-state-1948-2026/republic-born-hero.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: store text-free founding republic hero image"
          git pull --rebase origin main
          git push origin HEAD:main
