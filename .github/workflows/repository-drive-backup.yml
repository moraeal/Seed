name: Encrypted repository backup

on:
  workflow_dispatch:
  schedule:
    # 04:10 Korea Standard Time every day.
    - cron: "10 19 * * *"

permissions:
  contents: read

concurrency:
  group: repository-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Check backup configuration
        id: preflight
        shell: bash
        run: |
          if [[ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "::notice::Backup encryption secret is not configured; this run is safely skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out complete repository history
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install encryption tools
        if: steps.preflight.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnupg

      - name: Create and verify repository bundle
        if: steps.preflight.outputs.ready == 'true'
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          work_dir="$RUNNER_TEMP/seedvoice-repository-backup"
          output_dir="$RUNNER_TEMP/seedvoice-repository-upload"
          bundle_name="seedvoice-repository-${timestamp}.bundle"
          archive_name="seedvoice-repository-${timestamp}.tar.gz"
          encrypted_name="${archive_name}.gpg"
          mkdir -p "$work_dir" "$output_dir"

          git bundle create "$work_dir/$bundle_name" --all
          git bundle verify "$work_dir/$bundle_name"

          cat > "$work_dir/manifest.txt" <<EOF
          repository=${GITHUB_REPOSITORY}
          created_at_utc=${timestamp}
          head_sha=${GITHUB_SHA}
          contents=complete_git_bundle,branches,tags,commit_history
          restore_command=git_clone_bundle_then_push_to_new_remote
          EOF
          (
            cd "$work_dir"
            sha256sum "$bundle_name" > SHA256SUMS
          )

          tar -C "$work_dir" -czf "$RUNNER_TEMP/$archive_name" .
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "$output_dir/$encrypted_name" "$RUNNER_TEMP/$archive_name"
          sha256sum "$output_dir/$encrypted_name" \
            | sed "s#${output_dir}/##" > "$output_dir/${encrypted_name}.sha256"

          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=seedvoice-repository-${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Stage encrypted repository backup for Google Drive transfer
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove plaintext repository backup files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/seedvoice-repository-backup" "$RUNNER_TEMP/seedvoice-repository-upload"
          rm -f "$RUNNER_TEMP"/seedvoice-repository-*.tar.gz
