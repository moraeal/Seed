<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>씨앗의 소리 구독 신청 확인</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f5f5ef;color:#24332c;font-family:Arial,'Malgun Gothic',sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:32px;background:#ffffff;border:1px solid #dce8dc;border-radius:12px;">
      <p style="margin:0 0 16px;color:#326c43;font-size:13px;font-weight:700;letter-spacing:.08em;">씨앗의 소리</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">구독 신청을 확인해주세요</h1>
      <p style="margin:0 0 12px;font-size:15px;line-height:1.8;">씨앗의 소리 구독을 신청해주셔서 감사합니다.</p>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.8;">아래 버튼을 눌러 이메일 주소를 확인하면 구독 신청이 완료되고 로그인할 수 있습니다.</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;border-radius:8px;background:#326c43;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">이메일 확인하고 구독 완료하기</a>
      <p style="margin:24px 0 8px;font-size:13px;line-height:1.7;color:#526358;">버튼이 열리지 않으면 다음 주소를 복사해 브라우저에 붙여넣으세요.</p>
      <p style="margin:0;overflow-wrap:anywhere;font-size:12px;line-height:1.7;"><a href="{{ .ConfirmationURL }}" style="color:#326c43;">{{ .ConfirmationURL }}</a></p>
      <p style="margin:28px 0 0;padding-top:20px;border-top:1px solid #e4ebe4;font-size:12px;line-height:1.7;color:#68766b;">본인이 신청하지 않았다면 이 메일을 무시하셔도 됩니다.<br />씨앗의 소리 · 시민과 기업의 자유, 공익을 지키는 독립 시민저널</p>
    </div>
  </body>
</html>
