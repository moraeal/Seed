<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="915" viewBox="0 0 1400 915" role="img"><rect width="1400" height="915" fill="#f4f7f4"/><style>text{font-family:"Noto Sans KR","Noto Sans",Arial,sans-serif}</style><text x="70" y="90" font-size="45" font-weight="800" fill="#143f36">From Receipts to Verified Correction</text><text x="70" y="147" font-size="25" fill="#4a625b">Lessons from the Korean Taxpayers Association · SEED proposal</text><rect x="70" y="190" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="190" width="9" height="100" fill="#39775c"/><text x="110" y="234" font-size="29" font-weight="700" fill="#153b34">1. Request specific records</text><text x="110" y="270" font-size="24" fill="#52655f">Identify the project, fiscal year, spending category, contracts and receipts.</text><rect x="70" y="310" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="310" width="9" height="100" fill="#39775c"/><text x="110" y="354" font-size="29" font-weight="700" fill="#153b34">2. Check disclosure and refusal grounds</text><text x="110" y="390" font-size="24" fill="#52655f">Record response dates and the reasons given for withholding information.</text><rect x="70" y="430" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="430" width="9" height="100" fill="#39775c"/><text x="110" y="474" font-size="29" font-weight="700" fill="#153b34">3. Track appeals and proceedings</text><text x="110" y="510" font-size="24" fill="#52655f">Separate court stages, transfer of records and actual disclosure.</text><rect x="70" y="550" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="550" width="9" height="100" fill="#39775c"/><text x="110" y="594" font-size="29" font-weight="700" fill="#153b34">4. Compare plans with spending</text><text x="110" y="630" font-size="24" fill="#52655f">Review legality, necessity, price and results separately.</text><rect x="70" y="670" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="670" width="9" height="100" fill="#39775c"/><text x="110" y="714" font-size="29" font-weight="700" fill="#153b34">5. Verify what changed</text><text x="110" y="750" font-size="24" fill="#52655f">Record corrective action, budget changes and recovered money with evidence.</text><text x="70" y="873" font-size="22" fill="#60736b">Sources: Chosun Ilbo (2022), Edaily (2022), Kookmin Ilbo (2026) · SEED analysis</text></svg>