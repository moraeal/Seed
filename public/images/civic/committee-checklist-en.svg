<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="915" viewBox="0 0 1400 915" role="img"><rect width="1400" height="915" fill="#f4f7f4"/><style>text{font-family:"Noto Sans KR","Noto Sans",Arial,sans-serif}</style><text x="70" y="90" font-size="45" font-weight="800" fill="#143f36">Committee Recommendation Checklist</text><text x="70" y="147" font-size="25" fill="#4a625b">13th committee · Ministry of the Interior and Safety · Notice: Sept. 18, 2026</text><rect x="70" y="190" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="190" width="9" height="100" fill="#39775c"/><text x="110" y="234" font-size="29" font-weight="700" fill="#153b34">Recommending body</text><text x="110" y="270" font-size="24" fill="#52655f">A nonprofit civic organization registered with a central government agency.</text><rect x="70" y="310" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="310" width="9" height="100" fill="#39775c"/><text x="110" y="354" font-size="29" font-weight="700" fill="#153b34">Candidate eligibility</text><text x="110" y="390" font-size="24" fill="#52655f">Check the NGO, academic, civil-service, legal or accounting qualification.</text><rect x="70" y="430" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="430" width="9" height="100" fill="#39775c"/><text x="110" y="474" font-size="29" font-weight="700" fill="#153b34">Documents</text><text x="110" y="510" font-size="24" fill="#52655f">Recommendation + personal-information consent + career evidence.</text><rect x="70" y="550" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="550" width="9" height="100" fill="#39775c"/><text x="110" y="594" font-size="29" font-weight="700" fill="#153b34">Submission</text><text x="110" y="630" font-size="24" fill="#52655f">Official document through Document24 to the responsible ministry division.</text><rect x="70" y="670" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="670" width="9" height="100" fill="#39775c"/><tex