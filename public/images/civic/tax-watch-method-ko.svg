<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="915" viewBox="0 0 1400 915" role="img"><rect width="1400" height="915" fill="#f4f7f4"/><style>text{font-family:"Noto Sans KR","Noto Sans",Arial,sans-serif}</style><text x="70" y="90" font-size="45" font-weight="800" fill="#143f36">영수증에서 시정 결과까지</text><text x="70" y="147" font-size="25" fill="#4a625b">한국납세자연맹 사례에서 배울 방법 · 씨앗의 적용 제안</text><rect x="70" y="190" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="190" width="9" height="100" fill="#39775c"/><text x="110" y="234" font-size="29" font-weight="700" fill="#153b34">① 자료를 청구한다</text><text x="110" y="270" font-size="24" fill="#52655f">사업명·회계연도·지출 항목·계약·영수증을 구체적으로 지정</text><rect x="70" y="310" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="310" width="9" height="100" fill="#39775c"/><text x="110" y="354" font-size="29" font-weight="700" fill="#153b34">② 공개 범위와 거부 사유를 확인한다</text><text x="110" y="390" font-size="24" fill="#52655f">답변 날짜와 비공개 근거를 기록하고 필요한 절차를 검토</text><rect x="70" y="430" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="430" width="9" height="100" fill="#39775c"/><text x="110" y="474" font-size="29" font-weight="700" fill="#153b34">③ 불복과 소송의 경과를 추적한다</text><text x="110" y="510" font-size="24" fill="#52655f">판결 단계·기록 이관·실제 공개 여부를 나누어 확인</text><rect x="70" y="550" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="550" width="9" height="100" fill="#39775c"/><text x="110" y="594" font-size="29" font-weight="700" fill="#153b34">④ 계획과 지출을 비교한다</text><text x="110" y="630" font-size="24" fill="#52655f">적법성·필요성·가격·성과를 각각 판단</text><rect x="70" y="670" width="1260" height="100" rx="8" fill="white"/><rect x="70" y="670" width="9" height="100" fill="#39775c"/><text x="110" y="714" font-size="29" font-weight="700" fill="#153b34">⑤ 고쳐진 결과를 확인한다</text><text x="110" y="750" font-size="24" fill="#52655f">시정 답변·예산 변화·회수액을 근거와 함께 기록</text><text x="70" y="873" font-size="22" fill="#60736b">자료: 조선일보(2022.2.15), 이데일리(2022.7.5), 국민일보(2026.8.7) · 씨앗 분석</text></svg>