      <stop offset="1" stop-color="#e8efe9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9eee6" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#9fc9ba" stop-opacity=".45"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173d32" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
