<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">보호와 통제의 경계</title>
  <desc id="desc">한 시민을 둘러싼 투명한 보호 구조가 한쪽에서는 안전을 제공하지만 다른 한쪽에서는 선택과 이동을 막는 장벽이 될 수 있음을 상징적으로 표현한 그림</desc>
  <defs>
