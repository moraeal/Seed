<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">시민이 정치를 사용하는 민주주의</title>
  <desc id="desc">시민의 위임, 정치의 권한, 공동의 규칙, 예측 가능한 사회를 잇고 시민의 감시가 권력을 제한하는 순환 구조</desc>
  <rect width="1200" height="760" fill="#f7f3e8"/>
  <text x="600" y="78" text-anchor="middle" fill="#112f3b" font-family="Arial, sans-serif" font-size="42" font-weight="800">정치는 시민이 사용하는 도구다</text>
  <text x="600" y="116" text-anchor="middle" fill="#49665e" font-family="Arial, sans-serif" font-size="19">위임은 권력을 만들고, 감시는 권력의 경계를 만든다</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="230" width="235" height="160" rx="22" fill="#153f36"/>
    <text x="172" y="285" fill="#dfbd6d" font-size="17" font-weight="700">01 · 주권</text>
    <text x="172" y="330" fill="white" font-size="30" font-weight="800">시민</text>
    <text x="172" y="364" fill="#dce7e2" font-size="17">판단하고 위임한다</text>
    <rect x="335" y="230" width="235" height="160" rx="22" fill="#ffffff" stroke="#153f36" stroke-width="3"/>
    <text x="452" y="285" fill="#8f6b1f" font-size="17" font-weight="700">02 · 권한</text>
    <text x="452" y="330" fill="#112f3b" font-size="30" font-weight="800">정치</text>
    <text x="452" y="364" fill="#49665e" font-size="17">조정하고 결정한다</text>
    <rect x="615" y="230" width="235" height="160" rx="22" fill="#e9efe9" stroke="#153f36" stroke-width="3"/>
    <text x="732" y="285" fill="#8f6b1f" font-size="17" font-weight="700">03 · 법치</text>
    <text x="732" y="330" fill="#112f3b" font-size="30" font-weight="800">공동의 규칙</text>
    <text x="732" y="364" fill="#49665e" font-size="17">누구에게나 적용된다</text>
    <rect x="895" y="230" width="250" height="160" rx="22" fill="#d9b862"/>
    <text x="1020" y="285" fill="#153f36" font-size="17" font-weight="700">04 · 결과</text>
    <text x="1020" y="330" fill="#112f3b" font-size="27" font-weight="800">예측 가능한 사회</text>
    <text x="1020" y="364" fill="#153f36" font-size="17">자유와 책임이 자란다</text>
  </g>
  <g stroke="#7c9a90" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M295 310h27"/><path d="M316 297l13 13-13 13"/>
    <path d="M575 310h27"/><path d="M596 297l13 13-13 13"/>
    <path d="M855 310h27"/><path d="M876 297l13 13-13 13"/>
  </g>
  <path d="M1020 445c0 165-167 215-440 215S172 610 172 445" fill="none" stroke="#b35145" stroke-width="7" stroke-linecap="round"/>
  <path d="M159 463l13-24 13 24" fill="none" stroke="#b35145" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="366" y="500" width="468" height="86" rx="43" fill="#fff" stroke="#b35145" stroke-width="3"/>
  <text x="600" y="536" text-anchor="middle" fill="#8b342b" font-family="Arial, sans-serif" font-size="19" font-weight="800">선거 사이의 시민 권력</text>
  <text x="600" y="566" text-anchor="middle" fill="#49665e" font-family="Arial, sans-serif" font-size="18">감시 · 거부 · 심판이 권력을 제한한다</text>
  <text x="600" y="711" text-anchor="middle" fill="#112f3b" font-family="Arial, sans-serif" font-size="24" font-weight="800">정치는 주인이 아니라 시민이 맡긴 도구다</text>
</svg>
