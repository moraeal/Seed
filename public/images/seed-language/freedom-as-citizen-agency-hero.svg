<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">보호의 공간을 지나 스스로 선택의 길로 나아가는 시민</title>
  <desc id="desc">안전, 복지, 경제안정, 공공서비스를 내세운 투명한 보호 구조물과 규제·허가·심사·제한·통제의 관문, 그리고 새로운 도전과 다양한 선택으로 향하는 시민의 길을 상징한 이미지</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8d2e5"/>
      <stop offset="0.45" stop-color="#e5edf2"/>
      <stop offset="1" stop-color="#f4c987"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f6ff" stop-opacity="0.74"/>
      <stop offset="0.5" stop-color="#bcd7e6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d0c4"/>
      <stop offset="1" stop-color="#f7dfb8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#24343f" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="domeClip">
      <path d="M-120 626 C-105 254 126 54 495 42 C862 31 1068 246 1024 646 C760 720 301 724 -120 626Z"/>
    </clipPath>
  </defs>

