<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1402 1122" role="img" aria-labelledby="title desc">
  <title id="title">자유는 주체다</title>
  <desc id="desc">자유를 간섭받지 않을 자유, 지배받지 않을 자유, 선택할 수 있는 기회, 선택에 대한 책임으로 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4ecff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f7e8"/><stop offset="1" stop-color="#cdeed1"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe6bd"/><stop offset="1" stop-color="#fff3dd"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eee8ff"/><stop offset="1" stop-color="#dcd7fb"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc63e"/><stop offset="1" stop-color="#3f8b2b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102033" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1402" height="1122" fill="#ffffff"/>

  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Arial, sans-serif" filter="url(#shadow)">
    <rect x="105" y="148" width="580" height="385" rx="42" fill="url(#blue)"/>
    <rect x="717" y="148" width="580" height="385" rx="42" fill="url(#green)"/>
    <rect x="105" y="553" width="580" height="385" rx="42" fill="url(#orange)"/>
    <rect x="717" y="553" width="580" height="385" rx="42" fill="url(#purple)"/>

    <g transform="translate(395 252)">
      <circle r="69" fill="#2f89d8"/>
      <path d="M-35 4 C-10 -28 22 -28 42 -10 C21 -8 7 2 0 23 C-12 11 -22 6 -35 4Z" fill="#fff"/>
      <path d="M-8 23 C14 19 38 34 57 52 C22 52 1 42 -8 23Z" fill="#fff"/>
      <circle cx="-31" cy="-3" r="4" fill="#2f89d8"/>
    </g>
    <text x="395" y="367" text-anchor="middle" font-size="45" font-weight="900" fill="#102033">간섭받지 않을 자유</text>
    <line x1="360" y1="405" x2="430" y2="405" stroke="#102033" stroke-width="3" opacity="0.7"/>
    <text x="395" y="466" text-anchor="middle" font-size="29" font-weight="700" fill="#102033">부당한 개입으로부터의 자유</text>

    <g transform="translate(1007 252)">
      <circle r="69" fill="#2a9a62"/>
      <path d="M0 -45 L40 -28 v33 c0 43-26 66-40 74-14-8-40-31-40-74v-33z" fill="#fff" opacity="0.95"/>
      <path d="M0 -35 L29 -23 v29 c0 31-17 50-29 58z" fill="#e8f6ec"/>
    </g>
    <text x="1007" y="367" text-anchor="middle" font-size="45" font-weight="900" fill="#102033">지배받지 않을 자유</text>
    <line x1="972" y1="405" x2="1042" y2="405" stroke="#102033" stroke-width="3" opacity="0.7"/>
    <text x="1007" y="466" text-anchor="middle" font-size="29" font-weight="700" fill="#102033">자의적 권력에 종속되지 않음</text>

    <g transform="translate(395 657)">
      <circle r="69" fill="#eb8732"/>
      <rect x="-40" y="4" width="17" height="48" fill="#fff"/>
      <rect x="-9" y="-22" width="17" height="74" fill="#fff"/>
      <rect x="22" y="-50" width="17" height="102" fill="#fff"/>
    </g>
    <text x="395" y="775" text-anchor="middle" font-size="45" font-weight="900" fill="#673000">선택할 수 있는 기회</text>
    <line x1="360" y1="813" x2="430" y2="813" stroke="#673000" stroke-width="3" opacity="0.7"/>
    <text x="395" y="874" text-anchor="middle" font-size="29" font-weight="700" fill="#102033">실제로 선택 가능한 조건</text>

    <g transform="translate(1007 657)">
      <circle r="69" fill="#7562bf"/>
      <circle cx="0" cy="-18" r="23" fill="#fff"/>
      <circle cx="-43" cy="-6" r="16" fill="#fff" opacity="0.94"/>
      <circle cx="43" cy="-6" r="16" fill="#fff" opacity="0.94"/>
      <path d="M-40 42 c13-35 67-35 80 0z" fill="#fff"/>
      <path d="M-76 42 c7-25 39-25 49 0z" fill="#fff" opacity="0.94"/>
      <path d="M27 42 c10-25 42-25 49 0z" fill="#fff" opacity="0.94"/>
    </g>
    <text x="1007" y="775" text-anchor="middle" font-size="45" font-weight="900" fill="#15185f">선택에 대한 책임</text>
    <line x1="972" y1="813" x2="1042" y2="813" stroke="#15185f" stroke-width="3" opacity="0.7"/>
    <text x="1007" y="874" text-anchor="middle" font-size="29" font-weight="700" fill="#102033">판단과 결과에 응답하는 힘</text>

    <g transform="translate(701 531)">
      <circle r="190" fill="#ffffff" stroke="#f1f3f4" stroke-width="12"/>
      <ellipse cx="0" cy="-16" rx="67" ry="18" fill="#8a6541" opacity="0.55"/>
      <path d="M0 -104 C-52 -158 -102 -166 -133 -157 C-95 -112 -50 -88 0 -104Z" fill="url(#leaf)"/>
      <path d="M0 -104 C46 -163 101 -178 140 -164 C104 -117 60 -91 0 -104Z" fill="url(#leaf)"/>
      <path d="M0 -103 v70" stroke="#4f8e2c" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 -104 C-45 -137 -82 -153 -128 -157" stroke="#dff0c2" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M0 -104 C42 -141 86 -158 132 -164" stroke="#dff0c2" stroke-width="2" fill="none" opacity="0.7"/>
      <text x="0" y="62" text-anchor="middle" font-size="63" font-weight="900" fill="#102033">자유 = 주체</text>
      <line x1="-44" y1="105" x2="44" y2="105" stroke="#102033" stroke-width="3" opacity="0.7"/>
      <text x="0" y="154" text-anchor="middle" font-size="29" font-weight="800" fill="#102033">스스로 판단하고</text>
      <text x="0" y="191" text-anchor="middle" font-size="29" font-weight="800" fill="#102033">선택하는 시민의 힘</text>
    </g>
  </g>
</svg>
