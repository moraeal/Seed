<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><rect width="1400" height="680" fill="#fcfaf7"/><text x="80" y="95" font-family="Noto Sans KR,Arial,sans-serif" font-weight="800" font-size="48" fill="#1d303c">민중의 시대에서 시민화의 시대로</text><text x="82" y="143" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" fill="#52606a">시민의 성장 방식과 국가권력의 관계를 비교한 개념도</text><g font-family="Noto Sans KR,Arial,sans-serif"><rect x="80" y="196" width="373" height="324" rx="16" fill="#e3eaf1"/><rect x="515" y="196" width="373" height="324" rx="16" fill="#e5e7e6"/><rect x="950" y="196" width="373" height="324" rx="16" fill="#e4eee3"/><text x="116" y="259" font-size="35" font-weight="800" fill="#243d5b">민중운동</text><text x="551" y="259" font-size="35" font-weight="800" fill="#35444b">시민운동</text><text x="987" y="259" font-size="35" font-weight="800" fill="#2d593e">시민화</text><text x="116" y="310" font-size="23" fill="#394b5c">권력에 저항하는 집단</text><text x="551" y="310" font-size="23" fill="#394b5c">권력을 감시하는 조직</text><text x="987" y="310" font-size="23" fill="#394b5c">스스로 판단하는 시민</text><path d="M113 348H420" stroke="#bdcad8" stroke-width="2"/><path d="M548 348H854" stroke="#bdc4c4" stroke-width="2"/><path d="M984 348H1290" stroke="#b9cbb9" stroke-width="2"/><text x="116" y="394" font-size="25" fill="#223847">저항 · 해방 · 조직</text><text x="551" y="394" font-size="25" fill="#223847">참여 · 감시 · 제도</text><text x="987" y="394" font-size="25" fill="#223847">자율 · 책임 · 선택</text><text x="116" y="450" font-size="21" fill="#52606a">민주화운동의 역사적 역할</text><text x="551" y="450" font-size="21" fill="#52606a">민주화 이후 참여 확대</text><text x="987" y="450" font-size="21" fill="#52606a">국가를 일상에서 통제</text><path d="M459 354l40 0-14-13m14 13-14 13" fill="none" stroke="#78878b" stroke-width="5"/><path d="M894 354l40 0-14-13m14 13-14 13" fill="none" stroke="#78878b" stroke-width="5"/><text x="82" y="600" font-size="24" font-weight="700" fill="#263b49">핵심 관점</text><text x="218" y="600" font-size="24" fill="#263b49">교육의 목표를 정하는 국가보다, 판단할 기회를 갖는 시민이 중심이다.</text><text x="82" y="645" font-size="19" fill="#69757a">씨앗의 소리 편집 개념도 · 시대의 모든 운동과 교육을 단정하는 통계가 아님</text></g></svg>