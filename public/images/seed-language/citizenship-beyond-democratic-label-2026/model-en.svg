<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><rect width="1400" height="680" fill="#fcfaf7"/><g font-family="Arial, sans-serif"><text x="80" y="95" font-size="43" font-weight="800" fill="#1d303c">From resistance to self-governing citizenship</text><text x="82" y="143" font-size="24" fill="#52606a">Three traditions and the changing role of citizens</text><rect x="80" y="196" width="373" height="324" rx="16" fill="#e3eaf1"/><rect x="515" y="196" width="373" height="324" rx="16" fill="#e5e7e6"/><rect x="950" y="196" width="373" height="324" rx="16" fill="#e4eee3"/><text x="116" y="259" font-size="31" font-weight="800" fill="#243d5b">People's movements</text><text x="551" y="259" font-size="31" font-weight="800" fill="#35444b">Civic movements</text><text x="987" y="259" font-size="31" font-weight="800" fill="#2d593e">Civic growth</text><text x="116" y="310" font-size="21" fill="#394b5c">Collective resistance</text><text x="551" y="310" font-size="21" fill="#394b5c">Organized oversight</text><text x="987" y="310" font-size="21" fill="#394b5c">Independent citizens</text><path d="M113 348H420M548 348H854M984 348H1290" stroke="#bdcad8" stroke-width="2"/><text x="116" y="394" font-size="22" fill="#223847">Resist · liberate · unite</text><text x="551" y="394" font-size="22" fill="#223847">Participate · monitor</text><text x="987" y="394" font-size="22" fill="#223847">Choose · own · review</text><text x="116" y="450" font-size="19" fill="#52606a">Democratization era</text><text x="551" y="450" font-size="19" fill="#52606a">Post-1987 civic action</text><text x="987" y="450" font-size="19" fill="#52606a">Everyday control of power</text><path d="M459 354h40l-14-13m14 13-14 13M894 354h40l-14-13m14 13-14 13" fill="none" stroke="#78878b" stroke-width="5"/><text x="82" y="600" font-size="24" font-weight="700" fill="#263b49">KEY IDEA</text><text x="225" y="600" font-size="24" fill="#263b49">The citizen decides; the state provides knowledge and access.</text><text x="82" y="645" font-size="19" fill="#69757a">SEED VOICE conceptual comparison · Not a statistical account of all movements</text></g></svg>