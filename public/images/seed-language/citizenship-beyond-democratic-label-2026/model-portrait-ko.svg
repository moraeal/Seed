<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1310" viewBox="0 0 840 1310" role="img" aria-labelledby="ttl desc">
<title id="ttl">민중운동에서 시민화로</title><desc id="desc">민주화의 성과 위에, 시민의 일상적 주권을 세우다</desc>
<rect width="840" height="1310" fill="#fafaf8"/>
<rect x="0" y="0" width="840" height="13" fill="#183a4e"/>
<text x="62" y="88" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="51" font-weight="800" fill="#203746">민중운동에서 시민화로</text>
<text x="62" y="145" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="28" fill="#576774">민주화의 성과 위에, 시민의 일상적 주권을 세우다</text>
<rect x="62" y="195" width="716" height="268" rx="20" fill="#eaf0f5"/>
<rect x="62" y="195" width="10" height="268" rx="4" fill="#395d7b"/>
<text x="96" y="247" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="27" font-weight="700" fill="#395d7b">1980년대 · 저항</text>
<text x="96" y="317" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="52" font-weight="800" fill="#1b333e">민중운동</text>
<path d="M96 342h628" stroke="#c9d4d4" stroke-width="2"/>
<text x="96" y="387" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="33" font-weight="500" fill="#263d48">억압적 권력에 맞선 집단적 저항</text>
<text x="96" y="431" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="30" fill="#4b5b61">민주화 · 노동권 · 정치적 자유</text>
<path d="M416 471v33l-12 -12m12 12 12 -12" fill="none" stroke="#849996" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="62" y="516" width="716" height="268" rx="20" fill="#f0f2ef"/>
<rect x="62" y="516" width="10" height="268" rx="4" fill="#626d70"/>
<text x="96" y="568" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="27" font-weight="700" fill="#626d70">1990년대 · 감시</text>
<text x="96" y="638" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="52" font-weight="800" fill="#1b333e">시민운동</text>
<path d="M96 663h628" stroke="#c9d4d4" stroke-width="2"/>
<text x="96" y="708" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="33" font-weight="500" fill="#263d48">정책과 제도를 시민이 감시</text>
<text x="96" y="752" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="30" fill="#4b5b61">참여 · 공익소송 · 사회개혁</text>
<path d="M416 792v33l-12 -12m12 12 12 -12" fill="none" stroke="#849996" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="62" y="837" width="716" height="268" rx="20" fill="#e7f1e9"/>
<rect x="62" y="837" width="10" height="268" rx="4" fill="#346750"/>
<text x="96" y="889" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="27" font-weight="700" fill="#346750">오늘과 미래 · 주체</text>
<text x="96" y="959" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="52" font-weight="800" fill="#1b333e">시민화</text>
<path d="M96 984h628" stroke="#c9d4d4" stroke-width="2"/>
<text x="96" y="1029" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="33" font-weight="500" fill="#263d48">스스로 배우고 판단하며 결정</text>
<text x="96" y="1073" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="30" fill="#4b5b61">자율 · 책임 · 일상의 주권</text>
<rect x="62" y="1151" width="716" height="99" rx="15" fill="#203c4c"/>
<text x="92" y="1187" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="23" font-weight="700" fill="#b9d8ca">핵심 질문</text>
<text x="92" y="1228" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">시민은 교육의 대상인가, 결정의 주체인가?</text>
<text x="62" y="1290" font-family="'Noto Sans KR','Pretendard',Arial,sans-serif" font-size="18" fill="#717d7e">씨앗의 소리 개념도 · 역사적 모든 운동을 일률적으로 분류한 통계가 아님</text>
</svg>