<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700"><rect width="1400" height="700" fill="#faf8f3"/><g fill="#1b3543" font-family="Arial,'Noto Sans KR',sans-serif"><text x="74" y="95" font-size="42" font-weight="bold">독립의 이상에서 실제 국가의 성립까지</text><text x="75" y="145" font-size="23">1910년부터 1948년까지, 서로 다른 역사적 사건을 구분합니다</text></g><path d="M155 360H1255" stroke="#c3c9c4" stroke-width="15" stroke-linecap="round"/><g text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif"><g fill="#b07b4d"><circle cx="155" cy="360" r="37"/><circle cx="515" cy="360" r="37"/></g><g fill="#41717f"><circle cx="875" cy="360" r="37"/><circle cx="1255" cy="360" r="37"/></g><g fill="#1b3543" font-size="42" font-weight="bold"><text x="155" y="278">1910</text><text x="515" y="278">1919</text><text x="875" y="278">1948</text><text x="1255" y="278">1948</text></g><g fill="#3c4b51" font-size="28"><text x="155" y="455">국권 상실</text><text x="515" y="455">임시정부 수립</text><text x="875" y="455">헌법·정부 수립</text><text x="1255" y="455">유엔총회 결의</text><text x="1255" y="493">제195(III)호</text></g></g></svg>