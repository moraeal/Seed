<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fb"/><rect width="1600" height="15" fill="#193c57"/><g font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif"><text x="85" y="110" fill="#152d41" font-size="55" font-weight="700">나라의 역사와 국민주권의 탄생</text><text x="85" y="161" fill="#687988" font-size="27">나라가 존재했다는 사실과 국민이 주권자인 국가를 세웠다는 것은 다르다</text><line x1="85" y1="205" x2="1516" y2="205" stroke="#d9e0e6" stroke-width="3"/><rect x="85" y="257" width="335" height="393" rx="13" fill="white" stroke="#d6dfe5" stroke-width="2"/><rect x="85" y="257" width="335" height="75" rx="13" fill="#6b7c8b"/><rect x="85" y="316" width="335" height="16" fill="#6b7c8b"/><text x="105" y="306" fill="white" font-size="36">1392–1910</text><text x="105" y="389" fill="#203446" font-size="29" font-weight="700">조선왕조·대한제국</text><text x="105" y="442" fill="#6b7c8b" font-size="24">왕정 국가</text><line x1="105" y1="471" x2="400" y2="471" stroke="#e0e5e9" stroke-width="2"/><text x="105" y="527" fill="#596c7a" font-size="22">왕·황제가 통치</text><text x="105" y="581" fill="#596c7a" font-size="22">백성은 통치의 대상</text><path d="M429 445l20 22-20 22z" fill="#aebfca"/><rect x="450" y="257" width="335" height="393" rx="13" fill="white" stroke="#d6dfe5" stroke-width="2"/><rect x="450" y="257" width="335" height="75" rx="13" fill="#52869c"/><rect x="450" y="316" width="335" height="16" fill="#52869c"/><text x="470" y="306" fill="white" font-size="36">1919</text><text x="470" y="389" fill="#203446" font-size="29" font-weight="700">대한민국 임시정부</text><text x="470" y="442" fill="#52869c" font-size="24">공화국의 원칙 선언</text><line x1="470" y1="471" x2="765" y2="471" stroke="#e0e5e9" stroke-width="2"/><text x="470" y="527" fill="#596c7a" font-size="22">임시헌장에 민주공화제 명시</text><text x="470" y="581" fill="#596c7a" font-size="22">국민주권의 이념 제시</text><path d="M794 445l20 22-20 22z" fill="#aebfca"/><rect x="815" y="257" width="335" height="393" rx="13" fill="white" stroke="#d6dfe5" stroke-width="2"/><rect x="815" y="257" width="335" height="75" rx="13" fill="#245d84"/><rect x="815" y="316" width="335" height="16" fill="#245d84"/><text x="835" y="306" fill="white" font-size="36">1948</text><text x="835" y="389" fill="#203446" font-size="29" font-weight="700">대한민국 정부 수립</text><text x="835" y="442" fill="#245d84" font-size="24">헌법에 기초한 정부 출범</text><line x1="835" y1="471" x2="1130" y2="471" stroke="#e0e5e9" stroke-width="2"/><text x="835" y="527" fill="#596c7a" font-size="22">제헌헌법과 정부 수립</text><text x="835" y="581" fill="#596c7a" font-size="22">국민주권의 제도화</text><path d="M1159 445l20 22-20 22z" fill="#aebfca"/><rect x="1180" y="257" width="335" height="393" rx="13" fill="white" stroke="#d6dfe5" stroke-width="2"/><rect x="1180" y="257" width="335" height="75" rx="13" fill="#a3593d"/><rect x="1180" y="316" width="335" height="16" fill="#a3593d"/><text x="1200" y="306" fill="white" font-size="36">오늘</text><text x="1200" y="389" fill="#203446" font-size="29" font-weight="700">대한민국</text><text x="1200" y="442" fill="#a3593d" font-size="24">주권은 국민에게</text><line x1="1200" y1="471" x2="1495" y2="471" stroke="#e0e5e9" stroke-width="2"/><text x="1200" y="527" fill="#596c7a" font-size="22">헌법 제1조 제2항</text><text x="1200" y="581" fill="#596c7a" font-size="22">모든 권력은 국민으로부터</text><rect x="85" y="701" width="1431" height="126" rx="14" fill="#e7eff4"/><text x="120" y="750" fill="#3f6d88" font-size="25">기사의 핵심</text><text x="120" y="795" fill="#193c57" font-size="32">1919년 공화국의 원칙을 선언하고, 1948년 헌법에 기초한 정부를 수립했다.</text><text x="1180" y="867" fill="#7b8c9b" font-size="23">씨앗의 소리 | 시민언어</text></g></svg>