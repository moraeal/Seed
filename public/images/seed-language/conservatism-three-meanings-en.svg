<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three layers of conservatism</title>
  <desc id="desc">A comparison of the political tradition, common Korean usage and the SEED VOICE standard.</desc>
  <rect width="1600" height="900" fill="#f5f1e8"/>
  <text x="90" y="92" fill="#132f45" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Three layers of conservatism</text>
  <text x="90" y="140" fill="#486158" font-family="Inter, Arial, sans-serif" font-size="23">One word holds a political tradition, Korea's modern history and SEED VOICE's standard of judgment.</text>

  <g transform="translate(70 210)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect width="455" height="525" rx="20" fill="#fffdf8" stroke="#174c3a" stroke-width="3"/>
      <rect width="455" height="105" rx="20" fill="#dce9e1"/>
      <path d="M0 85h455v20H0z" fill="#dce9e1"/>
      <text x="32" y="52" fill="#174c3a" font-size="18" font-weight="800" letter-spacing="2">THE TRADITION</text>
      <text x="32" y="85" fill="#132f45" font-size="28" font-weight="800">Preserve tested order</text>
      <text x="32" y="155" fill="#243b46" font-size="23" font-weight="700">Preserve</text>
      <text x="32" y="195" fill="#486158" font-size="21">Institutions and accumulated wisdom</text>
      <text x="32" y="255" fill="#243b46" font-size="23" font-weight="700">Change</text>
      <text x="32" y="295" fill="#486158" font-size="21">Prefer tested, incremental repair</text>
      <text x="32" y="329" fill="#486158" font-size="21">to total reconstruction</text>
      <text x="32" y="392" fill="#243b46" font-size="23" font-weight="700">Guard against</text>
      <text x="32" y="432" fill="#8d4734" font-size="21">Abstract designs and arrogant power</text>
      <text x="32" y="478" fill="#174c3a" font-size="20" font-weight="800">Repair in order to preserve</text>
    </g>

    <g transform="translate(485 0)">
      <rect width="455" height="525" rx="20" fill="#fffaf2" stroke="#b18a35" stroke-width="3"/>
      <rect width="455" height="105" rx="20" fill="#eee2c5"/>
      <path d="M0 85h455v20H0z" fill="#eee2c5"/>
      <text x="32" y="52" fill="#7b5e20" font-size="18" font-weight="800" letter-spacing="2">KOREAN USAGE</text>
      <text x="32" y="85" fill="#132f45" font-size="28" font-weight="800">Security, growth, order</text>
      <text x="32" y="155" fill="#243b46" font-size="23" font-weight="700">Formed through</text>
      <text x="32" y="195" fill="#5f533a" font-size="21">Division, war and industrialization</text>
      <text x="32" y="255" fill="#243b46" font-size="23" font-weight="700">Core associations</text>
      <text x="32" y="295" fill="#5f533a" font-size="21">Anti-communism, alliance, markets</text>
      <text x="32" y="329" fill="#5f533a" font-size="21">Law, property and responsibility</text>
      <text x="32" y="392" fill="#243b46" font-size="23" font-weight="700">Unresolved tension</text>
      <text x="32" y="432" fill="#8d4734" font-size="21">Liberty versus authoritarianism</text>
      <text x="32" y="478" fill="#7b5e20" font-size="20" font-weight="800">Separate achievement from power</text>
    </g>

    <g transform="translate(970 0)">
      <rect width="455" height="525" rx="20" fill="#f8fbf9" stroke="#132f45" stroke-width="3"/>
      <rect width="455" height="105" rx="20" fill="#dce5ec"/>
      <path d="M0 85h455v20H0z" fill="#dce5ec"/>
      <text x="32" y="52" fill="#174c3a" font-size="18" font-weight="800" letter-spacing="2">SEED VOICE</text>
      <text x="32" y="85" fill="#132f45" font-size="28" font-weight="800">An order where liberty endures</text>
      <text x="32" y="155" fill="#243b46" font-size="23" font-weight="700">Preserve</text>
      <text x="32" y="195" fill="#486158" font-size="21">Liberty, law, enterprise, security</text>
      <text x="32" y="255" fill="#243b46" font-size="23" font-weight="700">Reform</text>
      <text x="32" y="295" fill="#486158" font-size="21">Privilege, collusion, entry barriers</text>
      <text x="32" y="329" fill="#486158" font-size="21">Partisan power and authoritarianism</text>
      <text x="32" y="392" fill="#243b46" font-size="23" font-weight="700">The test</text>
      <text x="32" y="432" fill="#8d4734" font-size="21">Does the same rule bind our side?</text>
      <text x="32" y="478" fill="#174c3a" font-size="20" font-weight="800">Enterprise, not corporate privilege</text>
    </g>
  </g>

  <text x="800" y="815" text-anchor="middle" fill="#132f45" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Conservatism does not defend everything old. It chooses what deserves to endure.</text>
</svg>
