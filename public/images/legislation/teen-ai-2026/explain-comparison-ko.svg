<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" fill="#fff"/><text x="52" y="66" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="34" font-weight="700" fill="#253f36">현행 설명과 의원안, 무엇이 달라지나</text><text x="52" y="108" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#60736b">의안 2221842 · 발의자가 설명한 현행 규정과 공개 제안 요지 비교</text><rect x="42" y="145" width="1116" height="92" fill="#edf4ef"/><text x="62" y="182" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">보호 대상</text><text x="62" y="214" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">현행 설명: 만 14세 미만 아동</text><text x="640" y="199" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">의원안: 미성년자의 과도한 이용</text><rect x="42" y="245" width="1116" height="92" fill="#f7f8f6"/><text x="62" y="282" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">보호의 초점</text><text x="62" y="314" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">현행 설명: 부적절한 정보 제공 방지</text><text x="640" y="299" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">의원안: 장시간·심야 이용과 몰입</text><rect x="42" y="345" width="1116" height="92" fill="#edf4ef"/><text x="62" y="382" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">이용 안내</text><text x="62" y="414" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">주의사항·이용시간 경과 내역</text><text x="640" y="399" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">의원안의 공식 요지에 포함</text><rect x="42" y="445" width="1116" height="92" fill="#f7f8f6"/><text x="62" y="482" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">조절 수단</text><text x="62" y="514" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">이용방법·시간·시간대 제한 수단</text><text x="640" y="499" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">본인 또는 법정대리인의 요청</text><rect x="42" y="545" width="1116" height="92" fill="#edf4ef"/><text x="62" y="582" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">적용 상태</text><text x="62" y="614" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">발의된 개정안 · 시행 여부 미확인</text><text x="640" y="599" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">첨부 전문·이후 심사 추가 확인</text><text x="52" y="690" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" fill="#60736b">국회 공식 제안 요지 기준 · 정부안 비교 아님 · 기존 규정 전체와 의안 전문 미대조</text></svg>