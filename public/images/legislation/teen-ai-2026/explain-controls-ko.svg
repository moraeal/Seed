<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" fill="#fff"/><text x="52" y="66" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="34" font-weight="700" fill="#253f36">시간을 알리는 기능과 제한하는 기능</text><text x="52" y="108" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#60736b">제안 내용을 이해하기 위한 도식 · 실제 화면이나 확정 절차가 아닙니다</text><rect x="42" y="145" width="1116" height="92" fill="#edf4ef"/><text x="62" y="182" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">시간 안내</text><text x="62" y="214" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">이용시간 경과 내역을 화면에 표시</text><text x="640" y="199" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">사용자가 판단할 정보</text><rect x="42" y="245" width="1116" height="92" fill="#f7f8f6"/><text x="62" y="282" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">주의사항 안내</text><text x="62" y="314" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">과도한 이용에 관한 주의사항 표시</text><text x="640" y="299" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">위험을 인식할 정보</text><rect x="42" y="345" width="1116" height="92" fill="#edf4ef"/><text x="62" y="382" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">이용 조절 요청</text><text x="62" y="414" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">미성년자 본인 또는 법정대리인</text><text x="640" y="399" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">선택할 수단을 제공한다는 제안</text><rect x="42" y="445" width="1116" height="92" fill="#f7f8f6"/><text x="62" y="482" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">요청에 따른 제한</text><text x="62" y="514" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">이용방법·이용시간·이용시간대</text><text x="640" y="499" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">일괄 심야 차단과 다른 개념</text><rect x="42" y="545" width="1116" height="92" fill="#edf4ef"/><text x="62" y="582" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#253f36">아직 확인할 절차</text><text x="62" y="614" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="500" fill="#253f36">요청 충돌·해제·연령 확인 방식</text><text x="640" y="599" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#253f36">전문과 후속 심사에서 대조</text><text x="52" y="690" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="500" fill="#60736b">자료: 의안 2221842 공식 제안이유·주요내용 · 시행 결과를 나타내지 않습니다</text></svg>