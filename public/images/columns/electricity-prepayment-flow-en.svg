<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">How the proposed KRW 25 trillion electricity prepayment would work</title>
  <desc id="desc">Samsung Electronics and SK hynix would prepay five years of estimated electricity charges, KEPCO would finance grid construction, and future bills and interest would be settled later. Four safeguards remain essential.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#092f3b"/><stop offset="1" stop-color="#154d5c"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d44a3a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#092f3b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f5f3ec"/>
  <rect width="1600" height="210" fill="url(#header)"/>
  <text x="90" y="82" fill="#e1bd62" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="5">FACT CHECK · POLICY FLOW</text>
  <text x="90" y="148" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="900">Where would KRW 25 trillion in prepaid bills go?</text>
  <text x="90" y="187" fill="#d9e4e2" font-family="Arial, sans-serif" font-size="23">Separating the reported cash flow from terms that remain unsettled</text>
  <g filter="url(#shadow)"><rect x="90" y="265" width="380" height="285" rx="14" fill="#ffffff" stroke="#cbd5d1" stroke-width="2"/><rect x="610" y="265" width="380" height="285" rx="14" fill="#ffffff" stroke="#cbd5d1" stroke-width="2"/><rect x="1130" y="265" width="380" height="285" rx="14" fill="#ffffff" stroke="#cbd5d1" stroke-width="2"/></g>
  <g font-family="Arial, sans-serif">
    <circle cx="150" cy="327" r="30" fill="#d44a3a"/><text x="150" y="337" text-anchor="middle" fill="#fff" font-size="27" font-weight="900">1</text><text x="200" y="337" fill="#092f3b" font-size="28" font-weight="900">Corporate prepayment</text>
    <text x="135" y="407" fill="#263b40" font-size="24" font-weight="800">Samsung Electronics</text><text x="425" y="407" text-anchor="end" fill="#d44a3a" font-size="32" font-weight="900">KRW 20tn</text><line x1="135" y1="433" x2="425" y2="433" stroke="#d9dfdc" stroke-width="2"/>
    <text x="135" y="480" fill="#263b40" font-size="24" font-weight="800">SK hynix</text><text x="425" y="480" text-anchor="end" fill="#d44a3a" font-size="32" font-weight="900">KRW 5tn</text><text x="135" y="525" fill="#64736f" font-size="18">Estimated bills for 2027–2031</text>
    <circle cx="670" cy="327" r="30" fill="#d44a3a"/><text x="670" y="337" text-anchor="middle" fill="#fff" font-size="27" font-weight="900">2</text><text x="720" y="337" fill="#092f3b" font-size="28" font-weight="900">KEPCO financing</text>
    <text x="655" y="410" fill="#263b40" font-size="23" font-weight="800">Lines and substations</text><rect x="655" y="442" width="290" height="16" rx="8" fill="#dce7e2"/><rect x="655" y="442" width="216" height="16" rx="8" fill="#1e7562"/><text x="655" y="502" fill="#64736f" font-size="19">Yongin and Honam clusters</text><text x="655" y="532" fill="#64736f" font-size="19">Reduce pressure to issue bonds</text>
    <circle cx="1190" cy="327" r="30" fill="#d44a3a"/><text x="1190" y="337" text-anchor="middle" fill="#fff" font-size="27" font-weight="900">3</text><text x="1240" y="337" fill="#092f3b" font-size="28" font-weight="900">Future settlement</text>
    <text x="1175" y="410" fill="#263b40" font-size="22" font-weight="800">Offset against future bills</text><text x="1175" y="458" fill="#263b40" font-size="22" font-weight="800">Interest under discussion</text><rect x="1175" y="491" width="290" height="36" rx="18" fill="#fff0ed"/><text x="1320" y="516" text-anchor="middle" fill="#b33c2f" font-size="17" font-weight="900">May be booked as a liability</text>
    <path d="M485 408H585" fill="none" stroke="#d44a3a" stroke-width="7" marker-end="url(#arrow)"/><path d="M1005 408H1105" fill="none" stroke="#d44a3a" stroke-width="7" marker-end="url(#arrow)"/>
    <rect x="90" y="605" width="1420" height="300" rx="16" fill="#092f3b"/><text x="140" y="674" fill="#e1bd62" font-size="24" font-weight="900" letter-spacing="2">NOT YET A MANDATORY OR FINAL PAYMENT</text><text x="140" y="718" fill="#ffffff" font-size="29" font-weight="900">Four safeguards required to prove a voluntary agreement</text>
    <rect x="140" y="758" width="300" height="92" rx="10" fill="#164958"/><text x="170" y="795" fill="#e1bd62" font-size="18" font-weight="900">01 FREEDOM TO REFUSE</text><text x="170" y="829" fill="#fff" font-size="16">No supply or permit penalty</text>
    <rect x="480" y="758" width="300" height="92" rx="10" fill="#164958"/><text x="510" y="795" fill="#e1bd62" font-size="18" font-weight="900">02 RING-FENCED FUNDS</text><text x="510" y="829" fill="#fff" font-size="16">Disclose every use of funds</text>
    <rect x="820" y="758" width="300" height="92" rx="10" fill="#164958"/><text x="850" y="795" fill="#e1bd62" font-size="18" font-weight="900">03 REFUND GUARANTEE</text><text x="850" y="829" fill="#fff" font-size="16">Refund delays or cancellation</text>
    <rect x="1160" y="758" width="300" height="92" rx="10" fill="#164958"/><text x="1190" y="795" fill="#e1bd62" font-size="18" font-weight="900">04 PUBLIC SCRUTINY</text><text x="1190" y="829" fill="#fff" font-size="16">Review interest and accounting</text>
    <text x="90" y="955" fill="#6d7a76" font-size="18">As of Sept. 3, 2026: participation, amount, duration and interest remain under discussion.</text>
  </g>
</svg>
