<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t"><title id="t">눈치는 어디로 향할까요</title><rect width="1000" height="450" fill="#f6f3ec"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#193e37"><text x="64" y="84" font-size="44" font-weight="700">눈치는 어디로 향할까요</text><path d="M64 116h872" stroke="#b7c5bc" stroke-width="2"/><text x="64" y="184" font-size="32" font-weight="700">기색을 알아차리기</text><text x="64" y="234" font-size="29">입을 열었다 멈춘 동료를 봅니다.</text><path d="M64 272h872" stroke="#b7c5bc"/><text x="64" y="340" font-size="32" font-weight="700">내 행동을 조절하기</text><text x="64" y="390" font-size="29">수첩을 펴고 답할 시간을 줍니다.</text></g></svg>
