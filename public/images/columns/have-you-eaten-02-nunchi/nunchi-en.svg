<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t"><title id="t">Where does our attention go?</title><rect width="1000" height="450" fill="#f6f3ec"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#193e37"><text x="64" y="84" font-size="44" font-weight="700">Where does our attention go?</text><path d="M64 116h872" stroke="#b7c5bc" stroke-width="2"/><text x="64" y="184" font-size="32" font-weight="700">Notice a cue</text><text x="64" y="234" font-size="29">A colleague tries to speak, then pauses.</text><path d="M64 272h872" stroke="#b7c5bc"/><text x="64" y="340" font-size="32" font-weight="700">Adjust your response</text><text x="64" y="390" font-size="29">Reopen your notebook. Give them time.</text></g></svg>
