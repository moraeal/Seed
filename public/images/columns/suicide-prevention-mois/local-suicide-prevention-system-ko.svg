<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f8f7f2"/>
<style>.t{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#19251f}.h{font-size:38px;font-weight:700}.s{font-size:20px;fill:#506057}.b{font-size:25px;font-weight:700}.p{font-size:18px;fill:#425048}.n{font-size:20px;font-weight:700}</style>
<text class="t h" x="70" y="72">행안부가 연결해야 할 지역 생명안전망</text>
<text class="t s" x="70" y="110">조직과 인력은 행안부가, 전문지원은 복지부가, 관계와 실행은 지방정부·시민사회가 함께 맡는다</text>
<g stroke="#718077" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M600 260 L330 350"/><path d="M600 260 L870 350"/><path d="M330 480 L520 565"/><path d="M870 480 L680 565"/></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718077"/></marker></defs>
<rect x="390" y="160" width="420" height="120" rx="16" fill="#d4e8dc" stroke="#37614d" stroke-width="3"/><text class="t b" x="600" y="205" text-anchor="middle">행정안전부</text><text class="t p" x="600" y="241" text-anchor="middle">지방조직·정원·재원·성과 공개</text>
<rect x="100" y="350" width="460" height="135" rx="16" fill="#dce7e0" stroke="#82968a"/><text class="t b" x="330" y="397" text-anchor="middle">지방정부</text><text class="t p" x="330" y="432" text-anchor="middle">보건·복지·고용·주거·채무 지원 조정</text><text class="t p" x="330" y="462" text-anchor="middle">전담인력과 부단체장급 책임</text>
<rect x="640" y="350" width="460" height="135" rx="16" fill="#e7e2d7" stroke="#9a8d72"/><text class="t b" x="870" y="397" text-anchor="middle">보건복지부·전문기관</text><text class="t p" x="870" y="432" text-anchor="middle">상담·치료·위기대응·사후관리</text><text class="t p" x="870" y="462" text-anchor="middle">현장 공백과 서비스 이탈 공개</text>
<rect x="360" y="565" width="480" height="125" rx="62" fill="#f2d8d1" stroke="#a74435" stroke-width="3"/><text class="t b" x="600" y="612" text-anchor="middle">시민사회와 주민</text><text class="t p" x="600" y="648" text-anchor="middle">발견·동행·관계 회복·당사자 참여</text><text class="t p" x="600" y="676" text-anchor="middle">다년 지원으로 경험과 신뢰 축적</text>
</svg>
