<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect width="1200" height="780" fill="#f7f9fc"/><rect x="0" y="0" width="1200" height="11" fill="#d86a2d"/>
<text x="46" y="74" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="32" font-weight="800" fill="#14273e">AI Productivity Dividend vs. Budget-Funded Basic Income</text>
<text x="46" y="111" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" fill="#56647a">Two policy frameworks that begin with different questions</text>
<rect x="40" y="143" width="1120" height="80" rx="13" fill="#203651"/><text x="55" y="190" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Dimension</text><text x="295" y="190" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#ffffff">AI productivity dividend</text><text x="745" y="190" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Budget-funded basic income</text><rect x="40" y="232" width="1120" height="104" rx="12" fill="#ffffff"/><rect x="265" y="242" width="2" height="84" fill="#ced8e4"/><rect x="715" y="242" width="2" height="84" fill="#ced8e4"/><text x="55" y="262" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">Funding</text><text x="295" y="262" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">Public AI investment returns, shared</text><text x="295" y="288" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">assets, or designated revenue growth</text><text x="745" y="262" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">General taxes, budget reallocation,</text><text x="745" y="288" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">or public borrowing</text><rect x="40" y="344" width="1120" height="104" rx="12" fill="#eaf0f7"/><rect x="265" y="354" width="2" height="84" fill="#ced8e4"/><rect x="715" y="354" width="2" height="84" fill="#ced8e4"/><text x="55" y="374" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">Purpose</text><text x="295" y="374" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">Share measurable gains from</text><text x="295" y="400" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">technological productivity</text><text x="745" y="374" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">Income security, consumption</text><text x="745" y="400" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">support, or local stability</text><rect x="40" y="456" width="1120" height="104" rx="12" fill="#ffffff"/><rect x="265" y="466" width="2" height="84" fill="#ced8e4"/><rect x="715" y="466" width="2" height="84" fill="#ced8e4"/><text x="55" y="486" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">Transfer design</text><text x="295" y="486" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">Dividend or rebate linked to returns</text><text x="295" y="512" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">and legal entitlement</text><text x="745" y="486" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">Cash or vouchers under an approved</text><text x="745" y="512" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">budget and eligibility rules</text><rect x="40" y="568" width="1120" height="104" rx="12" fill="#eaf0f7"/><rect x="265" y="578" width="2" height="84" fill="#ced8e4"/><rect x="715" y="578" width="2" height="84" fill="#ced8e4"/><text x="55" y="598" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">Sustainability</text><text x="295" y="598" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">Verified returns, ownership,</text><text x="295" y="624" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">incentives and measurable gains</text><text x="745" y="598" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">Fiscal cost, outcomes,</text><text x="745" y="624" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">distributional impact and</text><text x="745" y="650" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">alternatives</text><rect x="40" y="693" width="1120" height="54" rx="10" fill="#f4e8dc"/><text x="54" y="725" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="16" fill="#69432d">Note: The models are not mutually exclusive. AI-related tax revenue may also fund basic income.</text></svg>