<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect width="1200" height="780" fill="#f7f9fc"/><rect x="0" y="0" width="1200" height="11" fill="#d86a2d"/>
<text x="46" y="74" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="34" font-weight="800" fill="#14273e">AI 생산성 배당과 일반재정 기본소득</text>
<text x="46" y="111" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" fill="#56647a">다른 질문에서 출발하는 두 정책 설계</text>
<rect x="40" y="143" width="1120" height="80" rx="13" fill="#203651"/><text x="55" y="190" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="21" font-weight="700" fill="#ffffff">비교 항목</text><text x="295" y="190" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="21" font-weight="700" fill="#ffffff">AI 생산성 배당</text><text x="745" y="190" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="21" font-weight="700" fill="#ffffff">일반재정 기본소득</text><rect x="40" y="232" width="1120" height="104" rx="12" fill="#ffffff"/><rect x="265" y="242" width="2" height="84" fill="#ced8e4"/><rect x="715" y="242" width="2" height="84" fill="#ced8e4"/><text x="55" y="262" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">재원 형성</text><text x="295" y="262" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">AI 관련 공적 투자수익·공유자산 수익·특정</text><text x="295" y="288" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f"> 세수 증가분 등 설계 가능</text><text x="745" y="262" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">일반 조세수입·기존 재정·국채 등 예산을 통</text><text x="745" y="288" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">해 조달</text><rect x="40" y="344" width="1120" height="104" rx="12" fill="#eaf0f7"/><rect x="265" y="354" width="2" height="84" fill="#ced8e4"/><rect x="715" y="354" width="2" height="84" fill="#ced8e4"/><text x="55" y="374" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">정책 목적</text><text x="295" y="374" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">기술혁신의 생산성 성과를 사회와 공유</text><text x="745" y="374" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">소득 보장·소비 지원·지역 생활안정 등</text><rect x="40" y="456" width="1120" height="104" rx="12" fill="#ffffff"/><rect x="265" y="466" width="2" height="84" fill="#ced8e4"/><rect x="715" y="466" width="2" height="84" fill="#ced8e4"/><text x="55" y="486" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">지급 방식</text><text x="295" y="486" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">정해진 수익·권리와 연동한 배당·환급 등</text><text x="745" y="486" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">법과 예산에 따른 정기·일시 지급 또는 지역</text><text x="745" y="512" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">화폐</text><rect x="40" y="568" width="1120" height="104" rx="12" fill="#eaf0f7"/><rect x="265" y="578" width="2" height="84" fill="#ced8e4"/><rect x="715" y="578" width="2" height="84" fill="#ced8e4"/><text x="55" y="598" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="19" font-weight="700" fill="#1e3b58">지속가능성 판단</text><text x="295" y="598" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">실제 성과와 수익의 측정·소유권·혁신 유인</text><text x="745" y="598" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" font-weight="500" fill="#28394f">재원 조달·재정 부담·정책 효과·대안 비교</text><rect x="40" y="693" width="1120" height="54" rx="10" fill="#f4e8dc"/><text x="54" y="725" font-family="Noto Sans KR, Pretendard, sans-serif" font-size="17" fill="#69432d">※ 두 방식은 상호 배타적이지 않다. AI 관련 조세를 일반재정 기본소득 재원에 활용할 수도 있다.</text></svg>