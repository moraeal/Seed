<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f5f3ed"/><text x="70" y="85" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="39" font-weight="700" fill="#162f29">Share valuation and top marginal burden</text><text x="70" y="130" font-family="sans-serif" font-size="23" fill="#4f625b">Illustration · additional share value of 100 subject to the premium</text><rect x="70" y="190" width="290" height="190" rx="16" fill="#fff"/><rect x="455" y="190" width="290" height="190" rx="16" fill="#fff"/><rect x="840" y="190" width="290" height="190" rx="16" fill="#e5eee5"/><g font-family="Pretendard, Noto Sans KR, sans-serif" text-anchor="middle" fill="#173c32"><text x="215" y="242" font-size="23">Share value</text><text x="600" y="242" font-size="23">20% premium</text><text x="985" y="242" font-size="23">50% top marginal rate</text><text x="215" y="315" font-size="28" font-weight="700">Additional value 100</text><text x="600" y="315" font-size="28" font-weight="700">Assessed value 120</text><text x="985" y="315" font-size="28" font-weight="700">Marginal tax 60</text><text x="408" y="300" font-size="42">→</text><text x="792" y="300" font-size="42">→</text></g><text x="70" y="475" font-family="sans-serif" font-size="23" fill="#495a55">Actual tax depends on eligibility and deductions.</text><text x="70" y="520" font-family="sans-serif" font-size="23" fill="#495a55">60% is relative to pre-premium value, not the statutory rate.</text></svg>