<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f5f3ed"/><text x="70" y="85" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="39" font-weight="700" fill="#162f29">상속주식 평가와 최고 한계 부담</text><text x="70" y="130" font-family="sans-serif" font-size="23" fill="#4f625b">설명용 예시 · 할증 대상 주식의 추가 가치 100</text><rect x="70" y="190" width="290" height="190" rx="16" fill="#fff"/><rect x="455" y="190" width="290" height="190" rx="16" fill="#fff"/><rect x="840" y="190" width="290" height="190" rx="16" fill="#e5eee5"/><g font-family="Pretendard, Noto Sans KR, sans-serif" text-anchor="middle" fill="#173c32"><text x="215" y="242" font-size="23">주식 평가액</text><text x="600" y="242" font-size="23">할증평가 20%</text><text x="985" y="242" font-size="23">50% 최고 한계세율</text><text x="215" y="315" font-size="28" font-weight="700">추가 가치 100</text><text x="600" y="315" font-size="28" font-weight="700">평가액 120</text><text x="985" y="315" font-size="28" font-weight="700">최고 한계세액 60</text><text x="408" y="300" font-size="42">→</text><text x="792" y="300" font-size="42">→</text></g><text x="70" y="475" font-family="sans-serif" font-size="23" fill="#495a55">적용 요건·공제에 따라 실제 세액은 달라집니다.</text><text x="70" y="520" font-family="sans-serif" font-size="23" fill="#495a55">60%는 법정세율이 아니라 할증 전 가치 대비 한계 부담입니다.</text></svg>