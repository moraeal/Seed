<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f3f6f5"/><text x="72" y="85" font-size="38" font-weight="700" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">대법관 정원과 임명 가능 인원</text><text x="72" y="125" font-size="21" fill="#526970" font-family="Noto Sans CJK KR,Arial,sans-serif">정원 확대와 임기 중 임명 전망은 서로 다른 숫자입니다</text><text x="72" y="205" font-size="24" font-weight="600" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">기존 정원</text><rect x="72" y="223" width="980" height="42" rx="8" fill="#dde5e7"/><rect x="72" y="223" width="528" height="42" rx="8" fill="#8198a1"/><text x="1080" y="254" font-size="34" font-weight="700" fill="#8198a1" font-family="Arial,sans-serif">14</text><text x="72" y="325" font-size="24" font-weight="600" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">개정 후 정원</text><rect x="72" y="343" width="980" height="42" rx="8" fill="#dde5e7"/><rect x="72" y="343" width="980" height="42" rx="8" fill="#163e50"/><text x="1080" y="374" font-size="34" font-weight="700" fill="#163e50" font-family="Arial,sans-serif">26</text><text x="72" y="445" font-size="24" font-weight="600" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">현 대통령 임기 중 임명 전망</text><rect x="72" y="463" width="980" height="42" rx="8" fill="#dde5e7"/><rect x="72" y="463" width="829" height="42" rx="8" fill="#ac6438"/><text x="1080" y="494" font-size="34" font-weight="700" fill="#ac6438" font-family="Arial,sans-serif">22</text><text x="72" y="588" font-size="21" fill="#344e57" font-family="Noto Sans CJK KR,Arial,sans-serif">22명 = 신규 12명 + 임기 만료 10명의 후임 전망</text><text x="72" y="625" font-size="18" fill="#63777e" font-family="Noto Sans CJK KR,Arial,sans-serif">실제 인사 일정은 달라질 수 있음 · 사법부 통제 의도의 증거는 아님</text></svg>