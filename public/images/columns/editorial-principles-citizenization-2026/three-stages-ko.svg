<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" role="img" aria-label="산업화 민주화 시민화 세 단계"><rect width="1320" height="480" rx="0" fill="#fcfbf6"/><text x="60" y="65" fill="#234b37" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="37" font-weight="800">산업화·민주화의 성취 위에 시민화를 세우다</text><text x="60" y="108" fill="#688172" font-family="Noto Sans KR,Arial,sans-serif" font-size="21">씨앗의 소리 · 대한민국의 다음 단계</text><g><rect x="46" y="147" width="370" height="248" rx="24" fill="#e9e2d0" stroke="#c1d2c1"/><circle cx="88" cy="196" r="23" fill="#2a6146"/><text x="88" y="204" fill="white" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">1</text><text x="81" y="263" fill="#173e2e" font-size="38" font-family="Noto Sans KR,Arial,sans-serif" font-weight="800">산업화</text><text x="81" y="313" fill="#375b49" font-size="24" font-family="Noto Sans KR,Arial,sans-serif" font-weight="600">성장과 번영의 기반</text><text x="81" y="352" fill="#556e5d" font-size="21" font-family="Noto Sans KR,Arial,sans-serif">경제적 자립</text></g><g><rect x="475" y="147" width="370" height="248" rx="24" fill="#d5e9de" stroke="#c1d2c1"/><circle cx="517" cy="196" r="23" fill="#2a6146"/><text x="517" y="204" fill="white" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">2</text><text x="510" y="263" fill="#173e2e" font-size="38" font-family="Noto Sans KR,Arial,sans-serif" font-weight="800">민주화</text><text x="510" y="313" fill="#375b49" font-size="24" font-family="Noto Sans KR,Arial,sans-serif" font-weight="600">정치적 권리 확대</text><text x="510" y="352" fill="#556e5d" font-size="21" font-family="Noto Sans KR,Arial,sans-serif">선택과 교체</text></g><g><rect x="904" y="147" width="370" height="248" rx="24" fill="#e6efbc" stroke="#c1d2c1"/><circle cx="946" cy="196" r="23" fill="#2a6146"/><text x="946" y="204" fill="white" font-size="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">3</text><text x="939" y="263" fill="#1