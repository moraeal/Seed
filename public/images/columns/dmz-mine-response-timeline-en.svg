<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A dated record after the blasts</title><desc id="desc">The sequence alone does not establish why the inquiry began later</desc><rect width="1200" height="620" fill="#f8f6f0"/><text x="70" y="80" fill="#192c37" font-family="Noto Sans KR,Arial,sans-serif" font-size="37" font-weight="750">A dated record after the blasts</text><text x="70" y="118" fill="#52626a" font-family="Noto Sans KR,Arial,sans-serif" font-size="22">The sequence alone does not establish why the inquiry began later</text><line x1="115" y1="188" x2="115" y2="492" stroke="#a9bfc1" stroke-width="3"/><circle cx="115" cy="198" r="10" fill="#277e81"/><text x="153" y="206" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">Sep 21</text><text x="340" y="206" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">DMZ blasts injure three South Korean soldiers</text><circle cx="115" cy="296" r="10" fill="#277e81"/><text x="153" y="304" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">Sep 23</text><text x="340" y="304" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">President addresses the UN on peaceful coexistence</text><circle cx="115" cy="394" r="10" fill="#277e81"/><text x="153" y="402" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">Sep 27</text><text x="340" y="402" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">Military and UN Command begin field inquiry</text><circle cx="115" cy="492" r="10" fill="#277e81"/><text x="153" y="500" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">Sep 28</text><text x="340" y="500" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">Military assesses North Korean mines as highly likely</text></s