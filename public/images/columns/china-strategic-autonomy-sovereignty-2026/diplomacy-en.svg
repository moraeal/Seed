<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
<rect width="1200" height="750" fill="#f4f7f5"/>
<text x="55" y="73" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="40" font-weight="700" fill="#173536">One summit, two official accounts</text>
<text x="57" y="113" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="23" font-weight="500" fill="#637674">Shenzhen summit · November 18, 2026</text>
<rect x="55" y="150" width="1090" height="143" rx="9" fill="#ffffff"/>
<rect x="55" y="150" width="10" height="143" fill="#d57a60"/>
<text x="86" y="192" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#243d42">China’s Foreign Ministry</text>
<text x="86" y="234" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#243d42">Strategic autonomy and political foundation</text>
<text x="86" y="270" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#243d42">Exchanges among parties, governments, legislatures</text>
<rect x="55" y="318" width="1090" height="143" rx="9" fill="#ffffff"/>
<rect x="55" y="318" width="10" height="143" fill="#4d8f79"/>
<text x="86" y="360" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#243d42">South Korean presidential office</text>
<text x="86" y="402" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#243d42">Korean Peninsula is a vital Korean interest</text>
<text x="86" y="438" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#243d42">Economic, cultural exchanges and China’s role</text>
<rect x="55" y="486" width="1090" height="143" rx="9" fill="#ffffff"/>
<rect x="55" y="486" width="10" height="143" fill="#b2a26e"/>
<text x="86" y="528" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#243d42">Limits of the public record</text>
<text x="86" y="570" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#243d42">Seoul’s direct response to the autonomy phrase</text>
<text x="86" y="606" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="500" fill="#243d42">and the full conversation were not disclosed</text>
<text x="57" y="714" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#667875">Sources: Chinese and South Korean official statements · Neither is a transcript</text>
</svg>