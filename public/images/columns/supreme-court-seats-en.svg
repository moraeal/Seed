<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f3f6f5"/><text x="72" y="85" font-size="38" font-weight="700" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">Supreme Court seats and potential appointments</text><text x="72" y="125" font-size="21" fill="#526970" font-family="Noto Sans CJK KR,Arial,sans-serif">Court expansion and term-based projections measure different things</text><text x="72" y="205" font-size="24" font-weight="600" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">Previous seats</text><rect x="72" y="223" width="980" height="42" rx="8" fill="#dde5e7"/><rect x="72" y="223" width="528" height="42" rx="8" fill="#8198a1"/><text x="1080" y="254" font-size="34" font-weight="700" fill="#8198a1" font-family="Arial,sans-serif">14</text><text x="72" y="325" font-size="24" font-weight="600" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">Eventual seats</text><rect x="72" y="343" width="980" height="42" rx="8" fill="#dde5e7"/><rect x="72" y="343" width="980" height="42" rx="8" fill="#163e50"/><text x="1080" y="374" font-size="34" font-weight="700" fill="#163e50" font-family="Arial,sans-serif">26</text><text x="72" y="445" font-size="24" font-weight="600" fill="#173e50" font-family="Noto Sans CJK KR,Arial,sans-serif">Projected appointments in current term</text><rect x="72" y="463" width="980" height="42" rx="8" fill="#dde5e7"/><rect x="72" y="463" width="829" height="42" rx="8" fill="#ac6438"/><text x="1080" y="494" font-size="34" font-weight="700" fill="#ac6438" font-family="Arial,sans-serif">22</text><text x="72" y="588" font-size="21" fill="#344e57" font-family="Noto Sans CJK KR,Arial,sans-serif">22 = 12 new seats + 10 projected replacements</text><text x="72" y="625" font-size="18" fill="#63777e" font-family="Noto Sans CJK KR,Arial,sans-serif">Actual timing may change · The figure does not establish intent to control the court</text></svg>