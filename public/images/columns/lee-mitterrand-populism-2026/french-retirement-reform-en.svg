<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780">
<rect width="1240" height="780" fill="#ffffff"/>
<text x="65" y="90" fill="#18263d" font-family="Arial,sans-serif" font-size="39" font-weight="700">French pension reform: four turning points</text>
<text x="65" y="140" fill="#67758a" font-family="Arial,sans-serif" font-size="23">A political promise can outlast several administrations</text>
<line x1="65" y1="173" x2="1175" y2="173" stroke="#d6dee7" stroke-width="3"/>
<rect x="69" y="197" width="1100" height="105" rx="13" fill="#fff1ec"/><text x="105" y="246" font-size="31" font-family="Arial,sans-serif" fill="#445368" font-weight="700">1982</text><text x="280" y="248" font-size="34" font-family="Arial,sans-serif" fill="#ab4236" font-weight="700">Age 60</text><text x="560" y="249" font-size="23" font-family="Arial,sans-serif" fill="#4a5765">Mitterrand: full pensions for qualifying workers</text><rect x="69" y="322" width="1100" height="105" rx="13" fill="#f1f6fb"/><text x="105" y="371" font-size="31" font-family="Arial,sans-serif" fill="#445368" font-weight="700">2010</text><text x="280" y="373" font-size="34" font-family="Arial,sans-serif" fill="#263b53" font-weight="700">Age 62</text><text x="560" y="374" font-size="23" font-family="Arial,sans-serif" fill="#4a5765">Sarkozy: legislated increase</text><rect x="69" y="447" width="1100" height="105" rx="13" fill="#f1f6fb"/><text x="105" y="496" font-size="31" font-family="Arial,sans-serif" fill="#445368" font-weight="700">2023</text><text x="280" y="498" font-size="34" font-family="Arial,sans-serif" fill="#263b53" font-weight="700">Age 64 target</text><text x="560" y="499" font-size="23" font-family="Arial,sans-serif" fill="#4a5765">Macron: phased reform</text><rect x="69" y="572" width="1100" height="105" rx="13" fill="#eff2f6"/><text x="105" y="621" font-size="31" font-family="Arial,sans-serif" fill="#445368" font-weight="700">2026</text><text x="280" y="623" font-size="34" font-family="Arial,sans-serif" fill="#263b53" font-weight="700">Delay</text><text x="560" y="624" font-size="23" font-family="Arial,sans-serif" fill="#4a5765">Further increases partly postponed</text>
<text x="73" y="741" font-size="18" fill="#67788b" font-family="Arial,sans-serif">Overview only. Eligibility also depends on birth cohort and contribution history.</text></svg>