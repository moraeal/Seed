<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780"><rect width="1240" height="780" fill="#fff"/><text x="68" y="92" fill="#18263d" font-size="40" font-weight="750" font-family="Noto Sans KR,Arial,sans-serif">프랑스 연금 수급 연령, 44년의 조정</text><text x="68" y="139" fill="#6b7686" font-size="22" font-family="Noto Sans KR,Arial,sans-serif">정책은 빠르게 시작되지만 재정과 제도 개편은 오래 걸린다</text><path d="M78 181 H1160" stroke="#d6dee7" stroke-width="3"/><rect x="70" y="203" width="1100" height="105" rx="14" fill="#fdf0ec"/><text x="105" y="251" font-family="Noto Sans KR,Arial" fill="#445368" font-size="30" font-weight="700">1982</text><text x="280" y="253" fill="#ab4236" font-family="Noto Sans KR,Arial" font-size="37" font-weight="750">60세</text><text x="560" y="256" fill="#4a5765" font-family="Noto Sans KR,Arial" font-size="25">미테랑 정부 · 완전연금 조건 하 조기 수급</text><rect x="70" y="328" width="1100" height="105" rx="14" fill="#f1f6fb"/><text x="105" y="376" font-family="Noto Sans KR,Arial" fill="#445368" font-size="30" font-weight="700">2010</text><text x="280" y="378" fill="#263b53" font-family="Noto Sans KR,Arial" font-size="37" font-weight="750">62세</text><text x="560" y="381" fill="#4a5765" font-family="Noto Sans KR,Arial" font-size="25">사르코지 정부 · 연령 상향</text><rect x="70" y="453" width="1100" height="105" rx="14" fill="#f1f6fb"/><text x="105" y="501" font-family="Noto Sans KR,Arial" fill="#445368" font-size="30" font-weight="700">2023</text><text x="280" y="503" fill="#263b53" font-family="Noto Sans KR,Arial" font-size="37" font-weight="750">64세 목표</text><text x="560" y="506" fill="#4a5765" font-family="Noto Sans KR,Arial" font-size="25">마크롱 정부 · 단계적 상향 개혁</text><rect x="70" y="578" width="1100" height="105" rx="14" fill="#eff2f6"/><text x="105" y="626" font-family="Noto Sans KR,Arial" fill="#445368" font-size="30" font-weight="700">2026</text><text x="280" y="628" fill="#263b53" font-family="Noto Sans KR,Arial" font-size="37" font-weight="750">일부 유예</text><text x="560" y="631" fill="#4a5765" font-family="Noto Sans KR,Arial" font-size="25">추가 상향 일정 조정</text><text x="72" y="744" fill="#67788b" font-size="18" font-family="Noto Sans KR,Arial">※ 제도 변화의 주요 시점만 요약. 가입기간과 출생연도에 따른 적용 요건이 다를 수 있음.</text></svg>