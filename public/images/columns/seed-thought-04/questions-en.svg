<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><rect width="1200" height="570" fill="#f3f7f3"/><g font-family="Pretendard, Noto Sans KR, sans-serif"><text x="55" y="80" font-size="34" font-weight="700" fill="#193e2d">Five questions for public-interest projects</text><rect x="55" y="130" width="1090" height="62" rx="10" fill="#fff"/><text x="78" y="172" font-size="26" font-weight="700" fill="#277151">01</text><text x="145" y="172" font-size="27" fill="#22342c">Who benefits?</text><rect x="55" y="208" width="1090" height="62" rx="10" fill="#fff"/><text x="78" y="250" font-size="26" font-weight="700" fill="#277151">02</text><text x="145" y="250" font-size="27" fill="#22342c">Who decided?</text><rect x="55" y="286" width="1090" height="62" rx="10" fill="#fff"/><text x="78" y="328" font-size="26" font-weight="700" fill="#277151">03</text><text x="145" y="328" font-size="27" fill="#22342c">What were the costs and results?</text><rect x="55" y="364" width="1090" height="62" rx="10" fill="#fff"/><text x="78" y="406" font-size="26" font-weight="700" fill="#277151">04</text><text x="145" y="406" font-size="27" fill="#22342c">Who or what was left out?</text><rect x="55" y="442" width="1090" height="62" rx="10" fill="#fff"/><text x="78" y="484" font-size="26" font-weight="700" fill="#277151">05</text><text x="145" y="484" font-size="27" fill="#22342c">Who fixes problems?</text></g></svg>