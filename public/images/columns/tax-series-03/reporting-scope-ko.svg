<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f7f8f5"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#252a2e"><text x="65" y="85" font-size="40" font-weight="700">1099-K · 제3자 결제업체의 연방 보고 기준</text><rect x="65" y="135" width="460" height="240" rx="12" fill="#e4eee8"/><rect x="675" y="135" width="460" height="240" rx="12" fill="#e4eee8"/><text x="295" y="205" text-anchor="middle" font-size="29" font-weight="500">연간 대금</text><text x="295" y="285" text-anchor="middle" font-size="48" font-weight="700" fill="#245541">2만 달러 초과</text><text x="600" y="265" text-anchor="middle" font-size="27" font-weight="700">그리고</text><text x="905" y="205" text-anchor="middle" font-size="29" font-weight="500">연간 거래</text><text x="905" y="285" text-anchor="middle" font-size="48" font-weight="700" fill="#245541">200건 초과</text><text x="600" y="432" text-anchor="middle" font-size="32" font-weight="700">두 조건을 모두 충족</text><text x="65" y="502" font-size="27" font-weight="500">자료 보고 기준입니다. 소득세 면제 기준이 아닙니다.</text><text x="65" y="547" font-size="27" font-weight="500">직접 카드 결제는 다른 기준을 적용합니다.</text><text x="65" y="613" font-size="22" fill="#69736e">자료: IRS · 2026년 10월 9일 확인</text></g></svg>