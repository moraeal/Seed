<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f7f8f5"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#252a2e"><text x="65" y="85" font-size="38" font-weight="700">1099-K: federal TPSO reporting threshold</text><rect x="65" y="135" width="460" height="240" rx="12" fill="#e4eee8"/><rect x="675" y="135" width="460" height="240" rx="12" fill="#e4eee8"/><text x="295" y="205" text-anchor="middle" font-size="29" font-weight="500">Payments over</text><text x="295" y="285" text-anchor="middle" font-size="48" font-weight="700" fill="#245541">$20,000</text><text x="600" y="265" text-anchor="middle" font-size="27" font-weight="700">AND</text><text x="905" y="205" text-anchor="middle" font-size="29" font-weight="500">More than</text><text x="905" y="285" text-anchor="middle" font-size="43" font-weight="700" fill="#245541">200 transactions</text><text x="600" y="432" text-anchor="middle" font-size="32" font-weight="700">Both conditions must be met</text><text x="65" y="502" font-size="27" font-weight="500">This is a reporting threshold, not an income-tax exemption.</text><text x="65" y="547" font-size="27" font-weight="500">Direct card payments follow different rules.</text><text x="65" y="613" font-size="22" fill="#69736e">Source: IRS · verified October 9, 2026</text></g></svg>