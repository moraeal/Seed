<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8f6ef"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#193b35;font-weight:500}.head{font-weight:700}</style><text x="70" y="90" font-size="48" class="head">사회투자기금 분쟁, 양측은 무엇을 말하나</text><rect x="60" y="140" width="1480" height="88" fill="#deebe1"/><text x="80" y="195" font-size="32" class="head">쟁점</text><text x="400" y="195" font-size="32" class="head">기고의 주장</text><text x="940" y="195" font-size="32" class="head">서울시 해명</text><rect x="60" y="228" width="1480" height="114" fill="#ffffff"/><text x="80" y="275" font-size="29" class="head">상환 청구</text><text x="400" y="275" font-size="29" class="">재난 손실까지 민간·개인 부담</text><text x="940" y="275" font-size="29">원금·분할상환금·이자 연체에 따른</text><text x="940" y="313" font-size="29">회수</text><path d="M60 342H1540" stroke="#cfdbd1"/><text x="80" y="389" font-size="29" class="head">사업 참여 조건</text><text x="400" y="389" font-size="29" class="">담보·연대보증이 공익 취지와 충돌</text><text x="940" y="389" font-size="29">공개 조건을 숙지해 자발적으로</text><text x="940" y="427" font-size="29">참여</text><path d="M60 456H1540" stroke="#cfdbd1"/><rect x="60" y="456" width="1480" height="114" fill="#ffffff"/><text x="80" y="503" font-size="29" class="head">2020년 논의</text><text x="400" y="503" font-size="29" class="">부담 완화 약속을 이행해야</text><text x="940" y="503" font-size="29">향후 제도 검토, 기존 손실보전</text><text x="940" y="541" font-size="29">약정 아님</text><path d="M60 570H1540" stroke="#cfdbd1"/><text x="80" y="617" font-size="29" class="head">연대보증</text><text x="400" y="617" font-size="29" class="">정부의 폐지 방향에 뒤처짐</text><text x="940" y="617" font-size="29">정책금융기관 대상 조치, 현재는</text><text x="940" y="655" font-size="29">특례보증</text><path d="M60 684H1540" stroke="#cfdbd1"/><rect x="60" y="684" width="1480" height="114" fill="#ffffff"/><text x="80" y="731" font-size="29" class="head">분쟁 해결</text><text x="400" y="731" font-size="29" class="">공공의 위험 분담·수행기관 보호</text><text x="940" y="731" font-size="29">감면 근거 없음, 법원 판단 따라</text><text x="940" y="769" font-size="29">조치</text><path d="M60 798H1540" stroke="#cfdbd1"/><text x="70" y="855" font-size="24">자료: 한겨레 기고(10.7), 서울시 해명(10.2·앞선 보도 답변) | 법적 책임의 확정 판단이 아님</text></svg>