<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8f6ef"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#193b35;font-weight:500}.head{font-weight:700}</style><text x="70" y="90" font-size="48" class="head">Social Investment Fund: the two positions</text><rect x="60" y="140" width="1480" height="88" fill="#deebe1"/><text x="80" y="195" font-size="32" class="head">Issue</text><text x="400" y="195" font-size="32" class="head">Contribution’s argument</text><text x="940" y="195" font-size="32" class="head">Seoul’s response</text><rect x="60" y="228" width="1480" height="114" fill="#ffffff"/><text x="80" y="275" font-size="26" class="head">Repayment</text><text x="400" y="275" font-size="26" class="">Disaster losses fall on private</text><text x="400" y="313" font-size="26" class="">actors</text><text x="940" y="275" font-size="26" class="">Recovery follows principal and</text><text x="940" y="313" font-size="26" class="">interest defaults</text><path d="M60 342H1540" stroke="#cfdbd1"/><text x="80" y="389" font-size="26" class="head">Participation terms</text><text x="400" y="389" font-size="26" class="">Collateral and guarantees conflict</text><text x="400" y="427" font-size="26" class="">with purpose</text><text x="940" y="389" font-size="26" class="">Terms disclosed; operators joined</text><text x="940" y="427" font-size="26" class="">voluntarily</text><path d="M60 456H1540" stroke="#cfdbd1"/><rect x="60" y="456" width="1480" height="114" fill="#ffffff"/><text x="80" y="503" font-size="26" class="head">2020 discussion</text><text x="400" y="503" font-size="26" class="">Honour the commitment to ease losses</text><text x="940" y="503" font-size="26" class="">Future reform considered; no loss-</text><text x="940" y="541" font-size="26" class="">cover agreement</text><path d="M60 570H1540" stroke="#cfdbd1"/><text x="80" y="617" font-size="26" class="head">Personal guarantees</text><text x="400" y="617" font-size="26" class="">Out of step with national policy</text><text x="940" y="617" font-size="26" class="">Policy had limited scope; new loans</text><text x="940" y="655" font-size="26" class="">use guarantees</text><path d="M60 684H1540" stroke="#cfdbd1"/><rect x="60" y="684" width="1480" height="114" fill="#ffffff"/><text x="80" y="731" font-size="26" class="head">Resolution</text><text x="400" y="731" font-size="26" class="">Share risk and protect</text><text x="400" y="769" font-size="26" class="">intermediaries</text><text x="940" y="731" font-size="26" class="">No basis for relief; follow the</text><text x="940" y="769" font-size="26" class="">court’s judgment</text><path d="M60 798H1540" stroke="#cfdbd1"/><text x="70" y="855" font-size="24">Sources: Hankyoreh contribution (Oct 7); Seoul response (Oct 2, to earlier report). Not a legal finding.</text></svg>