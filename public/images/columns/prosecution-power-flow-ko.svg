<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
  <title id="title">검찰청 폐지 전후의 국가 수사·기소 권력 구조</title>
  <desc id="desc">검찰청이 공소청, 중수청, 경찰로 분리되어도 국가 강제력은 남는다는 점을 보여주는 세로형 인포그래픽</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#315e50"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19362f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1000" height="1400" fill="#f4f0e7"/>
  <rect width="1000" height="190" fill="#173f35"/>
  <text x="500" y="70" text-anchor="middle" fill="#fff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="42" font-weight="800">간판은 사라져도</text>
  <text x="500" y="120" text-anchor="middle" fill="#fff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="42" font-weight="800">강제력은 사라지지 않는다</text>
  <text x="500" y="158" text-anchor="middle" fill="#d9e7e2" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21">검찰청 폐지 전후의 수사·기소 권력</text>
  <rect x="70" y="230" width="860" height="255" rx="22" fill="#fff" filter="url(#shadow)"/>
  <text x="105" y="275" fill="#796c5b" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="800">이전 구조</text>
  <rect x="145" y="310" width="260" height="70" rx="14" fill="#e5eee9" stroke="#315e50" stroke-width="2"/>
  <text x="275" y="354" text-anchor="middle" fill="#173f35" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="25" font-weight="700">법무부</text>
  <line x1="405" y1="345" x2="520" y2="345" stroke="#315e50" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="535" y="300" width="330" height="90" rx="14" fill="#315e50"/>
  <text x="700" y="339" text-anchor="middle" fill="#fff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="27" font-weight="800">검찰청</text>
  <text x="700" y="370" text-anchor="middle" fill="#e5eee9" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="19">직접수사 · 기소 · 공소유지</text>
  <text x="500" y="440" text-anchor="middle" fill="#6f675d" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="19">한 기관에 집중됐던 권한</text>
  <rect x="70" y="525" width="860" height="340" rx="22" fill="#fff" filter="url(#shadow)"/>
  <text x="105" y="570" fill="#b34f3f" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="800">개편 이후</text>
  <rect x="120" y="605" width="300" height="68" rx="14" fill="#e5eee9" stroke="#315e50" stroke-width="2"/>
  <text x="270" y="647" text-anchor="middle" fill="#173f35" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="700">법무부</text>
  <rect x="580" y="605" width="300" height="68" rx="14" fill="#e5eee9" stroke="#315e50" stroke-width="2"/>
  <text x="730" y="647" text-anchor="middle" fill="#173f35" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" font-weight="700">행정안전부</text>
  <line x1="270" y1="673" x2="270" y2="722" stroke="#315e50" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="730" y1="673" x2="730" y2="722" stroke="#315e50" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="120" y="732" width="300" height="92" rx="14" fill="#315e50"/>
  <text x="270" y="772" text-anchor="middle" fill="#fff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="800">공소청</text>
  <text x="270" y="802" text-anchor="middle" fill="#e5eee9" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18">기소 · 공소유지</text>
  <rect x="580" y="732" width="300" height="92" rx="14" fill="#315e50"/>
  <text x="730" y="772" text-anchor="middle" fill="#fff" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="25" font-weight="800">중수청 · 경찰</text>
  <text x="730" y="802" text-anchor="middle" fill="#e5eee9" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18">중대범죄 · 1차 수사</text>
  <text x="500" y="925" text-anchor="middle" fill="#173f35" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="27" font-weight="800">시민이 실제로 겪는 사건의 흐름</text>
  <rect x="55" y="965" width="260" height="78" rx="39" fill="#fff" stroke="#c5bba9" stroke-width="2"/>
  <text x="185" y="1013" text-anchor="middle" fill="#2a2a2a" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" font-weight="700">시민·기업의 사건</text>
  <line x1="315" y1="1004" x2="365" y2="1004" stroke="#315e50" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="375" y="965" width="250" height="78" rx="39" fill="#fff" stroke="#c5bba9" stroke-width="2"/>
  <text x="500" y="1013" text-anchor="middle" fill="#2a2a2a" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" font-weight="700">경찰·중수청 수사</text>
  <line x1="625" y1="1004" x2="675" y2="1004" stroke="#315e50" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="685" y="965" width="260" height="78" rx="39" fill="#fff" stroke="#c5bba9" stroke-width="2"/>
  <text x="815" y="1013" text-anchor="middle" fill="#2a2a2a" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" font-weight="700">공소청·법원</text>
  <rect x="70" y="1095" width="860" height="220" rx="20" fill="#efe4d7"/>
  <text x="105" y="1140" fill="#b34f3f" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="800">개편 뒤에도 남는 질문</text>
  <text x="115" y="1195" fill="#3b342d" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="700">기관 증가</text>
  <text x="385" y="1195" fill="#3b342d" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="700">책임 불명확</text>
  <text x="690" y="1195" fill="#3b342d" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="700">정치적 통제 잔존</text>
  <line x1="105" y1="1230" x2="895" y2="1230" stroke="#cdbca8" stroke-width="2"/>
  <text x="105" y="1274" fill="#173f35" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" font-weight="800">씨앗의 기준</text>
  <text x="275" y="1274" fill="#173f35" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20">강제력 총량 · 시민 방어권 · 책임의 명확성</text>
  <text x="500" y="1360" text-anchor="middle" fill="#6f675d" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15">정부 법률·직제안을 토대로 단순화했습니다.</text>
  <text x="500" y="1382" text-anchor="middle" fill="#6f675d" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15">보완수사권 등 세부 운영은 후속 제도에 따라 달라질 수 있습니다.</text>
</svg>
