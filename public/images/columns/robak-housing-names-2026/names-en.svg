<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><g font-family="Noto Sans CJK KR, Noto Sans KR, Pretendard, sans-serif"><text x="80" y="110" font-size="49" font-weight="700" fill="#142d3b">Two meanings a home’s name can carry</text><line x1="80" y1="153" x2="1520" y2="153" stroke="#b5bfc4"/><rect x="80" y="220" width="700" height="450" fill="#eef6f1"/><rect x="80" y="220" width="700" height="9" fill="#1f644b"/><text x="116" y="310" font-size="38" font-weight="700" fill="#1f644b">A name that connects</text><text x="116" y="415" font-size="30" font-weight="500" fill="#263e4a">Neighborhood memory and landscape</text><text x="116" y="499" font-size="30" font-weight="500" fill="#263e4a">The lives people will lead there</text><text x="116" y="583" font-size="30" font-weight="500" fill="#263e4a">A word naming a shared place</text><rect x="820" y="220" width="700" height="450" fill="#fbf3e9"/><rect x="820" y="220" width="700" height="9" fill="#a36b32"/><text x="856" y="310" font-size="38" font-weight="700" fill="#a36b32">A name that distinguishes</text><text x="856" y="415" font-size="30" font-weight="500" fill="#263e4a">Prestige and exclusivity</text><text x="856" y="499" font-size="30" font-weight="500" fill="#263e4a">Residents’ status and circumstances</text><text x="856" y="583" font-size="30" font-weight="500" fill="#263e4a">A word suggesting social rank</text><text x="80" y="780" font-size="31" fill="#3b505a">The meaning remains in how we speak to—and welcome—our neighbors.</text><text x="80" y="840" font-size="22" fill="#718087">SEED VOICE · 2026.10.09</text></g></svg>