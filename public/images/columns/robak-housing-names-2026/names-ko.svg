<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><g font-family="Noto Sans CJK KR, Noto Sans KR, Pretendard, sans-serif"><text x="80" y="110" font-size="49" font-weight="700" fill="#142d3b">집의 이름이 전하는 두 가지 뜻</text><line x1="80" y1="153" x2="1520" y2="153" stroke="#b5bfc4"/><rect x="80" y="220" width="700" height="450" fill="#eef6f1"/><rect x="80" y="220" width="700" height="9" fill="#1f644b"/><text x="116" y="310" font-size="38" font-weight="700" fill="#1f644b">이웃을 연결하는 이름</text><text x="116" y="415" font-size="34" font-weight="500" fill="#263e4a">동네의 기억과 지형</text><text x="116" y="499" font-size="34" font-weight="500" fill="#263e4a">그곳에서 살아갈 생활</text><text x="116" y="583" font-size="34" font-weight="500" fill="#263e4a">함께 사는 곳을 알리는 말</text><rect x="820" y="220" width="700" height="450" fill="#fbf3e9"/><rect x="820" y="220" width="700" height="9" fill="#a36b32"/><text x="856" y="310" font-size="38" font-weight="700" fill="#a36b32">이웃을 구별하는 이름</text><text x="856" y="415" font-size="34" font-weight="500" fill="#263e4a">고급스러움과 특별함</text><text x="856" y="499" font-size="34" font-weight="500" fill="#263e4a">주민의 지위와 형편</text><text x="856" y="583" font-size="34" font-weight="500" fill="#263e4a">사람의 높낮이를 짐작하는 말</text><text x="80" y="780" font-size="35" fill="#3b505a">이름의 의미는 우리가 이웃을 부르고 맞는 방식에도 남는다.</text><text x="80" y="840" font-size="22" fill="#718087">SEED VOICE · 2026.10.09</text></g></svg>