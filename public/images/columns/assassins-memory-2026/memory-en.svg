<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><rect width="1200" height="870" fill="#faf8f3"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="70" y="85" fill="#173f35" font-size="38" font-weight="700">How suspicion can become memory</text><rect x="70" y="125" width="1060" height="105" rx="9" fill="#e8eee8"/><text x="100" y="167" font-size="27" font-weight="700" fill="#233a37">Records and facts</text><text x="100" y="205" font-size="23" fill="#52625d">Documents, testimony, investigations, trials</text><path d="M600 239v15m-7-6 7 7 7-7" stroke="#a28550" stroke-width="3" fill="none"/><rect x="70" y="267" width="1060" height="105" rx="9" fill="#f2eadc"/><text x="100" y="309" font-size="27" font-weight="700" fill="#233a37">Hypotheses and interpretation</text><text x="100" y="347" font-size="23" fill="#52625d">Proposals to explain unresolved gaps</text><path d="M600 381v15m-7-6 7 7 7-7" stroke="#a28550" stroke-width="3" fill="none"/><rect x="70" y="409" width="1060" height="105" rx="9" fill="#e8eaf0"/><text x="100" y="451" font-size="27" font-weight="700" fill="#233a37">Images and emotion</text><text x="100" y="489" font-size="23" fill="#52625d">Scenes, music and identification</text><path d="M600 523v15m-7-6 7 7 7-7" stroke="#a28550" stroke-width="3" fill="none"/><rect x="70" y="551" width="1060" height="105" rx="9" fill="#e9eee9"/><text x="100" y="593" font-size="27" font-weight="700" fill="#233a37">Public memory</text><text x="100" y="631" font-size="23" fill="#52625d">An impression that may feel factual</text><text x="70" y="750" fill="#173f35" font-size="23" font-weight="700">Check at each stage: new evidence, invented details, established findings</text><text x="70" y="812" fill="#69746e" font-size="20">SEED VOICE | Conceptual diagram of the column’s argument</text></g></svg>