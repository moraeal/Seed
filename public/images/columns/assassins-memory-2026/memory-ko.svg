<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><rect width="1200" height="870" fill="#faf8f3"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="70" y="85" fill="#173f35" font-size="38" font-weight="700">의혹은 어떻게 기억이 되는가</text><rect x="70" y="125" width="1060" height="105" rx="9" fill="#e8eee8"/><text x="100" y="167" font-size="27" font-weight="700" fill="#233a37">기록과 사실</text><text x="100" y="205" font-size="23" fill="#52625d">자료·증언·수사·재판</text><path d="M600 239v15m-7-6 7 7 7-7" stroke="#a28550" stroke-width="3" fill="none"/><rect x="70" y="267" width="1060" height="105" rx="9" fill="#f2eadc"/><text x="100" y="309" font-size="27" font-weight="700" fill="#233a37">가설과 해석</text><text x="100" y="347" font-size="23" fill="#52625d">빈틈을 설명하는 추측</text><path d="M600 381v15m-7-6 7 7 7-7" stroke="#a28550" stroke-width="3" fill="none"/><rect x="70" y="409" width="1060" height="105" rx="9" fill="#e8eaf0"/><text x="100" y="451" font-size="27" font-weight="700" fill="#233a37">영상과 감정</text><text x="100" y="489" font-size="23" fill="#52625d">장면·음악·인물에 대한 공감</text><path d="M600 523v15m-7-6 7 7 7-7" stroke="#a28550" stroke-width="3" fill="none"/><rect x="70" y="551" width="1060" height="105" rx="9" fill="#e9eee9"/><text x="100" y="593" font-size="27" font-weight="700" fill="#233a37">대중의 기억</text><text x="100" y="631" font-size="23" fill="#52625d">사실처럼 남을 수 있는 인상</text><text x="70" y="750" fill="#173f35" font-size="23" font-weight="700">단계마다 확인할 것: 새 증거 · 창작의 범위 · 기존 판단과의 차이</text><text x="70" y="812" fill="#69746e" font-size="20">씨앗의 소리 | 칼럼의 논지를 설명하는 개념도</text></g></svg>