<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="20" fill="#f5f3ee"/><g font-family="sans-serif" fill="#22343b"><text x="60" y="80" font-size="38" font-weight="700">사람을 가르는 말에서 문제를 푸는 말로</text><text x="65" y="160" font-size="30" font-weight="700">진영의 언어</text><text x="635" y="160" font-size="30" font-weight="700">시민의 언어</text><rect x="45" y="200" width="540" height="90" rx="12" fill="#e8e3df"/><rect x="615" y="200" width="540" height="90" rx="12" fill="#dceae3"/><text x="65" y="255" font-size="25">너는 어느 편이냐</text><text x="635" y="255" font-size="25">왜 그렇게 생각하나</text><rect x="45" y="315" width="540" height="90" rx="12" fill="#e8e3df"/><rect x="615" y="315" width="540" height="90" rx="12" fill="#dceae3"/><text x="65" y="370" font-size="25">당신 같은 사람은 원래 그래</text><text x="635" y="370" font-size="25">무엇이 불편하고 무엇을 고칠까</text><rect x="45" y="430" width="540" height="90" rx="12" fill="#e8e3df"/><rect x="615" y="430" width="540" height="90" rx="12" fill="#dceae3"/><text x="65" y="485" font-size="25">우리편의 잘못은 감싼다</text><text x="635" y="485" font-size="25">같은 사실과 책임으로 따진다</text></g></svg>