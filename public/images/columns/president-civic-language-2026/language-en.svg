<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="20" fill="#f5f3ee"/><g font-family="sans-serif" fill="#22343b"><text x="60" y="80" font-size="38" font-weight="700">From dividing people to solving problems</text><text x="65" y="160" font-size="30" font-weight="700">Partisan language</text><text x="635" y="160" font-size="30" font-weight="700">Civic language</text><rect x="45" y="200" width="540" height="90" rx="12" fill="#e8e3df"/><rect x="615" y="200" width="540" height="90" rx="12" fill="#dceae3"/><text x="65" y="255" font-size="23">Whose side are you on?</text><text x="635" y="255" font-size="23">Why do you think that?</text><rect x="45" y="315" width="540" height="90" rx="12" fill="#e8e3df"/><rect x="615" y="315" width="540" height="90" rx="12" fill="#dceae3"/><text x="65" y="370" font-size="23">People like you always do this</text><text x="635" y="370" font-size="23">What is wrong? What can we fix?</text><rect x="45" y="430" width="540" height="90" rx="12" fill="#e8e3df"/><rect x="615" y="430" width="540" height="90" rx="12" fill="#dceae3"/><text x="65" y="485" font-size="23">Excuse our own side’s mistakes</text><text x="635" y="485" font-size="23">Apply the same facts and accountability</text></g></svg>