<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="민회의 민주적 대표성, 무엇을 검증해야 하나">
<rect width="1200" height="675" fill="#fafbfc"/><rect x="0" y="0" width="1200" height="15" fill="#233b58"/><text x="68" y="90" font-family="Noto Sans KR,Arial,sans-serif" font-size="40" font-weight="750" fill="#1b2b3b">민회의 민주적 대표성, 무엇을 검증해야 하나</text><text x="68" y="132" font-family="Noto Sans KR,Arial,sans-serif" font-size="22" fill="#607080">행사 개최 여부보다 운영 절차의 공개와 책임이 중요하다</text>
<rect x="53" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="162" cy="262" r="34" fill="#244869"/><text x="162" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">1</text><text x="162" y="344" font-size="23" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">의제 설정</text><text x="162" y="404" font-size="17" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">누가 질문을 정했나</text><rect x="284" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="393" cy="262" r="34" fill="#244869"/><text x="393" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">2</text><text x="393" y="344" font-size="23" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">참여자 선정</text><text x="393" y="404" font-size="17" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">누가 참여할 수 있나</text><rect x="515" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="624" cy="262" r="34" fill="#244869"/><text x="624" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">3</text><text x="624" y="344" font-size="23" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">자료와 전문가</text><text x="624" y="404" font-size="17" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">서로 다른 견해를 담았나</text><rect x="746" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="855" cy="262" r="34" fill="#244869"/><text x="855" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">4</text><text x="855" y="344" font-size="23" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">회의의 투명성</text><text x="855" y="404" font-size="17" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">반대·소수 의견을 남기나</text><rect x="977" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="1086" cy="262" r="34" fill="#244869"/><text x="1086" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">5</text><text x="1086" y="344" font-size="23" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">결정의 책임</text><text x="1086" y="404" font-size="17" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">결과를 누가 이행하나</text><line x1="66" y1="568" x2="1134" y2="568" stroke="#d6e0e7" stroke-width="2"/><text x="68" y="602" font-family="Noto Sans KR,Arial,sans-serif" font-size="16" fill="#6b7c8b">출처: OECD 시민참여 지침(2022)을 바탕으로 씨앗의 소리 재구성</text><text x="1135" y="626" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#233b58">SEED VOICE</text></svg>