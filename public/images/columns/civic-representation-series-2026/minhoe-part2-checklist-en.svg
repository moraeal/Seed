<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Five Tests of a Representative Citizens’ Forum">
<rect width="1200" height="675" fill="#fafbfc"/><rect x="0" y="0" width="1200" height="15" fill="#233b58"/><text x="68" y="90" font-family="Noto Sans KR,Arial,sans-serif" font-size="40" font-weight="750" fill="#1b2b3b">Five Tests of a Representative Citizens’ Forum</text><text x="68" y="132" font-family="Noto Sans KR,Arial,sans-serif" font-size="22" fill="#607080">Procedural integrity matters more than a festival's name</text>
<rect x="53" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="162" cy="262" r="34" fill="#244869"/><text x="162" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">1</text><text x="162" y="344" font-size="22" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">Agenda</text><text x="162" y="404" font-size="16" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">Who frames the questions?</text><rect x="284" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="393" cy="262" r="34" fill="#244869"/><text x="393" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">2</text><text x="393" y="344" font-size="22" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">Selection</text><text x="393" y="404" font-size="16" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">Who can participate?</text><rect x="515" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="624" cy="262" r="34" fill="#244869"/><text x="624" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">3</text><text x="624" y="344" font-size="22" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">Evidence</text><text x="624" y="404" font-size="16" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">Are competing views heard?</text><rect x="746" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="855" cy="262" r="34" fill="#244869"/><text x="855" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">4</text><text x="855" y="344" font-size="22" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">Transparency</text><text x="855" y="404" font-size="16" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">Is dissent recorded?</text><rect x="977" y="197" width="218" height="327" rx="14" fill="white" stroke="#dce4ea" stroke-width="2"/><circle cx="1086" cy="262" r="34" fill="#244869"/><text x="1086" y="273" fill="#fff" font-size="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">5</text><text x="1086" y="344" font-size="22" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#1a344b">Accountability</text><text x="1086" y="404" font-size="16" font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle" fill="#546c7e">Who acts on the results?</text><line x1="66" y1="568" x2="1134" y2="568" stroke="#d6e0e7" stroke-width="2"/><text x="68" y="602" font-family="Noto Sans KR,Arial,sans-serif" font-size="16" fill="#6b7c8b">SEED VOICE adaptation of OECD Guidelines for Citizen Participation Processes (2022)</text><text x="1135" y="626" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#233b58">SEED VOICE</text></svg>