<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><rect width="1200" height="690" fill="#f3f0e7"/><g font-family="Noto Sans KR, Arial, sans-serif"><text x="56" y="79" font-size="38" fill="#153837" font-weight="700">Fifth in the world. Risks outside the ranking.</text><text x="56" y="123" font-size="24" fill="#566d68" font-weight="400">Global Firepower 2026 · 5th of 145 countries</text><rect x="56" y="173" width="528" height="335" fill="#dfe8df"/><rect x="612" y="173" width="532" height="335" fill="#183b39"/><text x="86" y="226" font-size="29" fill="#153837" font-weight="700">What the ranking assesses</text><text x="642" y="226" font-size="27" fill="#ffffff" font-weight="700">What requires separate scrutiny</text><text x="86" y="300" font-size="26" fill="#153837" font-weight="400">Conventional military power</text><text x="86" y="372" font-size="26" fill="#153837" font-weight="400">Assets, personnel and resources</text><text x="86" y="444" font-size="26" fill="#153837" font-weight="400">Nuclear weapons excluded</text><text x="642" y="300" font-size="25" fill="#ffffff" font-weight="400">Deterrence under nuclear threat</text><text x="642" y="372" font-size="25" fill="#ffffff" font-weight="400">Vigilance and operational intelligence</text><text x="642" y="444" font-size="25" fill="#ffffff" font-weight="400">Training, secrecy and accountability</text><text x="56" y="576" font-size="27" fill="#153837" font-weight="700">Strong capabilities are an asset. Readiness must be demonstrated.</text><text x="56" y="635" font-size="20" fill="#566d68" font-weight="400">Source: Global Firepower 2026 · Right: questions raised by this column</text></g></svg>