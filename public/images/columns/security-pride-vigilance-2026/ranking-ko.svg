<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><rect width="1200" height="690" fill="#f3f0e7"/><g font-family="Noto Sans KR, Arial, sans-serif"><text x="56" y="79" font-size="38" fill="#153837" font-weight="700">세계 5위의 힘, 숫자 밖의 위험</text><text x="56" y="123" font-size="24" fill="#566d68" font-weight="400">Global Firepower 2026 · 145개국 중 5위</text><rect x="56" y="173" width="528" height="335" fill="#dfe8df"/><rect x="612" y="173" width="532" height="335" fill="#183b39"/><text x="86" y="226" font-size="29" fill="#153837" font-weight="700">순위가 평가하는 것</text><text x="642" y="226" font-size="27" fill="#ffffff" font-weight="700">별도로 확인해야 할 것</text><text x="86" y="300" font-size="26" fill="#153837" font-weight="400">재래식 전력</text><text x="86" y="372" font-size="26" fill="#153837" font-weight="400">군사 자산·인력·자원 등</text><text x="86" y="444" font-size="26" fill="#153837" font-weight="400">핵무기는 평가에서 제외</text><text x="642" y="300" font-size="25" fill="#ffffff" font-weight="400">핵 위협 아래의 억지·대응</text><text x="642" y="372" font-size="25" fill="#ffffff" font-weight="400">현장 경계와 정보의 작전 반영</text><text x="642" y="444" font-size="25" fill="#ffffff" font-weight="400">훈련·기밀 보호·책임 체계</text><text x="56" y="576" font-size="27" fill="#153837" font-weight="700">강한 전력은 자산이다. 경계와 대응은 실제 준비로 증명해야 한다.</text><text x="56" y="635" font-size="20" fill="#566d68" font-weight="400">자료: Global Firepower 2026 · 우측은 칼럼이 제기하는 점검 과제</text></g></svg>