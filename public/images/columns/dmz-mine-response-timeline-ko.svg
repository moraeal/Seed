<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">사고 뒤 공개된 주요 날짜</title><desc id="desc">이 시간표만으로 조사 지연의 의도는 입증되지 않는다</desc><rect width="1200" height="620" fill="#f8f6f0"/><text x="70" y="80" fill="#192c37" font-family="Noto Sans KR,Arial,sans-serif" font-size="37" font-weight="750">사고 뒤 공개된 주요 날짜</text><text x="70" y="118" fill="#52626a" font-family="Noto Sans KR,Arial,sans-serif" font-size="22">이 시간표만으로 조사 지연의 의도는 입증되지 않는다</text><line x1="115" y1="188" x2="115" y2="492" stroke="#a9bfc1" stroke-width="3"/><circle cx="115" cy="198" r="10" fill="#277e81"/><text x="153" y="206" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">9월 21일</text><text x="340" y="206" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">서부전선 DMZ 폭발 · 장병 3명 부상</text><circle cx="115" cy="296" r="10" fill="#277e81"/><text x="153" y="304" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">9월 23일</text><text x="340" y="304" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">대통령, 유엔총회 평화공존 구상 발표</text><circle cx="115" cy="394" r="10" fill="#277e81"/><text x="153" y="402" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">9월 27일</text><text x="340" y="402" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">군·유엔사, 합동 현장조사 시작</text><circle cx="115" cy="492" r="10" fill="#277e81"/><text x="153" y="500" fill="#174f59" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="750">9월 28일</text><text x="340" y="500" fill="#20323c" font-family="Noto Sans KR,Arial,sans-serif" font-size="26">군, 북한군 지뢰 가능성 높다고 중간 발표</text></svg>