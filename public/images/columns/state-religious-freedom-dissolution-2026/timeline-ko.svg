<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="11월 23~25일, 세 날의 기록"><rect width="1100" height="520" fill="#f6f2e9"/><g font-family="Pretendard,NanumGothic,Arial,sans-serif" fill="#233839"><text x="62" y="84" font-size="45" font-weight="700">11월 23~25일, 세 날의 기록</text><path d="M62 120h976" stroke="#c3c9bb"/><text x="62" y="171" fill="#346659" font-size="32" font-weight="600">11월 23일</text><text x="310" y="164" font-size="29">대통령, 특검 후보 추천 요청</text><text x="310" y="206" font-size="29">경찰, 전광훈 목사 구속영장 신청</text><path d="M62 242h976" stroke="#c3c9bb"/><text x="62" y="293" fill="#346659" font-size="32" font-weight="600">11월 24일</text><text x="310" y="286" font-size="29">대통령, 종교단체 해산을 포함한</text><text x="310" y="328" font-size="29">대응 방안 검토 경과와 계획 보고 지시</text><path d="M62 364h976" stroke="#c3c9bb"/><text x="62" y="415" fill="#346659" font-size="32" font-weight="600">11월 25일</text><text x="310" y="408" font-size="29">공소청, 전광훈 목사에 대해</text><text x="310" y="450" font-size="29">법원에 구속영장 청구</text></g></svg>
