<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Three days in November 2026"><rect width="1100" height="520" fill="#f6f2e9"/><g font-family="Pretendard,NanumGothic,Arial,sans-serif" fill="#233839"><text x="62" y="84" font-size="45" font-weight="700">Three days in November 2026</text><path d="M62 120h976" stroke="#c3c9bb"/><text x="62" y="171" fill="#346659" font-size="32" font-weight="600">Nov 23</text><text x="310" y="164" font-size="29">Party leaders clash over the overlap</text><text x="310" y="206" font-size="29">between two membership lists.</text><path d="M62 242h976" stroke="#c3c9bb"/><text x="62" y="293" fill="#346659" font-size="32" font-weight="600">Nov 24</text><text x="310" y="286" font-size="29">Lee asks the ministry for its review</text><text x="310" y="328" font-size="29">of measures including dissolution.</text><path d="M62 364h976" stroke="#c3c9bb"/><text x="62" y="415" fill="#346659" font-size="32" font-weight="600">Nov 25</text><text x="310" y="408" font-size="29">Party leaders again face a demand</text><text x="310" y="450" font-size="29">to settle the secret-alliance claim.</text></g></svg>
