<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#f6f8fb"/><g font-family="Pretendard,Noto Sans KR,NanumGothic,sans-serif"><text x="70" y="90" fill="#14283c" font-size="43" font-weight="700">반복된 발언, 남는 안보의 질문</text><rect x="65" y="145" width="1310" height="120" rx="10" fill="white"/><text x="90" y="194" fill="#a72c36" font-size="30" font-weight="700">2017.06</text><text x="295" y="189" fill="#172d42" font-size="31" font-weight="700">핵·미사일 활동 중단 ↔ 연합훈련 축소</text><text x="295" y="233" fill="#526477" font-size="25">핵 폐기 이전의 방어 태세 조정 논란</text><rect x="65" y="285" width="1310" height="120" rx="10" fill="white"/><text x="90" y="334" fill="#a72c36" font-size="30" font-weight="700">2018.05</text><text x="295" y="329" fill="#172d42" font-size="31" font-weight="700">장기적으로 동맹에서 다자안보로</text><text x="295" y="373" fill="#526477" font-size="25">중단기 동맹의 불가피성은 인정</text><rect x="65" y="425" width="1310" height="120" rx="10" fill="white"/><text x="90" y="474" fill="#a72c36" font-size="30" font-weight="700">2019.12</text><text x="295" y="469" fill="#172d42" font-size="31" font-weight="700">미군 철수 시 중국 핵우산 가능성 질문</text><text x="295" y="513" fill="#526477" font-size="25">가상 질문 · 중국의 모순 비판이었다고 해명</text><rect x="65" y="565" width="1310" height="120" rx="10" fill="white"/><text x="90" y="614" fill="#a72c36" font-size="30" font-weight="700">2026.10</text><text x="295" y="609" fill="#172d42" font-size="31" font-weight="700">미래 한미동맹이 ‘저주’가 될 수 있다</text><text x="295" y="653" fill="#526477" font-size="25">미·중 연루 위험과 다자안보 전환 주장</text><text x="70" y="765" fill="#526477" font-size="20">SEED VOICE · Yonhap / Maeil Business / VOA / JTBC</text></g></svg>