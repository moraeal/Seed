<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><rect width="1200" height="800" fill="#f9f6ee"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#203d36"><text x="64" y="86" font-size="38" font-weight="700">참는 대신, 함께 바꿀 일을 찾기</text><text x="64" y="132" font-size="23">내 휴식을 말하고 · 상대의 조정 기회를 남기고 · 같은 기준을 지키기</text><rect x="64" y="180" width="1072" height="158" rx="10" fill="#fff"/><circle cx="122" cy="235" r="31" fill="#e1ece2"/><text x="122" y="245" font-size="27" font-weight="700" text-anchor="middle">01</text><text x="180" y="229" font-size="29" font-weight="700">겪은 일을 기록하기</text><text x="180" y="272" font-size="25">시간과 소리의 양상을 적는다.</text><text x="180" y="308" font-size="25">발생 위치는 확인할 여지를 남긴다.</text><rect x="64" y="362" width="1072" height="158" rx="10" fill="#fff"/><circle cx="122" cy="417" r="31" fill="#e1ece2"/><text x="122" y="427" font-size="27" font-weight="700" text-anchor="middle">02</text><text x="180" y="411" font-size="29" font-weight="700">바꿀 행동을 요청하기</text><text x="180" y="454" font-size="25">언제, 무엇이 불편한지 구체적으로 전한다.</text><text x="180" y="490" font-size="25">편안한 대화나 중간 창구를 고른다.</text><rect x="64" y="544" width="1072" height="158" rx="10" fill="#fff"/><circle cx="122" cy="599" r="31" fill="#e1ece2"/><text x="122" y="609" font-size="27" font-weight="700" text-anchor="middle">03</text><text x="180" y="593" font-size="29" font-weight="700">실제 변화를 확인하기</text><text x="180" y="636" font-size="25">소음이 줄었는지, 약속이 지켜지는지 본다.</text><text x="180" y="672" font-size="25">계속되면 기록을 바탕으로 중재를 요청한다.</text></g></svg>