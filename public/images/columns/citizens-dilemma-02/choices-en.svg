<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><rect width="1200" height="800" fill="#f9f6ee"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#203d36"><text x="64" y="86" font-size="38" font-weight="700">Speak up, then find a change together</text><text x="64" y="132" font-size="23">Protect your rest · Leave room to adjust · Accept the same standard</text><rect x="64" y="180" width="1072" height="158" rx="10" fill="#fff"/><circle cx="122" cy="235" r="31" fill="#e1ece2"/><text x="122" y="245" font-size="27" font-weight="700" text-anchor="middle">01</text><text x="180" y="229" font-size="29" font-weight="700">Record what you experience</text><text x="180" y="272" font-size="25">Note the timing and the kind of sound.</text><text x="180" y="308" font-size="25">Leave room to check where it comes from.</text><rect x="64" y="362" width="1072" height="158" rx="10" fill="#fff"/><circle cx="122" cy="417" r="31" fill="#e1ece2"/><text x="122" y="427" font-size="27" font-weight="700" text-anchor="middle">02</text><text x="180" y="411" font-size="29" font-weight="700">Ask for a specific change</text><text x="180" y="454" font-size="25">Explain when and what is disturbing you.</text><text x="180" y="490" font-size="25">Choose a calm conversation or an intermediary.</text><rect x="64" y="544" width="1072" height="158" rx="10" fill="#fff"/><circle cx="122" cy="599" r="31" fill="#e1ece2"/><text x="122" y="609" font-size="27" font-weight="700" text-anchor="middle">03</text><text x="180" y="593" font-size="29" font-weight="700">Review what has changed</text><text x="180" y="636" font-size="25">Check the noise and the agreed adjustments.</text><text x="180" y="672" font-size="25">If it continues, use your notes to seek mediation.</text></g></svg>