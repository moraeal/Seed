<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f5f6f0"/>
<style>text{font-family:Pretendard,'Noto Sans KR','Noto Sans CJK KR',Arial,sans-serif;fill:#173c38;font-weight:500}.title{font-size:49px;font-weight:700}.sub{font-size:27px;fill:#566e68}.head{font-size:28px;font-weight:700;fill:#fff}.cell{font-size:27px}.method{font-size:32px;font-weight:700}</style>
<text class="title" x="65" y="98">참여의 방식보다 대표성의 증명이 먼저입니다</text>
