<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790"><rect width="1440" height="790" fill="#f6f7f3"/><text x="80" y="100" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="48" font-weight="700" fill="#192d27">Who selects representatives and sets the agenda?</text><rect x="72" y="160" width="628" height="490" rx="18" fill="#e9eee9"/><rect x="740" y="160" width="628" height="490" rx="18" fill="#dcebdc"/><text x="112" y="220" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#50645b">PROPOSED BILL</text><text x="780" y="220" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#2d6b49">SEED VOICE PROPOSAL</text><g font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" fill="#1e3028"><text x="112" y="320">Commission under the interior ministry</text><text x="112" y="408">Minister recommends; president appoints chair</text><text x="112" y="496">Minister appoints or commissions members</text><text x="780" y="320">Civil society deliberates independently</text><text x="780" y="408">Open selection and individual participation</text><text x="780" y="496">Citizen proposals → government response</text></g><text x="80" y="724" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" fill="#52645b">The bill is under parliamentary review and may change.</text></svg>