<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790"><rect width="1440" height="790" fill="#f6f7f3"/><text x="80" y="100" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="48" font-weight="700" fill="#192d27">누가 대표와 의제를 정하는가</text><rect x="72" y="160" width="628" height="490" rx="18" fill="#e9eee9"/><rect x="740" y="160" width="628" height="490" rx="18" fill="#dcebdc"/><text x="112" y="220" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#50645b">발의안의 구조</text><text x="780" y="220" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#2d6b49">씨앗의 제안</text><g font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" fill="#1e3028"><text x="112" y="320">행안부 장관 소속 위원회</text><text x="112" y="408">장관 제청 · 대통령 위원장 임명</text><text x="112" y="496">장관의 위원 임명·위촉</text><text x="780" y="320">시민사회가 독립적으로 공론 형성</text><text x="780" y="408">공개 추천·선출과 개별 시민 참여</text><text x="780" y="496">시민의 의제 제안 → 정부의 답변</text></g><text x="80" y="724" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" fill="#52645b">※ 법안은 국회 심사 중이며 최종 내용은 달라질 수 있다.</text></svg>