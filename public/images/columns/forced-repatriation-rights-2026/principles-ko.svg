<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><text x="69" y="99" font-family="Noto Sans KR,Arial,sans-serif" font-weight="800" font-size="44" fill="#203e4b">인권의 기준은 하나다</text><text x="70" y="145" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" fill="#5f7478">국경과 정치적 진영을 넘어 적용되는 세 가지 원칙</text><path d="M70 169h1060" stroke="#d7e0e0" stroke-width="2"/><rect x="68" y="205" width="1064" height="130" fill="#f4f8f8" rx="12"/><rect x="68" y="205" width="8" height="130" fill="#35606a"/><text x="100" y="284" font-family="Noto Sans KR,Arial,sans-serif" font-weight="700" font-size="42" fill="#ac8553">01</text><text x="215" y="257" font-family="Noto Sans KR,Arial,sans-serif" font-weight="700" font-size="32" fill="#233f48">표현의 자유</text><text x="215" y="303" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" fill="#516a70">어느 나라의 권력이든 비판할 권리</text><rect x="68" y="358" width="1064" height="130" fill="#f8f9f8" rx="12"/><rect x="68" y="358" width="8" height="130" fill="#35606a"/><text x="100" y="437" font-family="Noto Sans KR,Arial,sans-serif" font-weight="700" font-size="42" fill="#ac8553">02</text><text x="215" y="410" font-family="Noto Sans KR,Arial,sans-serif" font-weight="700" font-size="32" fill="#233f48">적법절차</text><text x="215" y="456" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" fill="#516a70">수사·변호·독립적인 재판받을 권리</text><rect x="68" y="511" width="1064" height="130" fill="#f4f8f8" rx="12"/><rect x="68" y="511" width="8" height="130" fill="#35606a"/><text x="100" y="590" font-family="Noto Sans KR,Arial,sans-serif" font-weight="700" font-size="42" fill="#ac8553">03</text><text x="215" y="563" font-family="Noto Sans KR,Arial,sans-serif" font-weight="700" font-size="32" fill="#233f48">고문 위험으로부터의 보호</text><text x="215" y="609" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" fill="#516a70">고문 위험이 큰 곳으로 강제송환하지 않을 원칙</text><path d="M70 705h1060" stroke="#d7e0e0" stroke-width="2"/><text x="70" y="737" font-family="Noto Sans KR,Arial,sans-serif" font-size="20" fill="#698087">씨앗의 소리 · 보편적 인권 원칙을 설명하는 개념도</text></svg>