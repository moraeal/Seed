<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#fffdf8"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="72" y="104" font-size="52" fill="#172b3e" font-weight="700">One escalator. Different needs.</text><text x="72" y="156" font-size="29" fill="#5a6770" font-weight="500">Making room and being willing to wait belong together</text><rect x="72" y="213" width="1296" height="102" fill="#edf4ef"/><rect x="72" y="213" width="12" height="102" fill="#164b3d"/><text x="109" y="275" font-size="32" fill="#164b3d" font-weight="700">A hurried rider</text><text x="432" y="253" font-size="29" fill="#172b3e" font-weight="500">Wants to catch the train</text><text x="432" y="292" font-size="28" fill="#5a6770" font-weight="500">Sees an open lane as courtesy</text><rect x="72" y="333" width="1296" height="102" fill="#edf1f6"/><rect x="72" y="333" width="12" height="102" fill="#385674"/><text x="109" y="395" font-size="32" fill="#385674" font-weight="700">A standing rider</text><text x="432" y="373" font-size="29" fill="#172b3e" font-weight="500">Needs stable footing</text><text x="432" y="412" font-size="28" fill="#5a6770" font-weight="500">May struggle to move aside</text><rect x="72" y="453" width="1296" height="102" fill="#f5efe5"/><rect x="72" y="453" width="12" height="102" fill="#8a6133"/><text x="109" y="515" font-size="32" fill="#8a6133" font-weight="700">The operator</text><text x="432" y="493" font-size="29" fill="#172b3e" font-weight="500">Seeks fewer risks and less strain</text><text x="432" y="532" font-size="28" fill="#5a6770" font-weight="500">Considers behavior and conditions</text><rect x="72" y="593" width="1296" height="134" fill="#164b3d"/><text x="105" y="635" font-size="28" fill="#d8eadc" font-weight="700">Shared safety guidance</text><text x="105" y="689" font-size="31" fill="#ffffff" font-weight="700">Hold the handrail  ·  Stand still  ·  Stay inside the safety lines</text><text x="72" y="778" font-size="22" fill="#68736f" font-weight="500">Source: Ministry of the Interior and Safety, Sep 23, 2026 | SEED VOICE</text></g></svg>