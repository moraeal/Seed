<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#fffdf8"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="72" y="104" font-size="52" fill="#172b3e" font-weight="700">같은 에스컬레이터, 서로 다른 사정</text><text x="72" y="156" font-size="29" fill="#5a6770" font-weight="500">한쪽을 비워주는 마음과 기다리는 마음이 함께 필요하다</text><rect x="72" y="213" width="1296" height="102" fill="#edf4ef"/><rect x="72" y="213" width="12" height="102" fill="#164b3d"/><text x="109" y="275" font-size="32" fill="#164b3d" font-weight="700">급한 이용자</text><text x="432" y="253" font-size="29" fill="#172b3e" font-weight="500">열차를 놓치고 싶지 않다</text><text x="432" y="292" font-size="28" fill="#5a6770" font-weight="500">남겨둔 통로가 배려로 보인다</text><rect x="72" y="333" width="1296" height="102" fill="#edf1f6"/><rect x="72" y="333" width="12" height="102" fill="#385674"/><text x="109" y="395" font-size="32" fill="#385674" font-weight="700">서 있는 이용자</text><text x="432" y="373" font-size="29" fill="#172b3e" font-weight="500">안정적으로 이동하고 싶다</text><text x="432" y="412" font-size="28" fill="#5a6770" font-weight="500">갑작스러운 이동 요구가 부담이다</text><rect x="72" y="453" width="1296" height="102" fill="#f5efe5"/><rect x="72" y="453" width="12" height="102" fill="#8a6133"/><text x="109" y="515" font-size="32" fill="#8a6133" font-weight="700">운영기관</text><text x="432" y="493" font-size="29" fill="#172b3e" font-weight="500">사고와 설비 부담을 줄이고 싶다</text><text x="432" y="532" font-size="28" fill="#5a6770" font-weight="500">이용 행태와 환경을 함께 살핀다</text><rect x="72" y="593" width="1296" height="134" fill="#164b3d"/><text x="105" y="635" font-size="28" fill="#d8eadc" font-weight="700">함께 지킬 안전수칙</text><text x="105" y="689" font-size="31" fill="#ffffff" font-weight="700">손잡이 잡기  ·  걷거나 뛰지 않기  ·  안전선 지키기</text><text x="72" y="778" font-size="22" fill="#68736f" font-weight="500">자료: 행정안전부, 2026.9.23  |  구성: 씨앗의 소리</text></g></svg>