<svg xmlns="http://www.w3.org/2000/svg" width="920" height="590" viewBox="0 0 920 590">
<rect width="920" height="590" fill="#faf8f2"/>
<g font-family="Pretendard, Noto Sans KR, sans-serif" fill="#253a33">
<text x="40" y="64" font-size="34" font-weight="700">국무회의와 법정, 발언의 순서</text>
