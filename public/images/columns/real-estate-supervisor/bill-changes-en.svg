<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">The revised supervisory agency bill: changes and powers retained</title><desc id="desc">The September proposal removes an express power to request credit information and narrows data requests. Discretionary inquiries and warrantless financial transaction data requests during administrative inquiries reportedly remain.</desc>
<rect width="1200" height="680" fill="#f6f7f7"/>
<text x="58" y="75" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#142b2b">Real estate oversight: what changed?</text>
<text x="58" y="111" font-family="Arial, sans-serif" font-size="21" fill="#46605e">Comparing the February bill with the September 23 replacement</text>
<rect x="55" y="154" width="520" height="415" rx="12" fill="white" stroke="#cbd6d3" stroke-width="2"/>
<rect x="625" y="154" width="520" height="415" rx="12" fill="white" stroke="#cbd6d3" stroke-width="2"/>
<rect x="55" y="154" width="520" height="67" rx="12" fill="#314e49"/><rect x="55" y="203" width="520" height="18" fill="#314e49"/>
<rect x="625" y="154" width="520" height="67" rx="12" fill="#234d56"/><rect x="625" y="203" width="520" height="18" fill="#234d56"/>
<g font-family="Arial, sans-serif" fill="white" font-size="28" font-weight="700"><text x="83" y="198">February proposal</text><text x="653" y="198">September replacement</text></g>
<g font-family="Arial, sans-serif" font-size="22" fill="#1c3435">
<text x="83" y="274">• Credit data request authority</text><text x="653" y="274">• Credit data basis removed</text>
<text x="83" y="341">• Broad data-request scope disputed</text><text x="653" y="341">• Subjects only; witnesses excluded</text>
<text x="83" y="408">• Inquiry-to-investigation data risk</text><text x="653" y="408">• Administrative / criminal systems split</text>
</g>
<line x1="83" y1="445" x2="547" y2="445" stroke="#d7dfdd" stroke-width="2"/><line x1="653" y1="445" x2="1117" y2="445" stroke="#d7dfdd" stroke-width="2"/>
<g font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9f3c2c"><text x="83" y="495">Core concern</text><text x="653" y="495">Still at issue</text></g>
<g font-family="Arial, sans-serif" font-size="19" fill="#314044"><text x="83" y="535">Discretionary inquiries and bank data</text><text x="653" y="535">Discretion and warrantless data requests</text></g>
<text x="58" y="617" font-family="Arial, sans-serif" font-size="18" fill="#43595a">September details reflect iNews24 reporting; the replacement's official full text remains to be checked.</text>
