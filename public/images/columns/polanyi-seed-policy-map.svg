<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">국가 중심 사회설계의 흐름과 시민 감시 기준</title>
  <desc id="desc">다섯 가지 정부 정책수단이 생활, 소비, 투자, 토지, 시민조직에 영향을 미치며 국가 중심 설계로 모이는 흐름을 보여준다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172b36" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#58716b"/>
    </marker>
    <style>
      .sans{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
      .serif{font-family:"Noto Serif KR","Nanum Myeongjo",serif}
    </style>
  </defs>
  <rect width="1200" height="820" rx="28" fill="#f7f1e5"/>
  <path d="M0 0H1200V112H0Z" fill="#173f35"/>
  <text x="600" y="50" text-anchor="middle" class="serif" font-size="31" font-weight="800" fill="#fff">개별 정책은 달라도, 권력은 한곳으로 흐를 수 있습니다</text>
  <text x="600" y="84" text-anchor="middle" class="sans" font-size="17" fill="#dce9df">정책수단 → 국가의 설계·배분 → 시민 생활의 변화</text>

  <text x="60" y="158" class="sans" font-size="15" font-weight="800" letter-spacing="2" fill="#9b6b22">정책수단</text>
  <text x="520" y="158" class="sans" font-size="15" font-weight="800" letter-spacing="2" fill="#9b6b22">국가의 역할</text>
  <text x="956" y="158" class="sans" font-size="15" font-weight="800" letter-spacing="2" fill="#9b6b22">영향 영역</text>

  <g class="sans" font-size="20" font-weight="750">
    <g filter="url(#shadow)"><rect x="50" y="182" width="310" height="66" rx="12" fill="#fff"/><text x="76" y="223" fill="#18302b">기본사회위원회</text></g>
    <g filter="url(#shadow)"><rect x="50" y="260" width="310" height="66" rx="12" fill="#fff"/><text x="76" y="301" fill="#18302b">농어촌 기본소득·지역화폐</text></g>
    <g filter="url(#shadow)"><rect x="50" y="338" width="310" height="66" rx="12" fill="#fff"/><text x="76" y="379" fill="#18302b">국민성장펀드 200조 원</text></g>
    <g filter="url(#shadow)"><rect x="50" y="416" width="310" height="66" rx="12" fill="#fff"/><text x="76" y="457" fill="#18302b">공공택지 LH 직접시행</text></g>
    <g filter="url(#shadow)"><rect x="50" y="494" width="310" height="66" rx="12" fill="#fff"/><text x="76" y="535" fill="#18302b">사회연대경제 지원</text></g>
  </g>

  <g fill="none" stroke="#58716b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M370 215C435 215 430 296 500 296"/><path d="M370 293C435 293 440 326 500 326"/>
    <path d="M370 371H500"/><path d="M370 449C435 449 440 416 500 416"/><path d="M370 527C435 527 430 446 500 446"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="224" width="310" height="304" rx="28" fill="#263c52"/>
    <circle cx="655" cy="300" r="49" fill="#e9b84a"/>
    <path d="M630 314h50M637 300h36M645 286h20" stroke="#263c52" stroke-width="8" stroke-linecap="round"/>
    <text x="655" y="382" text-anchor="middle" class="serif" font-size="28" font-weight="800" fill="#fff">국가 중심의</text>
    <text x="655" y="421" text-anchor="middle" class="serif" font-size="28" font-weight="800" fill="#fff">설계와 자원 배분</text>
    <text x="655" y="465" text-anchor="middle" class="sans" font-size="16" fill="#d9e3eb">위원회 · 예산 · 보조금</text>
    <text x="655" y="490" text-anchor="middle" class="sans" font-size="16" fill="#d9e3eb">정책금융 · 공공개발 · 인허가</text>
  </g>

  <g fill="none" stroke="#58716b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M820 296C878 296 874 215 928 215"/><path d="M820 326C878 326 880 293 928 293"/>
    <path d="M820 371H928"/><path d="M820 416C878 416 880 449 928 449"/><path d="M820 446C878 446 874 527 928 527"/>
  </g>

  <g class="sans" font-size="21" font-weight="800">
    <g><rect x="928" y="182" width="222" height="66" rx="33" fill="#d9e6e0"/><text x="1039" y="223" text-anchor="middle" fill="#173f35">기본생활</text></g>
    <g><rect x="928" y="260" width="222" height="66" rx="33" fill="#d9e6e0"/><text x="1039" y="301" text-anchor="middle" fill="#173f35">소비 선택</text></g>
    <g><rect x="928" y="338" width="222" height="66" rx="33" fill="#d9e6e0"/><text x="1039" y="379" text-anchor="middle" fill="#173f35">산업 투자</text></g>
    <g><rect x="928" y="416" width="222" height="66" rx="33" fill="#d9e6e0"/><text x="1039" y="457" text-anchor="middle" fill="#173f35">토지·주택</text></g>
    <g><rect x="928" y="494" width="222" height="66" rx="33" fill="#d9e6e0"/><text x="1039" y="535" text-anchor="middle" fill="#173f35">시민조직</text></g>
  </g>

  <path d="M600 552V604" stroke="#a56d20" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="50" y="616" width="1100" height="144" rx="22" fill="#fff" stroke="#d8c8a6" stroke-width="2"/>
    <text x="86" y="654" class="sans" font-size="15" font-weight="900" letter-spacing="2" fill="#a56d20">씨드의 시민 감시 기준</text>
    <g class="sans" font-size="20" font-weight="800" fill="#173f35">
      <circle cx="111" cy="705" r="23" fill="#e5b94f"/><text x="111" y="712" text-anchor="middle">1</text><text x="149" y="712">시민의 선택권</text>
      <circle cx="363" cy="705" r="23" fill="#e5b94f"/><text x="363" y="712" text-anchor="middle">2</text><text x="401" y="712">선정 과정 공개</text>
      <circle cx="642" cy="705" r="23" fill="#e5b94f"/><text x="642" y="712" text-anchor="middle">3</text><text x="680" y="712">실패 책임과 퇴로</text>
      <circle cx="933" cy="705" r="23" fill="#e5b94f"/><text x="933" y="712" text-anchor="middle">4</text><text x="971" y="712">사회조직의 독립</text>
    </g>
  </g>
  <text x="600" y="798" text-anchor="middle" class="sans" font-size="13" fill="#6c756f">씨드시민파트너스 · 2026.09</text>
</svg>
