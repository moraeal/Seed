<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img">
<rect width="1280" height="760" fill="#faf9f5"/>
<g font-family="Noto Sans KR, Pretendard, sans-serif" font-weight="500" fill="#173b34">
<text x="54" y="75" font-size="40" font-weight="700">Cooperate without surrendering judgment</text>
<text x="54" y="119" font-size="24" font-weight="500" fill="#52665f">Routes to dependence and safeguards for civil society</text>
<rect x="44" y="155" width="1192" height="66" fill="#173b34"/>
<text x="65" y="198" font-size="25" font-weight="700" fill="#ffffff">Connection</text>
<text x="285" y="198" font-size="25" font-weight="700" fill="#ffffff">Where independence weakens</text>
<text x="772" y="198" font-size="25" font-weight="700" fill="#ffffff">Operating safeguards</text>
<rect x="44" y="222" width="1192" height="124" fill="#eef1eb"/>
<text x="65" y="287" font-size="29" font-weight="700">Funding</text>
<text x="285" y="269" font-size="26" font-weight="500">The next contract takes</text>
<text x="285" y="305" font-size="26" font-weight="500">priority over criticism</text>
<text x="772" y="269" font-size="25" font-weight="500">Disclose funding dependence</text>
<text x="772" y="305" font-size="25" font-weight="500">Secure resources for scrutiny</text>
<rect x="44" y="348" width="1192" height="124" fill="#ffffff"/>
<text x="65" y="413" font-size="24" font-weight="700">Appointments</text>
<text x="285" y="395" font-size="26" font-weight="500">A colleague takes office;</text>
<text x="285" y="431" font-size="26" font-weight="500">the organization falls silent</text>
<text x="772" y="395" font-size="25" font-weight="500">Disclose roles and conflicts</text>
<text x="772" y="431" font-size="25" font-weight="500">Separate roles; recuse</text>
<rect x="44" y="474" width="1192" height="124" fill="#eef1eb"/>
<text x="65" y="539" font-size="29" font-weight="700">Allegiance</text>
<text x="285" y="521" font-size="26" font-weight="500">Political victory replaces</text>
<text x="285" y="557" font-size="26" font-weight="500">independent assessment</text>
<text x="772" y="521" font-size="25" font-weight="500">Keep consistent standards</text>
<text x="772" y="557" font-size="25" font-weight="500">Record dissent; correct errors</text>
<rect x="44" y="627" width="1192" height="83" fill="#e0e8d4"/>
<text x="65" y="662" font-size="22" font-weight="700">What must remain: citizens’ ability to investigate, judge, cooperate and revise</text>
<text x="65" y="694" font-size="22" font-weight="500">Civic action should survive changes of project, leadership and government.</text>
<text x="47" y="742" font-size="19" font-weight="500" fill="#64736c">Conceptual comparison, not an organizational survey. | SEED VOICE</text>
</g></svg>