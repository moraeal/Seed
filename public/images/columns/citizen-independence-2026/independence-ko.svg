<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img">
<rect width="1280" height="760" fill="#faf9f5"/>
<g font-family="Noto Sans KR, Pretendard, sans-serif" font-weight="500" fill="#173b34">
<text x="54" y="75" font-size="40" font-weight="700">정치와 협력하면서 판단권을 지키는 법</text>
<text x="54" y="119" font-size="24" font-weight="500" fill="#52665f">정치 의존의 경로와 시민사회의 자기 통제</text>
<rect x="44" y="155" width="1192" height="66" fill="#173b34"/>
<text x="65" y="198" font-size="25" font-weight="700" fill="#ffffff">연결 경로</text>
<text x="285" y="198" font-size="25" font-weight="700" fill="#ffffff">독립성이 약해지는 순간</text>
<text x="772" y="198" font-size="25" font-weight="700" fill="#ffffff">자기 통제 장치</text>
<rect x="44" y="222" width="1192" height="124" fill="#eef1eb"/>
<text x="65" y="287" font-size="29" font-weight="700">사업비</text>
<text x="285" y="269" font-size="26" font-weight="500">다음 사업의 선정이</text>
<text x="285" y="305" font-size="26" font-weight="500">비판보다 앞설 때</text>
<text x="772" y="269" font-size="25" font-weight="500">재원과 의존도 공개</text>
<text x="772" y="305" font-size="25" font-weight="500">감시 활동의 운영비 확보</text>
<rect x="44" y="348" width="1192" height="124" fill="#ffffff"/>
<text x="65" y="413" font-size="29" font-weight="700">인사</text>
<text x="285" y="395" font-size="26" font-weight="500">동료의 공직 진출이</text>
<text x="285" y="431" font-size="26" font-weight="500">조직의 침묵으로 이어질 때</text>
<text x="772" y="395" font-size="25" font-weight="500">역할·이해관계 공개</text>
<text x="772" y="431" font-size="25" font-weight="500">겸직 정리와 결정 회피</text>
<rect x="44" y="474" width="1192" height="124" fill="#eef1eb"/>
<text x="65" y="539" font-size="29" font-weight="700">진영</text>
<text x="285" y="521" font-size="26" font-weight="500">우리 편의 승패가</text>
<text x="285" y="557" font-size="26" font-weight="500">판단 기준을 대신할 때</text>
<text x="772" y="521" font-size="25" font-weight="500">같은 감시 기준 유지</text>
<text x="772" y="557" font-size="25" font-weight="500">이견 기록과 오류 정정</text>
<rect x="44" y="627" width="1192" height="83" fill="#e0e8d4"/>
<text x="65" y="662" font-size="25" font-weight="700">남겨야 할 힘: 시민의 조사 · 판단 · 협력 · 수정 능력</text>
<text x="65" y="694" font-size="22" font-weight="500">사업과 지도부가 바뀌어도 시민의 활동은 이어질 수 있어야 합니다.</text>
<text x="47" y="742" font-size="19" font-weight="500" fill="#64736c">개념 비교 · 단체별 실태 통계가 아닙니다. | 씨앗의 소리</text>
</g></svg>