<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Similar to 10 percent, but fundamentally different</title>
  <desc id="description">Korea's 10 percent is a statutory ceiling while Facebook's roughly 9 percent was an actual court-approved settlement.</desc>
  <rect width="1600" height="900" fill="#F5F3ED"/>
  <rect x="70" y="58" width="1460" height="784" rx="30" fill="#FFFFFF" stroke="#D8D5CD" stroke-width="2"/>
  <text x="120" y="145" font-family="Arial, sans-serif" font-size="51" font-weight="700" fill="#17231D">Similar percentage, fundamentally different meaning</text>
  <text x="120" y="198" font-family="Arial, sans-serif" font-size="25" fill="#647069">Korea sets a statutory ceiling; Facebook paid an actual settlement</text>
  <line x1="800" y1="250" x2="800" y2="720" stroke="#D8D5CD" stroke-width="2"/>
  <text x="140" y="304" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#226347">KOREA — AMENDED PIPA</text>
  <text x="140" y="434" font-family="Arial, sans-serif" font-size="118" font-weight="700" fill="#226347">UP TO 10%</text>
  <text x="140" y="502" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17231D">Statutory ceiling on total revenue</text>
  <text x="140" y="565" font-family="Arial, sans-serif" font-size="24" fill="#4E5853">Repeated breaches or intentional / gross negligence</text>
  <text x="140" y="612" font-family="Arial, sans-serif" font-size="24" fill="#4E5853">Administrative sanction imposed by the PIPC</text>
  <text x="860" y="304" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7A4926">UNITED STATES — FACEBOOK</text>
  <text x="860" y="434" font-family="Arial, sans-serif" font-size="118" font-weight="700" fill="#7A4926">ABOUT 9%</text>
  <text x="860" y="502" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17231D">Actual $5 billion settlement</text>
  <text x="860" y="565" font-family="Arial, sans-serif" font-size="24" fill="#4E5853">Violation of an existing 2012 FTC order</text>
  <text x="860" y="612" font-family="Arial, sans-serif" font-size="24" fill="#4E5853">Court approval, board oversight and external review</text>
  <rect x="120" y="677" width="1360" height="90" rx="18" fill="#17231D"/>
  <text x="800" y="735" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Similar numbers do not mean identical safeguards</text>
  <text x="120" y="813" font-family="Arial, sans-serif" font-size="18" fill="#7B817E">Sources: Korea PIPC and US FTC  |  Ratio: $5bn ÷ Facebook 2018 revenue of about $55.8bn</text>
</svg>
