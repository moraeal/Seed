<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="chart-title">
  <title id="chart-title">돌봄사업을 살필 세 가지 질문</title>
  <rect width="960" height="560" fill="#f2f4ee"/>
  <rect x="42" y="44" width="7" height="55" fill="#9f4d36"/>
  <text x="68" y="86" font-family="Noto Sans CJK KR, Noto Sans KR, Arial, sans-serif" font-weight="700" font-size="44" fill="#1c332d">돌봄사업을 살필 세 가지 질문</text>
  <g font-family="Noto Sans CJK KR, Noto Sans KR, Arial, sans-serif">
    <rect x="42" y="121" width="876" height="114" rx="12" fill="#ffffff"/>
    <text x="69" y="161" font-weight="700" font-size="30" fill="#546d60">선정 기준</text>
    <text x="69" y="209" font-weight="600" font-size="37" fill="#1c332d">어떤 기준으로 맡겼습니까?</text>
    <rect x="42" y="255" width="876" height="114" rx="12" fill="#ffffff"/>
    <text x="69" y="295" font-weight="700" font-size="30" fill="#546d60">운영 결과</text>
    <text x="69" y="343" font-weight="600" font-size="37" fill="#1c332d">약속한 시간을 지켰습니까?</text>
    <rect x="42" y="389" width="876" height="114" rx="12" fill="#ffffff"/>
    <text x="69" y="429" font-weight="700" font-size="30" fill="#546d60">문제 개선</text>
    <text x="69" y="477" font-weight="600" font-size="37" fill="#1c332d">문제가 생겼을 때 무엇을 고쳤습니까?</text>
  </g>
</svg>
