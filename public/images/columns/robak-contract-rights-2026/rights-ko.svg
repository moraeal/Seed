<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#ffffff"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="65" y="80" font-size="36" font-weight="700" fill="#173f35">계약의 자유와 먼저 확보한 권리</text><rect x="65" y="125" width="510" height="170" rx="12" fill="#edf4df"/><text x="90" y="173" font-size="22" fill="#58756b">01</text><text x="90" y="215" font-size="25" font-weight="700" fill="#173f35">사업 양도 계약</text><text x="90" y="257" font-size="21" fill="#36584d">양도대금 8억5천만 원</text><rect x="615" y="125" width="510" height="170" rx="12" fill="#e9f0f7"/><text x="640" y="173" font-size="22" fill="#58756b">02</text><text x="640" y="215" font-size="25" font-weight="700" fill="#173f35">채권자의 가압류</text><text x="640" y="257" font-size="21" fill="#36584d">그중 3억5천만 원을 보전</text><rect x="65" y="335" width="510" height="170" rx="12" fill="#f7eddf"/><text x="90" y="383" font-size="22" fill="#58756b">03</text><text x="90" y="425" font-size="25" font-weight="700" fill="#173f35">뒤늦은 합의해제</text><text x="90" y="467" font-size="21" fill="#36584d">계약 당사자 사이에서는 효력</text><rect x="615" y="335" width="510" height="170" rx="12" fill="#e0eee6"/><text x="640" y="383" font-size="22" fill="#58756b">04</text><text x="640" y="425" font-size="25" font-weight="700" fill="#173f35">제3자의 권리</text><text x="640" y="467" font-size="21" fill="#36584d">먼저 확보한 지위는 원칙적으로 보호</text><path d="M600 174h30m-10-8 10 8-10 8M325 303v25m-8-10 8 10 8-10M875 303v25m-8-10 8 10 8-10M600 382h30m-10-8 10 8-10 8" stroke="#608175" fill="none" stroke-width="3"/><text x="65" y="590" font-size="22" fill="#58756b">원고의 사례 요약 · 예외는 본문 참조</text></g></svg>