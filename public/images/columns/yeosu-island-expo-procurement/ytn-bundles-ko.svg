<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">YTN 제시액과 결과물 단위 재합산 비교</title><desc id="desc">테마존과 랜드마크를 여러 계약에서 결과물 단위로 다시 합산한 비교 그래픽</desc>
  <rect width="1400" height="900" fill="#f9f7ef"/><text x="90" y="90" fill="#102f46" font-family="Arial, sans-serif" font-size="42" font-weight="800">공고를 결과물 단위로 다시 묶으면</text><text x="90" y="134" fill="#56706f" font-family="Arial, sans-serif" font-size="22">단위 억 원 · 씨앗의 확인 계약 묶음은 포함 범위를 함께 표시</text>
  <g transform="translate(90 205)"><rect width="575" height="500" rx="24" fill="#ffffff" stroke="#cad8d3" stroke-width="2"/><text x="40" y="62" fill="#0b6e69" font-family="Arial, sans-serif" font-size="31" font-weight="800">세계·한국의 섬 테마존</text><text x="40" y="125" fill="#6b7c7a" font-family="Arial, sans-serif" font-size="20">YTN 최소 제시액</text><text x="40" y="205" fill="#102f46" font-family="Arial, sans-serif" font-size="68" font-weight="800">17억</text><path d="M245 180H310" stroke="#d0aa47" stroke-width="9" stroke-linecap="round"/><path d="M296 163L314 180L296 197" fill="none" stroke="#d0aa47" stroke-width="9"/><text x="335" y="125" fill="#6b7c7a" font-family="Arial, sans-serif" font-size="20">씨앗 재합산</text><text x="335" y="205" fill="#0b6e69" font-family="Arial, sans-serif" font-size="54" font-weight="800">35.3억</text><rect x="40" y="260" width="495" height="190" rx="14" fill="#eaf2ef"/><text x="65" y="305" fill="#183a48" font-family="Arial, sans-serif" font-size="21" font-weight="700">조성공사 17.73억</text><text x="65" y="345" fill="#183a48" font-family="Arial, sans-serif" font-size="21" font-weight="700">조형물 14.73억</text><text x="65" y="385" fill="#183a48" font-family="Arial, sans-serif" font-size="21" font-weight="700">전기 2.32억 + 보안등 예산 0.55억</text><text x="65" y="425" fill="#6b7c7a" font-family="Arial, sans-serif" font-size="18">설계비·기타 관급자재 제외</text></g>
  <g transform="translate(735 205)"><rect width="575" height="500" rx="24" fill="#ffffff" stroke="#cad8d3" stroke-width="2"/><text x="40" y="62" fill="#0b6e69" font-family="Arial, sans-serif" font-size="31" font-weight="800">주제섬 랜드마크</text><text x="40" y="125" fill="#6b7c7a" font-family="Arial, sans-serif" font-size="20">YTN 미디어파사드</text><text x="40" y="205" fill="#102f46" font-family="Arial, sans-serif" font-size="68" font-weight="800">37억</text><path d="M245 180H310" stroke="#d0aa47" stroke-width="9" stroke-linecap="round"/><path d="M296 163L314 180L296 197" fill="none" stroke="#d0aa47" stroke-width="9"/><text x="335" y="125" fill="#6b7c7a" font-family="Arial, sans-serif" font-size="20">건물까지 묶음</text><text x="335" y="205" fill="#0b6e69" font-family="Arial, sans-serif" font-size="54" font-weight="800">58.1억</text><rect x="40" y="260" width="495" height="190" rx="14" fill="#eaf2ef"/><text x="65" y="305" fill="#183a48" font-family="Arial, sans-serif" font-size="21" font-weight="700">화면 구매·설치 21.28억</text><text x="65" y="345" fill="#183a48" font-family="Arial, sans-serif" font-size="21" font-weight="700">외벽영상 제작·운영 14.6억</text><text x="65" y="385" fill="#183a48" font-family="Arial, sans-serif" font-size="21" font-weight="700">건축·기계공사 22.2억</text><text x="65" y="425" fill="#6b7c7a" font-family="Arial, sans-serif" font-size="18">통신·냉난방기 등 별도 계약 제외</text></g>
  <rect x="90" y="760" width="1220" height="82" rx="16" fill="#102f46"/><text x="700" y="812" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="800">계약을 나눠도 시민이 보는 결과물은 하나다</text>
</svg>
