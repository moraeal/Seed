      <rect x="32" y="36" width="220" height="18" rx="9" fill="#ffffff" opacity=".5"/>
      <rect x="32" y="78" width="300" height="10" rx="5" fill="#ffffff" opacity=".4"/>
      <rect x="32" y="106" width="245" height="10" rx="5" fill="#ffffff" opacity=".4"/>
      <text x="32" y="188" fill="#092b35" font-family="Arial, sans-serif" font-size="48" font-weight="800">KRW 69.56B</text>
      <text x="32" y="238" fill="#183f43" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1">REGISTERED VALUE</text>
    </g>
