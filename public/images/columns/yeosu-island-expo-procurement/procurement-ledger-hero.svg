<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Yeosu procurement records reconstructed</title>
  <desc id="desc">A data-led illustration connecting 126 tender notices to 412 contract registrations and KRW 69.56 billion in registered value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071f2d"/><stop offset="1" stop-color="#0c665d"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#dce9e3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#00151e" flood-opacity=".34"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1360" cy="95" r="260" fill="#c9a646" opacity=".1"/>
  <path d="M0 730C260 650 390 825 670 750S1120 600 1600 735V900H0Z" fill="#03151f" opacity=".55"/>
  <text x="110" y="120" fill="#d8b95b" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="7">SEED VOICE · DATA WATCH</text>
  <text x="110" y="192" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="800">YEOSU ISLAND EXPO</text>
  <text x="110" y="245" fill="#bcd7d0" font-family="Arial, sans-serif" font-size="28" font-weight="600">PROCUREMENT RECORDS RECONSTRUCTED</text>
  <g filter="url(#shadow)">
