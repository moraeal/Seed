      <rect x="32" y="36" width="195" height="18" rx="9" fill="#88a9a2"/>
      <rect x="32" y="78" width="300" height="10" rx="5" fill="#b9cbc6"/>
      <rect x="32" y="106" width="255" height="10" rx="5" fill="#b9cbc6"/>
      <text x="32" y="198" fill="#0b3f47" font-family="Arial, sans-serif" font-size="82" font-weight="800">126</text>
      <text x="32" y="238" fill="#426b6d" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">TENDER NOTICES</text>
    </g>
    <g transform="translate(618 330)">
      <rect width="365" height="270" rx="24" fill="url(#paper)"/>
      <rect x="32" y="36" width="220" height="18" rx="9" fill="#88a9a2"/>
      <rect x="32" y="78" width="300" height="10" rx="5" fill="#b9cbc6"/>
      <rect x="32" y="106" width="280" height="10" rx="5" fill="#b9cbc6"/>
      <text x="32" y="198" fill="#0b3f47" font-family="Arial, sans-serif" font-size="82" font-weight="800">412</text>
      <text x="32" y="238" fill="#426b6d" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CONTRACT RECORDS</text>
