<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f4f2ed"/><g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="72" y="90" font-size="46" fill="#192331" font-weight="700">폴란드의 충돌, 한국의 견제 장치</text><text x="72" y="139" font-size="24" fill="#596576" font-weight="500">확인된 사실과 향후 위험을 구분합니다 · 2026.11.02 기준</text><rect x="64" y="185" width="1472" height="80" fill="#223246"/><text x="88" y="237" font-size="28" fill="white" font-weight="700">쟁점</text><text x="410" y="237" font-size="28" fill="white" font-weight="700">폴란드</text><text x="990" y="237" font-size="28" fill="white" font-weight="700">한국</text><rect x="64" y="265" width="1472" height="155" fill="#ffffff"/><text x="88" y="332" font-size="26" fill="#1e3045" font-weight="700">최고 사법기관 구성</text><text x="410" y="322" font-size="26" fill="#26313d" font-weight="500">헌재 재판관의 자격과</text><text x="410" y="365" font-size="26" fill="#26313d" font-weight="500">새 지도부 권한을 다툼</text><text x="990" y="322" font-size="26" fill="#26313d" font-weight="500">대법관 14명 → 26명</text><text x="990" y="365" font-size="26" fill="#26313d" font-weight="500">2028~2030년 매년 4명 증원</text><rect x="64" y="420" width="1472" height="155" fill="#e9edf0"/><text x="88" y="487" font-size="26" fill="#1e3045" font-weight="700">기관장에 대한 조치</text><text x="410" y="477" font-size="26" fill="#26313d" font-weight="500">헌재 소장 등 직무정지 발표</text><text x="410" y="520" font-size="26" fill="#26313d" font-weight="500">기존 지도부가 적법성 부정</text><text x="990" y="477" font-size="26" fill="#26313d" font-weight="500">대법원장 탄핵 주장</text><text x="990" y="520" font-size="26" fill="#26313d" font-weight="500">국정조사 추진 단계</text><rect x="64" y="575" width="1472" height="155" fill="#ffffff"/><text x="88" y="642" font-size="26" fill="#1e3045" font-weight="700">헌법의 최종 판단</text><text x="410" y="632" font-size="26" fill="#26313d" font-weight="500">헌재의 정당성 자체가</text><text x="410" y="675" font-size="26" fill="#26313d" font-weight="500">정치·법적 분쟁의 대상</text><text x="990" y="632" font-size="26" fill="#26313d" font-weight="500">헌재 9명: 대통령·국회·</text><text x="990" y="675" font-size="26" fill="#26313d" font-weight="500">대법원장이 각각 3명 관여</text><text x="72" y="793" font-size="25" fill="#9b2937" font-weight="700">인사권·기관장 통제·최종 심판의 독립성이 함께 약해질 위험을 비교한 논평입니다.</text><text x="72" y="846" font-size="22" fill="#677386" font-weight="500">출처: 법원조직법·대한민국헌법·Euronews·연합뉴스 / 씨앗의 소리</text></g></svg>