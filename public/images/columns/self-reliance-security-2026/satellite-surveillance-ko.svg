<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="한국 군 정찰위성 현황과 2030년 대북 감시목표 비교 도표">
<rect width="1440" height="820" fill="#f4f6f8"/>
<rect width="1440" height="135" fill="#13263b"/><rect y="130" width="1440" height="5" fill="#bf543f"/>
<g font-family="'Noto Sans KR','Malgun Gothic',sans-serif"><text x="68" y="62" font-size="29" font-weight="700" fill="#a8c1d0">대북 감시체계 · 공개 보도 기준</text><text x="68" y="111" font-size="42" font-weight="800" fill="#fff">위성 5기 발사, 그리고 남아 있는 감시 공백</text>
<rect x="68" y="177" width="633" height="402" rx="20" fill="#fff" stroke="#dbe2e8" stroke-width="2"/>
<rect x="739" y="177" width="633" height="402" rx="20" fill="#fff" stroke="#dbe2e8" stroke-width="2"/>
<text x="105" y="231" fill="#183755" font-size="29" font-weight="750">2026년 10월 현재</text><text x="776" y="231" fill="#183755" font-size="29" font-weight="750">2030년 추가 구축 목표</text>
<text x="107" y="295" font-size="67" font-weight="800" fill="#243b4c">5기</text><text x="261" y="293" fill="#5b6b78" font-size="27">발사 완료</text>
<g transform="translate(103 332)"><circle cx="30" cy="30" r="23" fill="#2b866e"/><circle cx="107" cy="30" r="23" fill="#2b866e"/><circle cx="184" cy="30" r="23" fill="#2b866e"/><circle cx="261" cy="30" r="23" fill="#2b866e"/><circle cx="338" cy="30" r="23" fill="#c45448"/><path d="M327 19l22 22m0-22-22 22" stroke="white" stroke-width="6"/></g>
<text x="106" y="422" fill="#273e4e" font-size="25" font-weight="700">4기 정상 · 4호기 운용 중단 보도</text><text x="106" y="460" fill="#687b88" font-size="22">425사업 5기 체계의 공표된 관측 목표</text><text x="106" y="521" fill="#b14b3d" font-size="51" font-weight="800">약 2시간</text>
<text x="779" y="305" fill="#146f69" font-size="76" font-weight="850">30분 이내</text><text x="779" y="361" fill="#344d5d" font-size="25">한반도 재방문 주기 단축 구상</text>
<path d="M790 425H1300" stroke="#c9d5dc" stroke-width="10" stroke-linecap="round"/><path d="M790 425H1240" stroke="#2f8c80" stroke-width="10" stroke-linecap="round"/><circle cx="1240" cy="425" r="20" fill="#2f8c80"/>
<text x="779" y="486" font-size="24" fill="#475e6b">소형·초소형 정찰위성 추가 확보 계획</text><text x="779" y="531" font-size="23" fill="#637786">일정·전력화는 향후 사업 진행에 따라 달라질 수 있음</text>
<rect x="68" y="612" width="1304" height="119" rx="14" fill="#e6edf1"/><text x="100" y="661" font-size="27" font-weight="750" fill="#20394b">유의할 점</text><text x="100" y="704" font-size="23" fill="#3f5968">관측 ‘재방문 주기’는 미사일 발사 징후를 항상 실시간 포착한다는 뜻이 아니다. 미국 정찰·조기경보 및 지상·해상·공중자산과 별도 통합 운용한다.</text>
<text x="69" y="781" font-size="19" fill="#637584">자료: 연합뉴스(425사업·2030년 계획), 2026년 10월 정찰위성 4호기 고장 보도. 수치와 목표는 공개 자료에 기초함.</text></g></svg>