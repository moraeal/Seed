<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f6f1"/><text x="72" y="104" font-family="Noto Sans KR, sans-serif" font-size="39" font-weight="700" fill="#183e32">시민사회가 자라는 네 가지 기준</text><text x="72" y="153" font-family="Noto Sans KR, sans-serif" font-size="24" fill="#53665b">조직의 규모와 함께 시민의 자리를 살핍니다</text><rect x="72" y="205" width="1056" height="78" rx="6" fill="#ffffff"/><circle cx="115" cy="244" r="20" fill="#d9e9df"/><text x="115" y="252" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#176247">1</text><text x="160" y="253" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#183e32">의제</text><text x="400" y="253" font-family="Noto Sans KR, sans-serif" font-size="24" fill="#34483d">시민의 문제에서 출발하는가</text><rect x="72" y="303" width="1056" height="78" rx="6" fill="#ffffff"/><circle cx="115" cy="342" r="20" fill="#d9e9df"/><text x="115" y="350" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#176247">2</text><text x="160" y="351" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#183e32">결정</text><text x="400" y="351" font-family="Noto Sans KR, sans-serif" font-size="24" fill="#34483d">다른 의견과 재검토가 가능한가</text><rect x="72" y="401" width="1056" height="78" rx="6" fill="#ffffff"/><circle cx="115" cy="440" r="20" fill="#d9e9df"/><text x="115" y="448" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#176247">3</text><text x="160" y="449" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#183e32">재정</text><text x="400" y="449" font-family="Noto Sans KR, sans-serif" font-size="24" fill="#34483d">재원과 이해관계를 공개하는가</text><rect x="72" y="499" width="1056" height="78" rx="6" fill="#ffffff"/><circle cx="115" cy="538" r="20" fill="#d9e9df"/><text x="115" y="546" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#176247">4</text><text x="160" y="547" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#183e32">책임</text><text x="400" y="547" font-family="Noto Sans KR, sans-serif" font-size="24" fill="#34483d">변화와 실패를 설명하는가</text></svg>