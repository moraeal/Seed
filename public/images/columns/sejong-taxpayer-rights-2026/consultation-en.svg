<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="#f7f5ef"/><g font-family="sans-serif" fill="#243640"><text x="70" y="90" font-size="42" font-weight="700">The 1430 land-tax consultation</text><text x="70" y="146" font-size="26">172,806 responses | Views differed sharply by region</text><rect x="70" y="205" width="605.1" height="90" fill="#345d67"/><rect x="675.1" y="205" width="454.9" height="90" fill="#ae793f"/><text x="70" y="355" font-size="29" font-weight="700">In favor: 98,657 · 57.1%</text><text x="675" y="355" font-size="29" font-weight="700">Opposed: 74,149 · 42.9%</text><text x="70" y="441" font-size="21" fill="#66757b">Source: National Institute of Korean History, Our History Net</text></g></svg>