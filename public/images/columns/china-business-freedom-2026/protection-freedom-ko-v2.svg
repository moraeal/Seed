<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#f6f4ed"/><g font-family="Noto Sans KR, NanumGothic, sans-serif"><text x="72" y="105" font-size="43" font-weight="700" fill="#142e41">산업안보는 기업의 자유를 지키는 조건이다</text><text x="72" y="153" font-size="25" fill="#526471">협력 확대 정책이 함께 입증해야 할 것</text><path d="M72 191H1368" stroke="#183e4e" stroke-width="3"/><rect x="72" y="237" width="416" height="380" fill="#e5eee8"/><rect x="72" y="237" width="416" height="7" fill="#2a5a49"/><text x="96" y="300" font-size="30" font-weight="700" fill="#183e4e">기업이 누릴 자유</text><text x="96" y="385" font-size="27" font-weight="500" fill="#263d48">정상적인 교역과 해외 투자</text><text x="96" y="460" font-size="27" font-weight="500" fill="#263d48">기술 소유와 정당한 대가</text><text x="96" y="535" font-size="27" font-weight="500" fill="#263d48">협력 거절과 시장 전환</text><rect x="512" y="237" width="416" height="380" fill="#ede1de"/><rect x="512" y="237" width="416" height="7" fill="#93483f"/><text x="536" y="300" font-size="30" font-weight="700" fill="#183e4e">막아야 할 위험</text><text x="536" y="385" font-size="27" font-weight="500" fill="#263d48">불법 기술취득과 유출</text><text x="536" y="460" font-size="27" font-weight="500" fill="#263d48">민감정보의 무단 접근</text><text x="536" y="535" font-size="27" font-weight="500" fill="#263d48">경제적 강압과 과잉 의존</text><rect x="952" y="237" width="416" height="380" fill="#e5ebf0"/><rect x="952" y="237" width="416" height="7" fill="#284b6b"/><text x="976" y="300" font-size="30" font-weight="700" fill="#183e4e">정부가 입증할 보호</text><text x="976" y="385" font-size="27" font-weight="500" fill="#263d48">보호 대상과 제외 범위</text><text x="976" y="460" font-size="27" font-weight="500" fill="#263d48">자료 접근과 성과 귀속 기준</text><text x="976" y="535" font-size="27" font-weight="500" fill="#263d48">위험 심사·중단·책임체계</text><text x="72" y="708" font-size="31" font-weight="700" fill="#183e4e">협력의 문을 넓힐수록, 기술을 지킬 빗장을 분명히</text><text x="72" y="758" font-size="21" fill="#61717a">씨앗의 소리 · 정책 판단을 정리한 설명 도표</text></g></svg>