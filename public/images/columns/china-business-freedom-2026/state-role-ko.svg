<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#f6f4ed"/><g font-family="Noto Sans KR, NanumGothic, sans-serif"><text x="72" y="105" font-size="43" font-weight="700" fill="#142e41">산업안보, 국가 권한을 어디까지 허용할 것인가</text><text x="72" y="153" font-size="25" fill="#526471">이 글의 판단 기준 · 보호책임과 권한의 한계를 함께 본다</text><path d="M72 191H1368" stroke="#183e4e" stroke-width="3"/><rect x="72" y="237" width="416" height="380" rx="0" fill="#e5eee8"/><rect x="72" y="237" width="416" height="7" fill="#2a5a49"/><text x="96" y="300" font-size="30" font-weight="700" fill="#183e4e">기업이 선택할 영역</text><text x="96" y="370" font-size="27" font-weight="500" fill="#263d48">정상적인 교역과 해외 투자</text><text x="96" y="428" font-size="27" font-weight="500" fill="#263d48">정당한 기술거래와 공동연구</text><text x="96" y="486" font-size="27" font-weight="500" fill="#263d48">혁신의 방향과 사업 전환</text><rect x="512" y="237" width="416" height="380" rx="0" fill="#e5ebf0"/><rect x="512" y="237" width="416" height="7" fill="#284b6b"/><text x="536" y="300" font-size="30" font-weight="700" fill="#183e4e">국가가 책임질 영역</text><text x="536" y="370" font-size="27" font-weight="500" fill="#263d48">기술유출 범죄 수사·법 집행</text><text x="536" y="428" font-size="27" font-weight="500" fill="#263d48">구체적 안보위험의 제한적 심사</text><text x="536" y="486" font-size="27" font-weight="500" fill="#263d48">경제적 강압·불공정 관행 대응</text><rect x="952" y="237" width="416" height="380" rx="0" fill="#ede7dc"/><rect x="952" y="237" width="416" height="7" fill="#8c6840"/><text x="976" y="300" font-size="30" font-weight="700" fill="#183e4e">권한을 검증할 기준</text><text x="976" y="370" font-size="27" font-weight="500" fill="#263d48">어떤 위험인가: 구체적 입증</text><text x="976" y="428" font-size="27" font-weight="500" fill="#263d48">더 좁은 수단은 없는가</text><text x="976" y="486" font-size="27" font-weight="500" fill="#263d48">법률·이의제기·사법 통제</text><text x="976" y="544" font-size="27" font-weight="500" fill="#263d48">비용·효과·종료 조건 공개</text><text x="72" y="708" font-size="31" font-weight="700" fill="#183e4e">기업의 자유를 지키는 국가 · 그 국가의 권한을 감시하는 시민</text><text x="72" y="758" font-size="21" fill="#61717a">씨앗의 소리 · 정책 판단을 정리한 설명 도표</text></g></svg>