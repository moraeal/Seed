<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#f6f4ed"/><g font-family="Noto Sans KR, NanumGothic, sans-serif"><text x="72" y="105" font-size="43" font-weight="700" fill="#142e41">Industrial security protects corporate freedom</text><text x="72" y="153" font-size="25" fill="#526471">What a policy of expanded cooperation must demonstrate</text><path d="M72 191H1368" stroke="#183e4e" stroke-width="3"/><rect x="72" y="237" width="416" height="380" fill="#e5eee8"/><rect x="72" y="237" width="416" height="7" fill="#2a5a49"/><text x="96" y="300" font-size="28" font-weight="700" fill="#183e4e">Corporate freedoms</text><text x="96" y="385" font-size="21" font-weight="500" fill="#263d48">Legitimate trade and investment</text><text x="96" y="460" font-size="21" font-weight="500" fill="#263d48">Technology ownership and payment</text><text x="96" y="535" font-size="21" font-weight="500" fill="#263d48">Freedom to decline and diversify</text><rect x="512" y="237" width="416" height="380" fill="#ede1de"/><rect x="512" y="237" width="416" height="7" fill="#93483f"/><text x="536" y="300" font-size="28" font-weight="700" fill="#183e4e">Risks to address</text><text x="536" y="385" font-size="21" font-weight="500" fill="#263d48">Technology theft and illegal transfers</text><text x="536" y="460" font-size="21" font-weight="500" fill="#263d48">Unauthorized access to sensitive data</text><text x="536" y="535" font-size="21" font-weight="500" fill="#263d48">Economic coercion and dependence</text><rect x="952" y="237" width="416" height="380" fill="#e5ebf0"/><rect x="952" y="237" width="416" height="7" fill="#284b6b"/><text x="976" y="300" font-size="28" font-weight="700" fill="#183e4e">Public responsibilities</text><text x="976" y="385" font-size="21" font-weight="500" fill="#263d48">Protected technologies and exclusions</text><text x="976" y="460" font-size="21" font-weight="500" fill="#263d48">Access rights and ownership of results</text><text x="976" y="535" font-size="21" font-weight="500" fill="#263d48">Risk review, exit and accountability</text><text x="72" y="708" font-size="31" font-weight="700" fill="#183e4e">Open opportunities. Keep safeguards for technology firmly in place.</text><text x="72" y="758" font-size="21" fill="#61717a">SEED VOICE · explanatory framework, not a statistical chart</text></g></svg>