<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#f6f4ed"/><g font-family="Noto Sans KR, NanumGothic, sans-serif"><text x="72" y="105" font-size="43" font-weight="700" fill="#142e41">Industrial security: how far should state power reach?</text><text x="72" y="153" font-size="25" fill="#526471">The article’s framework: responsibilities and limits together</text><path d="M72 191H1368" stroke="#183e4e" stroke-width="3"/><rect x="72" y="237" width="416" height="380" rx="0" fill="#e5eee8"/><rect x="72" y="237" width="416" height="7" fill="#2a5a49"/><text x="96" y="300" font-size="30" font-weight="700" fill="#183e4e">Business choices</text><text x="96" y="370" font-size="21" font-weight="500" fill="#263d48">Legitimate trade and investment</text><text x="96" y="428" font-size="21" font-weight="500" fill="#263d48">Lawful technology and research ties</text><text x="96" y="486" font-size="21" font-weight="500" fill="#263d48">Innovation and business strategy</text><rect x="512" y="237" width="416" height="380" rx="0" fill="#e5ebf0"/><rect x="512" y="237" width="416" height="7" fill="#284b6b"/><text x="536" y="300" font-size="30" font-weight="700" fill="#183e4e">State responsibilities</text><text x="536" y="370" font-size="21" font-weight="500" fill="#263d48">Enforce laws against technology theft</text><text x="536" y="428" font-size="21" font-weight="500" fill="#263d48">Target specific security risks</text><text x="536" y="486" font-size="21" font-weight="500" fill="#263d48">Respond to coercion and unfair trade</text><rect x="952" y="237" width="416" height="380" rx="0" fill="#ede7dc"/><rect x="952" y="237" width="416" height="7" fill="#8c6840"/><text x="976" y="300" font-size="30" font-weight="700" fill="#183e4e">Tests of state power</text><text x="976" y="370" font-size="21" font-weight="500" fill="#263d48">Evidence of a specific risk</text><text x="976" y="428" font-size="21" font-weight="500" fill="#263d48">The narrowest effective measure</text><text x="976" y="486" font-size="21" font-weight="500" fill="#263d48">Law, appeals and judicial review</text><text x="976" y="544" font-size="21" font-weight="500" fill="#263d48">Costs, outcomes and sunset terms</text><text x="72" y="708" font-size="31" font-weight="700" fill="#183e4e">A state that protects enterprise. Citizens who scrutinize its powers.</text><text x="72" y="758" font-size="21" fill="#61717a">SEED VOICE · explanatory framework, not a statistical chart</text></g></svg>