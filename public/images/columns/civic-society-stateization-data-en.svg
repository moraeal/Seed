<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">More participation, but more public influence?</title>
  <desc id="desc">An infographic comparing increased subsidies to private organizations with the limited influence of public proposals on Korea's open-government action plan</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16352A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6E857A"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F5F1E8"/>
  <circle cx="1475" cy="95" r="210" fill="#DDE8DF" opacity="0.65"/>
  <circle cx="115" cy="815" r="190" fill="#E7D8C8" opacity="0.55"/>

  <text x="110" y="102" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="28" font-weight="700" fill="#28704F" letter-spacing="2">SEED DATA</text>
  <text x="110" y="166" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#182D25">More participation,</text>
  <text x="110" y="230" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#182D25">but more public influence?</text>
  <text x="110" y="276" font-family="Arial, sans-serif" font-size="22" fill="#58675F">More funding and more channels do not automatically secure representation, autonomy or influence.</text>

  <rect x="95" y="330" width="680" height="390" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="140" y="386" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#33493F">State–private financial ties</text>
  <text x="140" y="430" font-family="Arial, sans-serif" font-size="18" fill="#718078">Total national subsidies</text>

  <rect x="155" y="570" width="150" height="86" rx="12" fill="#BFD4C6"/>
  <rect x="455" y="488" width="150" height="168" rx="12" fill="#347456"/>
  <line x1="130" y1="657" x2="650" y2="657" stroke="#B9C2BD" stroke-width="2"/>
  <text x="230" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="800" fill="#244B39">KRW 3.56tn</text>
  <text x="530" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="800" fill="#244B39">KRW 5.45tn</text>
  <text x="230" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#58675F">2016</text>
  <text x="530" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#58675F">2022</text>
  <path d="M320 570 C365 525, 400 515, 438 507" fill="none" stroke="#B46A4D" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="315" y="520" width="126" height="48" rx="24" fill="#F5E0D5"/>
  <text x="378" y="551" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="800" fill="#9A5036">+53.1%</text>

  <rect x="825" y="330" width="680" height="390" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="870" y="386" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#33493F">Open-government plan in practice</text>
  <text x="870" y="430" font-family="Arial, sans-serif" font-size="18" fill="#718078">2020 public call and final commitments</text>

  <circle cx="960" cy="535" r="76" fill="#DDEBDF"/>
  <text x="960" y="523" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="50" font-weight="800" fill="#28694B">140</text>
  <text x="960" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#476258">public proposals</text>

  <path d="M1050 535 L1160 535" stroke="#6E857A" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1177" y="462" width="260" height="146" rx="22" fill="#F4E2D8"/>
  <text x="1307" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#8A4933">Most final commitments</text>
  <text x="1307" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#713824">from agencies</text>
  <text x="1307" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7C6359">Civil society: mainly existing members</text>

  <rect x="885" y="634" width="540" height="54" rx="12" fill="#EEF1EF"/>
  <text x="1155" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#42534B">More channels ≠ more public influence</text>

  <rect x="290" y="760" width="1020" height="76" rx="38" fill="#173D2E"/>
  <text x="800" y="808" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">As funding grows, representation, autonomy and scrutiny require tougher safeguards.</text>

  <text x="100" y="870" font-family="Arial, sans-serif" font-size="15" fill="#6C7771">Sources: Korea Policy Briefing (Dec. 28, 2022); Open Government Partnership IRM Action Plan Review (June 21, 2022)</text>
  <text x="1500" y="870" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#28704F">SEED CIVIC PARTNERS</text>
</svg>
