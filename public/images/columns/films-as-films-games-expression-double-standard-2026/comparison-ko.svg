<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><rect width="1400" height="790" fill="#f4f5ef"/><g font-family="Noto Sans KR,Arial,sans-serif" fill="#19372c"><text x="65" y="100" font-size="44" font-weight="700">비판과 국가 제재는 다릅니다</text><rect x="60" y="150" width="1280" height="130" fill="white"/><rect x="60" y="150" width="7" height="130" fill="#38654d"/><text x="90" y="193" font-size="25" font-weight="500">영화 논쟁 · 10월 2일</text><text x="90" y="240" font-size="33" font-weight="700">창작의 자유 옹호</text><text x="790" y="225" font-size="24" font-weight="500">민주당: 영화는 영화로</text><rect x="60" y="305" width="1280" height="130" fill="white"/><rect x="60" y="305" width="7" height="130" fill="#38654d"/><text x="90" y="348" font-size="25" font-weight="500">게임 논란 · 10월 29일</text><text x="90" y="395" font-size="33" font-weight="700">처벌·차단 가능성 언급</text><text x="790" y="380" font-size="24" font-weight="500">윤호중 장관의 기자간담회</text><rect x="60" y="460" width="1280" height="130" fill="white"/><rect x="60" y="460" width="7" height="130" fill="#38654d"/><text x="90" y="503" font-size="25" font-weight="500">후속 상황 · 10월 30일</text><text x="90" y="550" font-size="33" font-weight="700">사과와 영상 삭제 예고</text><text x="790" y="535" font-size="24" font-weight="500">실제 이용 차단 결정은 없음</text><text x="65" y="690" font-size="26" font-weight="500">같은 사건이라는 뜻이 아닙니다. 구체적인 피해와 필요한 조치의 범위를 구분해야 합니다.</text><text x="65" y="745" font-size="20" fill="#5c6a61">자료: 파이낸셜뉴스·아주경제·연합뉴스·헤럴드경제 | 2026.11.2 확인</text></g></svg>