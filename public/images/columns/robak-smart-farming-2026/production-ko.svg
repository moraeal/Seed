<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740"><rect width="1400" height="740" fill="#fff"/><g font-family="Pretendard,Noto Sans KR,Arial,sans-serif" fill="#193a2e"><text x="70" y="95" font-size="48" font-weight="700">농업은 출하까지 이어진다</text><text x="70" y="153" font-size="28" fill="#53665e">필자의 제안: 시설별 면적보다 농업과의 기능적 연결을 심사</text><rect x="70" y="230" width="390" height="155" fill="#eaf1ed"/><text x="265" y="319" text-anchor="middle" font-size="32" font-weight="600">재배</text><path d="M470 306h25m-10-10 10 10-10 10" fill="none" stroke="#315748" stroke-width="3"/><rect x="505" y="230" width="390" height="155" fill="#eaf1ed"/><text x="700" y="319" text-anchor="middle" font-size="32" font-weight="600">선별·가공·포장</text><path d="M905 306h25m-10-10 10 10-10 10" fill="none" stroke="#315748" stroke-width="3"/><rect x="940" y="230" width="390" height="155" fill="#eaf1ed"/><text x="1135" y="319" text-anchor="middle" font-size="32" font-weight="600">저장·출하</text><rect x="70" y="425" width="1260" height="108" fill="#f5f2e9"/><text x="700" y="490" text-anchor="middle" font-size="29">생산·품질·출하 관리 | 용수·배수·오폐수 처리 | 근로자 식사·휴게</text><text x="70" y="615" font-size="30" font-weight="600">생산량·처리량·고용인원 확인 → 필요한 규모 심사 → 실제 이용 사후관리</text><text x="70" y="689" font-size="23" fill="#64746c">원고의 정책 제안을 재구성한 개념도</text></g></svg>