<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#f8f6ef"/><g font-family="Pretendard, Noto Sans KR, sans-serif"><text x="60" y="78" font-size="38" font-weight="700" fill="#172c3c">문에 안내문을 붙이기 전, 세 가지 기준</text><rect x="55" y="114" width="1090" height="88" rx="6" fill="#ffffff"/><text x="85" y="168" font-size="30" font-weight="700" fill="#215941">행동</text><text x="260" y="168" font-size="29" font-weight="500" fill="#263b46">문제 행동부터 줄일 방법을 찾는다</text><rect x="55" y="220" width="1090" height="88" rx="6" fill="#ffffff"/><text x="85" y="274" font-size="30" font-weight="700" fill="#215941">위험</text><text x="260" y="274" font-size="29" font-weight="500" fill="#263b46">제한이 필요하면 이유와 범위를 설명한다</text><rect x="55" y="326" width="1090" height="88" rx="6" fill="#ffffff"/><text x="85" y="380" font-size="30" font-weight="700" fill="#215941">책임</text><text x="260" y="380" font-size="29" font-weight="500" fill="#263b46">손님이 되었을 때도 같은 기준을 받아들인다</text></g></svg>