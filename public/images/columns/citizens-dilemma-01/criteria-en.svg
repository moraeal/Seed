<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#f8f6ef"/><g font-family="Pretendard, Noto Sans KR, sans-serif"><text x="60" y="78" font-size="38" font-weight="700" fill="#172c3c">Three checks before posting a rule</text><rect x="55" y="114" width="1090" height="88" rx="6" fill="#ffffff"/><text x="85" y="168" font-size="30" font-weight="700" fill="#215941">Conduct</text><text x="335" y="168" font-size="25" font-weight="500" fill="#263b46">First, find ways to prevent disruptive conduct.</text><rect x="55" y="220" width="1090" height="88" rx="6" fill="#ffffff"/><text x="85" y="274" font-size="30" font-weight="700" fill="#215941">Risk</text><text x="335" y="274" font-size="25" font-weight="500" fill="#263b46">Explain why a limit is needed and keep it narrow.</text><rect x="55" y="326" width="1090" height="88" rx="6" fill="#ffffff"/><text x="85" y="380" font-size="30" font-weight="700" fill="#215941">Responsibility</text><text x="335" y="380" font-size="25" font-weight="500" fill="#263b46">Accept the same standard when you are a customer.</text></g></svg>