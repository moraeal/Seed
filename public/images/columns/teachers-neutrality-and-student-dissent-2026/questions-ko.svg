<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570"><rect width="960" height="570" fill="#f5f2e9"/><g font-family="Noto Sans CJK KR, NanumGothic, sans-serif"><text x="48" y="66" font-size="34" font-weight="700" fill="#172d29">교실에서 질문의 성격을 가르는 세 기준</text><rect x="40" y="101" width="880" height="133" rx="12" fill="white"/><text x="65" y="146" font-size="27" font-weight="700" fill="#166659">사실을 묻는 학생</text><text x="65" y="187" font-size="25" font-weight="600" fill="#202c2a">“실제로 무슨 일이 있었나요?”</text><text x="65" y="217" font-size="20" font-weight="500" fill="#43504c">원문 기록과 날짜를 함께 확인한다.</text><rect x="40" y="249" width="880" height="133" rx="12" fill="white"/><text x="65" y="294" font-size="27" font-weight="700" fill="#166659">해석을 달리하는 학생</text><text x="65" y="335" font-size="25" font-weight="600" fill="#202c2a">“이 사료에서는 다른 결론도 나옵니다.”</text><text x="65" y="365" font-size="20" font-weight="500" fill="#43504c">충돌하는 근거와 해석을 논의한다.</text><rect x="40" y="397" width="880" height="133" rx="12" fill="white"/><text x="65" y="442" font-size="27" font-weight="700" fill="#166659">모욕을 당한 학생</text><text x="65" y="483" font-size="25" font-weight="600" fill="#202c2a">“그 말 때문에 수업에 참여하기 어렵습니다.”</text><text x="65" y="513" font-size="20" font-weight="500" fill="#43504c">침해된 권리를 확인하고 학생을 보호한다.</text></g></svg>