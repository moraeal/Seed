<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570"><rect width="960" height="570" fill="#f5f2e9"/><g font-family="Noto Sans CJK KR, NanumGothic, sans-serif"><text x="48" y="66" font-size="34" font-weight="700" fill="#172d29">Three kinds of questions in a classroom</text><rect x="40" y="101" width="880" height="133" rx="12" fill="white"/><text x="65" y="146" font-size="27" font-weight="700" fill="#166659">A question of fact</text><text x="65" y="187" font-size="25" font-weight="600" fill="#202c2a">“What actually happened?”</text><text x="65" y="217" font-size="20" font-weight="500" fill="#43504c">Check the dates and the original records.</text><rect x="40" y="249" width="880" height="133" rx="12" fill="white"/><text x="65" y="294" font-size="27" font-weight="700" fill="#166659">A different interpretation</text><text x="65" y="335" font-size="25" font-weight="600" fill="#202c2a">“This source points to another conclusion.”</text><text x="65" y="365" font-size="20" font-weight="500" fill="#43504c">Discuss the evidence and the competing readings.</text><rect x="40" y="397" width="880" height="133" rx="12" fill="white"/><text x="65" y="442" font-size="27" font-weight="700" fill="#166659">A student facing an insult</text><text x="65" y="483" font-size="25" font-weight="600" fill="#202c2a">“That remark makes it hard for me to participate.”</text><text x="65" y="513" font-size="20" font-weight="500" fill="#43504c">Identify the harm and protect the student.</text></g></svg>