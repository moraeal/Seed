<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">한국·대만·스웨덴 상속세 제도 비교</title>
  <desc id="desc">한국 최고세율 50퍼센트, 최대주주 주식 할증평가 때 60퍼센트 상당. 대만 최고세율 20퍼센트. 스웨덴 상속세와 증여세 폐지.</desc>
  <rect width="1200" height="700" fill="#f7f4ec"/>
  <text x="70" y="82" fill="#0f2438" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="42" font-weight="800">상속세, 세 나라는 다른 길을 택했다</text>
  <text x="70" y="126" fill="#40505c" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22">법정 최고세율 기준 · 한국의 60%는 최대주주 주식 할증평가 반영 시</text>
  <line x1="268" y1="180" x2="268" y2="570" stroke="#d8d4c8" stroke-width="2"/>
  <line x1="268" y1="570" x2="1080" y2="570" stroke="#d8d4c8" stroke-width="2"/>
  <g fill="#66737b" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="18">
    <text x="258" y="603" text-anchor="middle">0</text>
    <text x="528" y="603" text-anchor="middle">20%</text>
    <text x="798" y="603" text-anchor="middle">40%</text>
    <text x="1068" y="603" text-anchor="middle">60%</text>
  </g>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
    <text x="70" y="258" fill="#0f2438" font-size="30" font-weight="800">한국</text>
    <rect x="268" y="216" width="675" height="62" rx="8" fill="#174c3a"/>
    <rect x="943" y="216" width="135" height="62" rx="8" fill="#b88b27"/>
    <text x="920" y="258" fill="#ffffff" font-size="27" font-weight="800" text-anchor="end">50%</text>
    <text x="1010" y="258" fill="#ffffff" font-size="23" font-weight="800" text-anchor="middle">60%</text>
    <text x="70" y="300" fill="#56636c" font-size="18">최대주주 주식은 할증평가 가능</text>
    <text x="70" y="392" fill="#0f2438" font-size="30" font-weight="800">대만</text>
    <rect x="268" y="350" width="270" height="62" rx="8" fill="#39745d"/>
    <text x="515" y="392" fill="#ffffff" font-size="27" font-weight="800" text-anchor="end">20%</text>
    <text x="70" y="434" fill="#56636c" font-size="18">2009년 10%로 인하, 현재 최고 20%</text>
    <text x="70" y="526" fill="#0f2438" font-size="30" font-weight="800">스웨덴</text>
    <circle cx="268" cy="503" r="12" fill="#8a958f"/>
    <text x="300" y="512" fill="#174c3a" font-size="28" font-weight="800">상속·증여세 폐지</text>
    <text x="70" y="568" fill="#56636c" font-size="18">2004년 말 폐지 결정</text>
  </g>
  <rect x="70" y="638" width="1060" height="2" fill="#d8d4c8"/>
  <text x="70" y="674" fill="#6a747a" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17">자료: 한국 국세청, 대만 재정부, 스웨덴 상속세 역사 연구 · 씨앗의 소리 재구성</text>
</svg>
