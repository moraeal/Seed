<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" role="img" aria-label="시민단체 출신 인물들의 세 가지 공직 진출 경로"><rect width="1200" height="505" fill="#f8f9f5"/><text x="60" y="72" font-size="35" font-family="sans-serif" font-weight="700" fill="#194b3b">시민단체에서 공직으로 — 세 개의 경로</text><text x="60" y="111" font-size="18" font-family="sans-serif" fill="#57695f">영상의 설명을 검증 가능한 제도적 경로로 재구성</text><rect x="60" y="191" width="235" height="123" rx="12" fill="#205541"/><text x="178" y="245" text-anchor="middle" font-size="28" font-weight="700" font-family="sans-serif" fill="#fff">시민단체</text><text x="178" y="281" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#d7ece3">활동·정책·네트워크</text><path d="M 305 253 L 415 203 L 462 203" stroke="#718f80" stroke-width="5" fill="none"/><path d="M 450 195 L 463 203 L 450 211" stroke="#718f80" stroke-width="5" fill="none"/><rect x="475" y="159" width="650" height="90" rx="12" fill="#edf3ee"/><text x="510" y="196" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e4e3c">① 국회</text><text x="510" y="226" font-family="sans-serif" font-size="18" fill="#3f5b4d">비례대표 공천 · 의원 진출</text><path d="M 305 253 L 415 317 L 462 317" stroke="#718f80" stroke-width="5" fill="none"/><path d="M 450 309 L 463 317 L 450 325" stroke="#718f80" stroke-width="5" fill="none"/><rect x="475" y="273" width="650" height="90" rx="12" fill="#e6efe7"/><text x="510" y="310" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e4e3c">② 정부 고위직</text><text x="510" y="340" font-family="sans-serif" font-size="18" fill="#3f5b4d">장관·청와대 수석 등 임명</text><path d="M 305 253 L 415 431 L 462 431" stroke="#718f80" stroke-width="5" fill="none"/><path d="M 450 423 L 463 431 L 450 439" stroke="#718f80" stroke-width="5" fill="none"/><rect x="475" y="387" width="650" height="90" rx="12" fill="#edf3ee"/><text x="510" y="424" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e4e3c">③ 공공기관·사업</text><text x="510" y="454" font-family="sans-serif" font-size="18" fill="#3f5b4d">기관장 임명 · 보조금·위탁사업</text><text x="60" y="477" font-size="16" font-family="sans-serif" fill="#587060">※ 인사 경력은 확인 가능한 사실이나 이해충돌·특혜 여부는 개별 검증 대상입니다.</text></svg>