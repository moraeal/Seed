<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" role="img" aria-label="Three pathways from civic organizations to public roles"><rect width="1200" height="505" fill="#f8f9f5"/><text x="60" y="72" font-size="35" font-family="sans-serif" font-weight="700" fill="#194b3b">From Civic Organizations to Public Roles</text><text x="60" y="111" font-size="18" font-family="sans-serif" fill="#57695f">A diagram of institutional pathways—not a finding of misconduct</text><rect x="60" y="191" width="235" height="123" rx="12" fill="#205541"/><text x="178" y="245" text-anchor="middle" font-size="28" font-weight="700" font-family="sans-serif" fill="#fff">Civic groups</text><text x="178" y="281" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#d7ece3">Advocacy and expertise</text><path d="M 305 253 L 415 203 L 462 203" stroke="#718f80" stroke-width="5" fill="none"/><path d="M 450 195 L 463 203 L 450 211" stroke="#718f80" stroke-width="5" fill="none"/><rect x="475" y="159" width="650" height="90" rx="12" fill="#edf3ee"/><text x="510" y="196" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e4e3c">1  Parliament</text><text x="510" y="226" font-family="sans-serif" font-size="18" fill="#3f5b4d">Party nominations and elections</text><path d="M 305 253 L 415 317 L 462 317" stroke="#718f80" stroke-width="5" fill="none"/><path d="M 450 309 L 463 317 L 450 325" stroke="#718f80" stroke-width="5" fill="none"/><rect x="475" y="273" width="650" height="90" rx="12" fill="#e6efe7"/><text x="510" y="310" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e4e3c">2  Government appointments</text><text x="510" y="340" font-family="sans-serif" font-size="18" fill="#3f5b4d">Cabinet and presidential staff</text><path d="M 305 253 L 415 431 L 462 431" stroke="#718f80" stroke-width="5" fill="none"/><path d="M 450 423 L 463 431 L 450 439" stroke="#718f80" stroke-width="5" fill="none"/><rect x="475" y="387" width="650" height="90" rx="12" fill="#edf3ee"/><text x="510" y="424" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e4e3c">3  Agencies and contracts</text><text x="510" y="454" font-family="sans-serif" font-size="18" fill="#3f5b4d">Agency leadership and public contracts</text><text x="60" y="477" font-size="16" font-family="sans-serif" fill="#587060">Past appointments are documented; any allegation of favoritism requires separate evidence.</text></svg>