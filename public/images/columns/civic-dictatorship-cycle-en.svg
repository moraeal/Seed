<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The cycle of civic authoritarianism</title>
  <desc id="desc">A cycle from capturing civil society institutions through monopolizing moral language, coordinated targeting, institutional sanctions and legal entrenchment</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#bd8d3b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#102c26" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#f7f4ec"/>
  <text x="600" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="800" fill="#112f3b">How civic authoritarianism reproduces power</text>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#596862">Five steps from democratic persuasion to monopoly, expulsion and state coercion</text>
  <g fill="none" stroke="#bd8d3b" stroke-width="4" marker-end="url(#arrow)">
    <path d="M376 254 C455 179 745 179 824 254"/><path d="M929 335 C1000 390 968 526 889 558"/><path d="M779 612 C685 677 515 677 421 612"/><path d="M311 558 C232 526 200 390 271 335"/><path d="M305 244 C383 132 817 132 895 244" stroke-dasharray="8 10" opacity=".35"/>
  </g>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g><rect x="165" y="210" width="270" height="130" rx="14" fill="#153f36"/><text x="300" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#dfbd6d">01 CAPTURE POSITIONS</text><text x="300" y="289" text-anchor="middle" font-size="22" font-weight="800" fill="white">Media · education · NGOs</text><text x="300" y="318" text-anchor="middle" font-size="15" fill="#dce7e2">Build aligned networks</text></g>
    <g><rect x="765" y="210" width="270" height="130" rx="14" fill="#153f36"/><text x="900" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#dfbd6d">02 FRAME MORALITY</text><text x="900" y="289" text-anchor="middle" font-size="22" font-weight="800" fill="white">Monopolize civic virtue</text><text x="900" y="318" text-anchor="middle" font-size="15" fill="#dce7e2">Turn politics into moral status</text></g>
    <g><rect x="815" y="485" width="270" height="130" rx="14" fill="#812f31"/><text x="950" y="530" text-anchor="middle" font-size="17" font-weight="700" fill="#f0c97b">03 TARGET</text><text x="950" y="564" text-anchor="middle" font-size="22" font-weight="800" fill="white">Coordinate · stigmatize</text><text x="950" y="593" text-anchor="middle" font-size="15" fill="#f4dddd">Replace rebuttal with exclusion</text></g>
    <g><rect x="115" y="485" width="270" height="130" rx="14" fill="#812f31"/><text x="250" y="530" text-anchor="middle" font-size="17" font-weight="700" fill="#f0c97b">04 SANCTION</text><text x="250" y="564" text-anchor="middle" font-size="22" font-weight="800" fill="white">Institutional punishment</text><text x="250" y="593" text-anchor="middle" font-size="15" fill="#f4dddd">Convert verdict into coercion</text></g>
    <g><circle cx="600" cy="447" r="137" fill="#fff" stroke="#bd8d3b" stroke-width="4"/><text x="600" y="407" text-anchor="middle" font-size="17" font-weight="700" fill="#996d26">05 ENTRENCH</text><text x="600" y="449" text-anchor="middle" font-size="26" font-weight="900" fill="#112f3b">Committees · funds · law</text><text x="600" y="483" text-anchor="middle" font-size="16" fill="#596862">Reproduce power with state resources</text></g>
  </g>
  <rect x="145" y="690" width="910" height="42" rx="21" fill="#e8dfc9"/>
  <text x="600" y="718" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#153f36">Audit: representation · finance · appointments · reply rights · conflicts · links to state coercion</text>
</svg>
