<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="680" viewBox="0 0 1260 680"><rect width="1260" height="680" fill="#fff"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#183448"><text x="60" y="77" font-size="34" font-weight="700">기능을 나누는 것과 권력을 제한하는 것은 다릅니다</text><text x="60" y="145" font-size="25" font-weight="700">기능 분리</text><rect x="60" y="175" width="550" height="100" fill="#edf3f4"/><text x="335" y="236" text-anchor="middle" font-size="30" font-weight="600">수사기관</text><rect x="650" y="175" width="550" height="100" fill="#edf3f4"/><text x="925" y="236" text-anchor="middle" font-size="30" font-weight="600">기소기관</text><text x="60" y="354" font-size="25" font-weight="700">별도로 검증할 제동장치</text><rect x="60" y="391" width="340" height="115" fill="#e7f0e9"/><text x="230" y="459" text-anchor="middle" font-size="25" font-weight="600">정치적 독립</text><rect x="460" y="391" width="340" height="115" fill="#e7f0e9"/><text x="630" y="459" text-anchor="middle" font-size="25" font-weight="600">상호 견제</text><rect x="860" y="391" width="340" height="115" fill="#e7f0e9"/><text x="1030" y="459" text-anchor="middle" font-size="25" font-weight="600">시민 구제</text><text x="60" y="590" font-size="25">기관의 수보다 실제로 작동하는 견제와 책임을 봅니다</text><text x="60" y="641" font-size="17" fill="#60717a">SEED VOICE · Venice Commission CDL-AD(2010)040</text></g></svg>