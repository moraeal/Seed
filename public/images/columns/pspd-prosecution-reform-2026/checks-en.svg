<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="680" viewBox="0 0 1260 680"><rect width="1260" height="680" fill="#fff"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#183448"><text x="60" y="77" font-size="34" font-weight="700">Separate functions. Test the checks on power.</text><text x="60" y="145" font-size="25" font-weight="700">Allocation of functions</text><rect x="60" y="175" width="550" height="100" fill="#edf3f4"/><text x="335" y="236" text-anchor="middle" font-size="30" font-weight="600">Investigative agency</text><rect x="650" y="175" width="550" height="100" fill="#edf3f4"/><text x="925" y="236" text-anchor="middle" font-size="30" font-weight="600">Prosecution agency</text><text x="60" y="354" font-size="25" font-weight="700">Safeguards requiring separate tests</text><rect x="60" y="391" width="340" height="115" fill="#e7f0e9"/><text x="230" y="459" text-anchor="middle" font-size="25" font-weight="600">Political independence</text><rect x="460" y="391" width="340" height="115" fill="#e7f0e9"/><text x="630" y="459" text-anchor="middle" font-size="25" font-weight="600">Mutual checks</text><rect x="860" y="391" width="340" height="115" fill="#e7f0e9"/><text x="1030" y="459" text-anchor="middle" font-size="25" font-weight="600">Citizens’ remedies</text><text x="60" y="590" font-size="25">More agencies do not automatically mean stronger safeguards.</text><text x="60" y="641" font-size="17" fill="#60717a">SEED VOICE · Venice Commission CDL-AD(2010)040</text></g></svg>