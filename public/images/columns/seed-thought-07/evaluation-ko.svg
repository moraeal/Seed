<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" width="780" height="660" role="img" aria-labelledby="title">
  <title id="title">공익사업의 평가표에 넣을 질문</title>
  <rect width="780" height="660" fill="#eaf1e8"/>
  <g font-family="Pretendard, Noto Sans KR, Noto Sans CJK KR, sans-serif">
    <text x="24" y="65" font-size="45" font-weight="700" fill="#17392f">공익사업의 평가표에 넣을 질문</text>
    <g transform="translate(24 95)">
      <rect width="732" height="120" rx="10" fill="#fffdf9"/>
      <circle cx="44" cy="39" r="21" fill="#235745"/>
      <text x="44" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">1</text>
      <text x="82" y="50" font-size="35" font-weight="700" fill="#235745">문제 설정</text>
      <text x="82" y="96" font-size="34" font-weight="500" fill="#17392f">누구의 사정을 들었나?</text>
    </g>
    <g transform="translate(24 235)">
      <rect width="732" height="120" rx="10" fill="#fffdf9"/>
      <circle cx="44" cy="39" r="21" fill="#235745"/>
      <text x="44" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">2</text>
      <text x="82" y="50" font-size="35" font-weight="700" fill="#235745">공모·위탁</text>
      <text x="82" y="96" font-size="34" font-weight="500" fill="#17392f">현장 의견으로 계획을 바꿀 수 있나?</text>
    </g>
    <g transform="translate(24 375)">
      <rect width="732" height="120" rx="10" fill="#fffdf9"/>
      <circle cx="44" cy="39" r="21" fill="#235745"/>
      <text x="44" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">3</text>
      <text x="82" y="50" font-size="35" font-weight="700" fill="#235745">성과 평가</text>
      <text x="82" y="96" font-size="34" font-weight="500" fill="#17392f">이용하지 못한 사람도 살폈나?</text>
    </g>
    <g transform="translate(24 515)">
      <rect width="732" height="120" rx="10" fill="#fffdf9"/>
      <circle cx="44" cy="39" r="21" fill="#235745"/>
      <text x="44" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">4</text>
      <text x="82" y="50" font-size="35" font-weight="700" fill="#235745">다음 해 예산</text>
      <text x="82" y="96" font-size="34" font-weight="500" fill="#17392f">무엇을 고쳤고 어디에 반영했나?</text>
    </g>
  </g>
</svg>
