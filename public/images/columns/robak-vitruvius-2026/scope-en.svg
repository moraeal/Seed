<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890"><rect width="1400" height="890" fill="#faf9f4"/><g font-family="Noto Sans CJK KR, DejaVu Sans, sans-serif"><text x="64" y="67" fill="#487465" font-size="20" font-weight="700">ROBAK READS CONSTRUCTION · AUTHOR’S PROPOSALS</text><text x="64" y="132" fill="#233b37" font-size="37" font-weight="700">Three questions to widen reconstruction’s “everyone”</text><text x="64" y="181" fill="#64716e" font-size="25" font-weight="500">Durability · convenience · beauty, with people and time included</text><rect x="64" y="230" width="1272" height="156" fill="white"/><text x="88" y="284" fill="#769b88" font-size="32" font-weight="700">01</text><text x="166" y="285" fill="#233b37" font-size="28" font-weight="700">Who can return?</text><text x="166" y="332" fill="#39715a" font-size="24" font-weight="700">Disclose resettlement</text><text x="677" y="291" fill="#233b37" font-size="23" font-weight="500">Compare expected and actual return rates,</text><text x="677" y="335" fill="#233b37" font-size="23" font-weight="500">alongside options such as smaller homes.</text><rect x="64" y="408" width="1272" height="156" fill="white"/><text x="88" y="462" fill="#769b88" font-size="32" font-weight="700">02</text><text x="166" y="463" fill="#233b37" font-size="28" font-weight="700">Who is left out?</text><text x="166" y="510" fill="#39715a" font-size="24" font-weight="700">Plan relocation</text><text x="677" y="469" fill="#233b37" font-size="23" font-weight="500">Include tenants and shopkeepers,</text><text x="677" y="513" fill="#233b37" font-size="23" font-weight="500">and consider effects on neighbours.</text><rect x="64" y="586" width="1272" height="156" fill="white"/><text x="88" y="640" fill="#769b88" font-size="32" font-weight="700">03</text><text x="166" y="641" fill="#233b37" font-size="28" font-weight="700">Can it last longer?</text><text x="166" y="688" fill="#39715a" font-size="24" font-weight="700">Compare repair</text><text x="677" y="647" fill="#233b37" font-size="23" font-weight="500">Set repair costs and remaining useful life</text><text x="677" y="691" fill="#233b37" font-size="23" font-weight="500">beside the reconstruction assessment.</text><text x="64" y="825" fill="#64716e" font-size="22" font-weight="500">These are the author’s proposals, not a list of existing legal obligations.</text></g></svg>