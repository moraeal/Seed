<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890"><rect width="1400" height="890" fill="#faf9f4"/><g font-family="Noto Sans CJK KR, DejaVu Sans, sans-serif"><text x="64" y="67" fill="#487465" font-size="20" font-weight="700">노박의 건설읽기 · 필자의 제안</text><text x="64" y="132" fill="#233b37" font-size="40" font-weight="700">재건축의 ‘모두’를 넓히는 세 가지 질문</text><text x="64" y="181" fill="#64716e" font-size="25" font-weight="500">튼튼함 · 쓸모 · 아름다움에, 사람과 시간을 더하다</text><rect x="64" y="230" width="1272" height="156" fill="white"/><text x="88" y="284" fill="#769b88" font-size="32" font-weight="700">01</text><text x="166" y="285" fill="#233b37" font-size="31" font-weight="700">돌아올 수 있는가</text><text x="166" y="332" fill="#39715a" font-size="24" font-weight="700">재정착률 공개</text><text x="677" y="291" fill="#233b37" font-size="25" font-weight="500">예상과 실제 재정착률을 공개하고</text><text x="677" y="335" fill="#233b37" font-size="25" font-weight="500">작은 평형 등 선택지를 함께 비교</text><rect x="64" y="408" width="1272" height="156" fill="white"/><text x="88" y="462" fill="#769b88" font-size="32" font-weight="700">02</text><text x="166" y="463" fill="#233b37" font-size="31" font-weight="700">누가 셈에서 빠지는가</text><text x="166" y="510" fill="#39715a" font-size="24" font-weight="700">세입자·상인 대책</text><text x="677" y="469" fill="#233b37" font-size="25" font-weight="500">거주와 영업의 이전 대책을 마련하고</text><text x="677" y="513" fill="#233b37" font-size="25" font-weight="500">주변 이웃의 생활 변화도 살피기</text><rect x="64" y="586" width="1272" height="156" fill="white"/><text x="88" y="640" fill="#769b88" font-size="32" font-weight="700">03</text><text x="166" y="641" fill="#233b37" font-size="31" font-weight="700">더 쓸 수 있는가</text><text x="166" y="688" fill="#39715a" font-size="24" font-weight="700">철거와 보수 비교</text><text x="677" y="647" fill="#233b37" font-size="25" font-weight="500">재건축진단에 보수·리모델링 비용과</text><text x="677" y="691" fill="#233b37" font-size="25" font-weight="500">수리 뒤 남는 사용기간을 나란히 제시</text><text x="64" y="825" fill="#64716e" font-size="22" font-weight="500">현행 의무의 목록이 아니라, 사업 평가에 더하자는 필자의 제안이다.</text></g></svg>