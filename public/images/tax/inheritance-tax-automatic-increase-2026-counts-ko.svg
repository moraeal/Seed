<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="과표 10억원 이하 상속세 부과 결정 대상"><rect width="1400" height="820" fill="#f9faf6"/><g font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif" fill="#203c32"><text x="80" y="100" font-size="40" font-weight="700">과표 10억원 이하 상속세 부과 결정 대상</text><text x="80" y="155" font-size="26" fill="#61736b">부과 결정 대상 피상속인 수 · 과세표준은 공제 후 금액</text><text x="80" y="300" font-size="32">2007</text><rect x="210" y="255" width="104" height="70" fill="#9eb4a7"/><text x="340" y="301" font-size="36" font-weight="700">1,971</text><text x="80" y="450" font-size="32">2025</text><rect x="210" y="405" width="910" height="70" fill="#285b43"/><text x="1140" y="451" font-size="36" font-weight="700">17,294</text><line x1="210" y1="230" x2="210" y2="495" stroke="#acb8ae" stroke-width="2"/><text x="80" y="610" font-size="58" font-weight="700">약 8.8배</text><text x="80" y="665" font-size="29">2025년 전체 부과 결정 대상의 76.8%</text><text x="80" y="753" font-size="22" fill="#61736b">자료: 자유기업원 홈페이지 수록 세정일보 보도 · 배수: 씨앗 계산</text></g></svg>