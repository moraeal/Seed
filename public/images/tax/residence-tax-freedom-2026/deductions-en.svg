<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Single-household, single-home holding-tax deductions</title><desc id="desc">Current law: KRW 1.2 billion for both groups. Initial proposal: 1.4 and 0.9 billion. Submitted bill: 1.4 and 1.2 billion. Party request: 1.4 billion for both. Proposals are not enacted law.</desc>
<rect width="1200" height="790" fill="#fffdf7"/>
<g font-family="Pretendard, Noto Sans, Arial, sans-serif" fill="#17382f">
<text x="54" y="58" font-size="23" font-weight="500" letter-spacing="2">SEED VOICE · TAX WATCH</text>
<text x="54" y="119" font-size="39" font-weight="700">One home: deductions by owner occupancy</text>
<text x="54" y="164" font-size="25" fill="#59675f">Amounts subtracted from assessed value—not tax bills.</text>
<rect x="44" y="202" width="1112" height="74" fill="#173f34"/>
<g fill="#fff" font-size="26" font-weight="700"><text x="70" y="251">Stage</text><text x="672" y="251" text-anchor="middle">Owner-occupied</text><text x="999" y="251" text-anchor="middle">Owner lives elsewhere</text></g>
<rect x="44" y="276" width="1112" height="81" fill="#f0f3eb"/>
<rect x="44" y="438" width="1112" height="81" fill="#e0eee4"/>
