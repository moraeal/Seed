<g font-size="27" font-weight="500"><text x="70" y="328">Current law</text><text x="70" y="409">Initial August proposal</text><text x="70" y="490" font-weight="700">Submitted government bill</text><text x="70" y="571">Party request: November 8</text></g>
<g font-size="32" text-anchor="middle" font-weight="700"><text x="672" y="328">KRW 1.2bn</text><text x="999" y="328">KRW 1.2bn</text><text x="672" y="409">KRW 1.4bn</text><text x="999" y="409">KRW 0.9bn</text><text x="672" y="490">KRW 1.4bn</text><text x="999" y="490">KRW 1.2bn</text><text x="672" y="571">KRW 1.4bn</text><text x="999" y="571">KRW 1.4bn</text></g>
<g font-size="24" fill="#536257"><text x="54" y="645">Only the current-law row is enacted. The taxpayer threshold is separate.</text><text x="54" y="687">Joint ownership and special cases have different eligibility conditions.</text><text x="54" y="747" font-size="21">Sources: current Act, Art. 8; reporting on revisions and party request | Nov. 9, 2026</text></g>
