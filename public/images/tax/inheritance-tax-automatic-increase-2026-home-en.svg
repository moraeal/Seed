<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="Illustration: inheriting one home"><rect width="1400" height="760" fill="#fafbf6"/><g font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif" fill="#244235"><text x="75" y="100" font-size="42" font-weight="700">Illustration: inheriting one home</text><text x="75" y="160" font-size="28">The home's value and cash for tax are separate.</text><rect x="75" y="225" width="395" height="235" fill="#e5eee7"/><text x="100" y="285" font-size="29" font-weight="500">Home value</text><text x="100" y="375" font-size="43" font-weight="700">KRW 1.2bn</text><rect x="510" y="225" width="395" height="235" fill="#edf0e9"/><text x="535" y="285" font-size="29" font-weight="500">Amount deducted</text><text x="535" y="375" font-size="43" font-weight="700">KRW 500m</text><rect x="945" y="225" width="395" height="235" fill="#d6e7da"/><text x="970" y="285" font-size="29" font-weight="500">Cash for tax</text><text x="970" y="375" font-size="43" font-weight="700">KRW 150m</text><text x="75" y="555" font-size="36" font-weight="700">Keeping the home also means finding cash for the tax.</text><text x="75" y="655" font-size="24" fill="#65776c">Hypothetical: two children inherit one home; no surviving spouse.</text><text x="75" y="697" font-size="24" fill="#65776c">No debts or other assets. Funeral deductions and filing credit omitted.</text></g></svg>