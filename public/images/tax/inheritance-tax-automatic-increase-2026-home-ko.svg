<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="집 한 채를 받았을 때의 세금 예시"><rect width="1400" height="760" fill="#fafbf6"/><g font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif" fill="#244235"><text x="75" y="100" font-size="42" font-weight="700">집 한 채를 받았을 때의 세금 예시</text><text x="75" y="160" font-size="28">집의 가치와 세금을 낼 현금은 따로입니다.</text><rect x="75" y="225" width="395" height="235" fill="#e5eee7"/><text x="100" y="285" font-size="29" font-weight="500">집값</text><text x="100" y="375" font-size="43" font-weight="700">12억원</text><rect x="510" y="225" width="395" height="235" fill="#edf0e9"/><text x="535" y="285" font-size="29" font-weight="500">빼주는 금액</text><text x="535" y="375" font-size="43" font-weight="700">5억원</text><rect x="945" y="225" width="395" height="235" fill="#d6e7da"/><text x="970" y="285" font-size="29" font-weight="500">세금 낼 현금</text><text x="970" y="375" font-size="43" font-weight="700">1억5000만원</text><text x="75" y="555" font-size="36" font-weight="700">집을 지키려면, 세금을 낼 돈도 필요합니다.</text><text x="75" y="655" font-size="24" fill="#65776c">배우자 없이 자녀 둘에게 집 한 채 상속하는 가상 사례</text><text x="75" y="697" font-size="24" fill="#65776c">빚·다른 재산 없음. 장례비·신고세액공제 등 생략.</text></g></svg>