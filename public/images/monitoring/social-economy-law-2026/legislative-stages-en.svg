<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#faf8f1"/><g font-family="Noto Sans KR, NanumGothic, sans-serif"><text x="90" y="105" font-size="54" font-weight="700" fill="#173d35">Twelve years across four National Assemblies</text><text x="90" y="160" font-size="27" fill="#56675f">Introductions, term-end lapses and incorporation are distinct</text><rect x="90" y="210" width="690" height="235" fill="#fff"/><text x="120" y="255" font-size="33" font-weight="700" fill="#173d35">19th Assembly</text><text x="120" y="295" font-size="26" font-weight="500" fill="#173d35">2014–2016</text><text x="120" y="355" font-size="31" font-weight="500" fill="#173d35">3 original proposals</text><text x="120" y="407" font-size="28" font-weight="700" fill="#173d35">Lapsed at term end</text><rect x="820" y="210" width="690" height="235" fill="#fff"/><text x="850" y="255" font-size="33" font-weight="700" fill="#173d35">20th Assembly</text><text x="850" y="295" font-size="26" font-weight="500" fill="#173d35">2016–2020</text><text x="850" y="355" font-size="31" font-weight="500" fill="#173d35">3 original proposals</text><text x="850" y="407" font-size="28" font-weight="700" fill="#173d35">Lapsed at term end</text><rect x="90" y="480" width="690" height="235" fill="#fff"/><text x="120" y="525" font-size="33" font-weight="700" fill="#173d35">21st Assembly</text><text x="120" y="565" font-size="26" font-weight="500" fill="#173d35">2020–2024</text><text x="120" y="625" font-size="31" font-weight="500" fill="#173d35">5 original proposals</text><text x="120" y="677" font-size="28" font-weight="700" fill="#173d35">Lapsed at term end</text><rect x="820" y="480" width="690" height="235" fill="#173d35"/><text x="850" y="525" font-size="33" font-weight="700" fill="#fff">22nd Assembly</text><text x="850" y="565" font-size="26" font-weight="500" fill="#fff">2024–present</text><text x="850" y="625" font-size="31" font-weight="500" fill="#fff">9 originals → committee substitute</text><text x="850" y="677" font-size="28" font-weight="700" fill="#fff">Passed plenary: Aug. 20, 2026</text><text x="90" y="815" font-size="31" font-weight="500" fill="#173d35">Promulgated Sept. 15, 2026 → General commencement Mar. 16, 2027</text><text x="90" y="873" font-size="31" font-weight="500" fill="#173d35">Disclosures and platform (Arts. 26–27): commencement Sept. 16, 2029</text><text x="90" y="931" font-size="23" font-weight="500" fill="#173d35">Sources: Assembly bill lists and official statute | Checked Nov. 1, 2026</text></g></svg>