<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Content-industry support structure</title>
  <desc id="desc">Bill structure flowing from a special account and policy committee to cash rebates, tax and finance preferences, investment funds, and levy relief</desc>
  <rect width="1600" height="900" fill="#0d2433"/>
  <path d="M0 760 C300 650 480 830 790 710 C1050 610 1270 760 1600 610 L1600 900 L0 900Z" fill="#123f36" opacity=".72"/>
  <text x="110" y="115" fill="#d3aa55" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="5">TAX &amp; LEVY WATCH</text>
  <text x="110" y="184" fill="#ffffff" font-family="Georgia, serif" font-size="50" font-weight="700">Four channels of fiscal support</text>
  <text x="110" y="231" fill="#dce7e2" font-family="Inter, Arial, sans-serif" font-size="24">Introduced Sep. 18, 2026 · A proposal, not enacted law</text>

  <rect x="110" y="300" width="420" height="230" rx="24" fill="#f6f1e7"/>
  <text x="320" y="355" text-anchor="middle" fill="#163f36" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">FUNDING &amp; DECISIONS</text>
  <text x="320" y="420" text-anchor="middle" fill="#0d2433" font-family="Georgia, serif" font-size="30" font-weight="700">Content strategy</text>
  <text x="320" y="464" text-anchor="middle" fill="#0d2433" font-family="Georgia, serif" font-size="30" font-weight="700">special account</text>
  <text x="320" y="505" text-anchor="middle" fill="#5d6965" font-family="Inter, Arial, sans-serif" font-size="18">Committee reviews plans and allocations</text>

  <path d="M555 414 H654" stroke="#d3aa55" stroke-width="10" stroke-linecap="round"/>
  <path d="M642 394 L672 414 L642 434" fill="none" stroke="#d3aa55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="710" y="286" width="350" height="140" rx="20" fill="#ffffff"/>
    <text x="750" y="333" fill="#d3aa55" font-size="22" font-weight="900">01</text>
    <text x="750" y="376" fill="#0d2433" font-size="27" font-weight="800">Production rebates</text>
    <text x="750" y="405" fill="#66716d" font-size="16">No rate or cap in the summary</text>

    <rect x="1090" y="286" width="400" height="140" rx="20" fill="#ffffff"/>
    <text x="1130" y="333" fill="#d3aa55" font-size="22" font-weight="900">02</text>
    <text x="1130" y="376" fill="#0d2433" font-size="21" font-weight="800">Tax &amp; finance preference</text>
    <text x="1130" y="405" fill="#66716d" font-size="16">Linked to IP and contract terms</text>

    <rect x="710" y="458" width="350" height="140" rx="20" fill="#ffffff"/>
    <text x="750" y="505" fill="#d3aa55" font-size="22" font-weight="900">03</text>
    <text x="750" y="548" fill="#0d2433" font-size="21" font-weight="800">IP &amp; co-production funds</text>
    <text x="750" y="577" fill="#66716d" font-size="16">Dedicated investment vehicles</text>

    <rect x="1090" y="458" width="400" height="140" rx="20" fill="#ffffff"/>
    <text x="1130" y="505" fill="#d3aa55" font-size="22" font-weight="900">04</text>
    <text x="1130" y="548" fill="#0d2433" font-size="22" font-weight="800">Regional-media levy relief</text>
    <text x="1130" y="577" fill="#66716d" font-size="16">OTT cooperation incentives included</text>
  </g>

  <rect x="110" y="665" width="1380" height="112" rx="18" fill="#d3aa55"/>
  <text x="150" y="714" fill="#0d2433" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">The public-accountability question</text>
  <text x="150" y="753" fill="#0d2433" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Cash spending + forgone tax + levy relief = what annual total?</text>
  <text x="1490" y="838" text-anchor="end" fill="#dce7e2" font-family="Inter, Arial, sans-serif" font-size="18">Seed Voice reconstruction from National Assembly bills 2221473 and 2221472</text>
</svg>
