<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">농어업 세금특례 일몰을 2030년으로 맞추는 법안</title>
  <desc id="desc">2026년과 2028년으로 흩어진 국세와 지방세 특례 일몰을 2030년 말로 맞추는 변화와 공개되지 않은 비용을 설명한다.</desc>
  <rect width="1200" height="675" fill="#F4F1E8"/>
  <rect x="40" y="35" width="1120" height="605" rx="28" fill="#FFFDF8" stroke="#D8D1C0" stroke-width="2"/>
  <text x="82" y="92" font-family="Noto Sans KR Thin, sans-serif" font-size="18" font-weight="700" fill="#8D3B2E" letter-spacing="1.5">오늘의 세금정책 · 법안 발의</text>
  <text x="82" y="141" font-family="Noto Sans KR Thin, sans-serif" font-size="36" font-weight="800" fill="#17251E">흩어진 농어업 세금특례 일몰을 2030년으로</text>
  <text x="82" y="178" font-family="Noto Sans KR Thin, sans-serif" font-size="20" fill="#526159">국세와 지방세의 여러 기한을 한 날짜로 맞추자는 두 법안입니다.</text>

  <rect x="82" y="218" width="450" height="254" rx="22" fill="#F3E9D1"/>
  <text x="114" y="259" font-family="Noto Sans KR Thin, sans-serif" font-size="20" font-weight="800" fill="#7A5B22">현행 · 여러 일몰</text>
  <line x1="144" y1="315" x2="469" y2="315" stroke="#B4934E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="197" cy="315" r="17" fill="#FFFDF8" stroke="#B4934E" stroke-width="5"/>
  <circle cx="399" cy="315" r="17" fill="#FFFDF8" stroke="#B4934E" stroke-width="5"/>
  <text x="197" y="365" text-anchor="middle" font-family="Noto Sans KR Thin, sans-serif" font-size="25" font-weight="800" fill="#17251E">2026</text>
  <text x="399" y="365" text-anchor="middle" font-family="Noto Sans KR Thin, sans-serif" font-size="25" font-weight="800" fill="#17251E">2028</text>
  <text x="114" y="410" font-family="Noto Sans KR Thin, sans-serif" font-size="18" fill="#3E4B45">국세·지방세 특례별로</text>
  <text x="114" y="439" font-family="Noto Sans KR Thin, sans-serif" font-size="18" fill="#3E4B45">서로 다른 시점에 심사</text>

  <path d="M554 338 H628" stroke="#8D3B2E" stroke-width="6" stroke-linecap="round"/>
  <path d="M611 321 L632 338 L611 355" fill="none" stroke="#8D3B2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="654" y="218" width="464" height="254" rx="22" fill="#E2F0E8"/>
  <text x="686" y="259" font-family="Noto Sans KR Thin, sans-serif" font-size="20" font-weight="800" fill="#236344">개정안 · 한 날짜</text>
  <line x1="716" y1="315" x2="1056" y2="315" stroke="#2E8058" stroke-width="5" stroke-linecap="round"/>
  <circle cx="984" cy="315" r="22" fill="#FFFDF8" stroke="#2E8058" stroke-width="6"/>
  <text x="984" y="371" text-anchor="middle" font-family="Noto Sans KR Thin, sans-serif" font-size="28" font-weight="800" fill="#17251E">2030</text>
  <text x="686" y="410" font-family="Noto Sans KR Thin, sans-serif" font-size="18" fill="#3E4B45">주요 특례를 2030년 12월 31일로</text>
  <text x="686" y="439" font-family="Noto Sans KR Thin, sans-serif" font-size="18" fill="#3E4B45">맞춰 한 시점에 종합 심사</text>

  <rect x="82" y="505" width="1036" height="85" rx="18" fill="#F9E7E1"/>
  <text x="112" y="541" font-family="Noto Sans KR Thin, sans-serif" font-size="18" font-weight="800" fill="#9E3D30">확인할 빈칸</text>
  <text x="250" y="541" font-family="Noto Sans KR Thin, sans-serif" font-size="18" fill="#17251E">특례별 수혜자 수 · 국세와 지방세를 합친 연간 세수 감소액</text>
  <text x="112" y="570" font-family="Noto Sans KR Thin, sans-serif" font-size="16" fill="#6B514C">공식 제안 설명에는 두 수치가 제시되지 않았습니다.</text>
  <text x="1118" y="615" text-anchor="end" font-family="Noto Sans KR Thin, sans-serif" font-size="16" font-weight="700" fill="#8D3B2E">씨앗의 소리 · 세금감시</text>
</svg>
