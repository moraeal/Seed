<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Bills align farm and fishery tax-break sunsets to 2030</title>
  <desc id="desc">A diagram showing national and local tax preferences with 2026 and 2028 sunsets moving to one date at the end of 2030, while combined costs remain undisclosed.</desc>
  <rect width="1200" height="675" fill="#F4F1E8"/>
  <rect x="40" y="35" width="1120" height="605" rx="28" fill="#FFFDF8" stroke="#D8D1C0" stroke-width="2"/>
  <text x="82" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8D3B2E" letter-spacing="1.5">TODAY'S TAX POLICY · BILLS INTRODUCED</text>
  <text x="82" y="141" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#17251E">Farm and fishery tax-break sunsets move to 2030</text>
  <text x="82" y="178" font-family="Arial, sans-serif" font-size="20" fill="#526159">Two bills would align multiple national and local deadlines to one date.</text>

  <rect x="82" y="218" width="450" height="254" rx="22" fill="#F3E9D1"/>
  <text x="114" y="259" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#7A5B22">CURRENT · MULTIPLE SUNSETS</text>
  <line x1="144" y1="315" x2="469" y2="315" stroke="#B4934E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="197" cy="315" r="17" fill="#FFFDF8" stroke="#B4934E" stroke-width="5"/>
  <circle cx="399" cy="315" r="17" fill="#FFFDF8" stroke="#B4934E" stroke-width="5"/>
  <text x="197" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#17251E">2026</text>
  <text x="399" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#17251E">2028</text>
  <text x="114" y="410" font-family="Arial, sans-serif" font-size="18" fill="#3E4B45">Separate reviews for different</text>
  <text x="114" y="439" font-family="Arial, sans-serif" font-size="18" fill="#3E4B45">national and local preferences</text>

  <path d="M554 338 H628" stroke="#8D3B2E" stroke-width="6" stroke-linecap="round"/>
  <path d="M611 321 L632 338 L611 355" fill="none" stroke="#8D3B2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="654" y="218" width="464" height="254" rx="22" fill="#E2F0E8"/>
  <text x="686" y="259" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#236344">BILLS · ONE DATE</text>
  <line x1="716" y1="315" x2="1056" y2="315" stroke="#2E8058" stroke-width="5" stroke-linecap="round"/>
  <circle cx="984" cy="315" r="22" fill="#FFFDF8" stroke="#2E8058" stroke-width="6"/>
  <text x="984" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#17251E">2030</text>
  <text x="686" y="410" font-family="Arial, sans-serif" font-size="18" fill="#3E4B45">Major preferences aligned to</text>
  <text x="686" y="439" font-family="Arial, sans-serif" font-size="18" fill="#3E4B45">December 31 for one review point</text>

  <rect x="82" y="505" width="1036" height="85" rx="18" fill="#F9E7E1"/>
  <text x="112" y="541" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#9E3D30">MISSING</text>
  <text x="225" y="541" font-family="Arial, sans-serif" font-size="18" fill="#17251E">Recipients by preference · Combined annual national-local revenue loss</text>
  <text x="112" y="570" font-family="Arial, sans-serif" font-size="16" fill="#6B514C">Neither figure appears in the official proposal summaries.</text>
  <text x="1118" y="615" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8D3B2E">SEED VOICE · TAX WATCH</text>
</svg>
