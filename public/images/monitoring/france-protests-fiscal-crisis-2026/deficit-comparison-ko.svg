<text x="70" y="122" font-family="Arial, Noto Sans KR, sans-serif" fill="#56696a" font-size="21">GDP 대비 비율 · 2026년 예상치와 2027년 정부 목표 비교</text>
<line x1="70" y1="174" x2="1130" y2="174" stroke="#bec8c0" stroke-width="2"/>
<text x="70" y="232" font-family="Arial, Noto Sans KR, sans-serif" fill="#172e35" font-size="27" font-weight="700">2026년 예상</text>
