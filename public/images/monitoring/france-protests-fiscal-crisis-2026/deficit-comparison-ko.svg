<text x="839" y="484" font-family="Arial, Noto Sans KR, sans-serif" fill="#a76314" font-size="57" font-weight="700">5.0%</text>
<text x="70" y="564" font-family="Arial, Noto Sans KR, sans-serif" fill="#38514f" font-size="20">유의: 확정 결산이 아닌 정부 추계 및 2027년 예산안 목표</text>
<text x="70" y="596" font-family="Arial, Noto Sans KR, sans-serif" fill="#607070" font-size="17">출처: Reuters (2026.10.14), 프랑스 국채청</text>
