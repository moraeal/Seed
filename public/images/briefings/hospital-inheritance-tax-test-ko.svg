<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">씨앗이 제안하는 네 단계 판단 기준</title>
  <desc id="desc">부동산 이익 과세, 필수의료 확인, 조건부 유예, 폐업 시 추징의 네 단계</desc>
  <rect width="1200" height="675" fill="#f7f3e8"/>
  <text x="70" y="82" fill="#123b32" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="3">SEED POLICY TEST</text>
  <text x="70" y="132" fill="#102b3a" font-family="sans-serif" font-size="40" font-weight="800">혜택은 가족이 아니라 기능을 따라야 합니다</text>
  <text x="70" y="172" fill="#52615d" font-family="sans-serif" font-size="21">부동산 편법은 막고, 시민이 이용할 필수의료는 조건부로 지키는 네 단계 기준</text>
  <g font-family="sans-serif">
    <g transform="translate(70 225)"><rect width="245" height="300" rx="18" fill="#ffffff" stroke="#d7ddd7"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">1</text><text x="28" y="102" fill="#102b3a" font-size="26" font-weight="800">토지 이익 과세</text><text x="28" y="148" fill="#52615d" font-size="18"><tspan x="28" dy="0">의료성과와 무관한</tspan><tspan x="28" dy="30">땅값 상승분은</tspan><tspan x="28" dy="30">일반 기준으로 과세</tspan></text></g>
    <g transform="translate(340 225)"><rect width="245" height="300" rx="18" fill="#ffffff" stroke="#d7ddd7"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">2</text><text x="28" y="102" fill="#102b3a" font-size="26" font-weight="800">필수기능 확인</text><text x="28" y="148" fill="#52615d" font-size="18"><tspan x="28" dy="0">분만·응급·소아 등</tspan><tspan x="28" dy="30">대체하기 어려운</tspan><tspan x="28" dy="30">의료서비스인지 확인</tspan></text></g>
    <g transform="translate(610 225)"><rect width="245" height="300" rx="18" fill="#ffffff" stroke="#d7ddd7"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">3</text><text x="28" y="102" fill="#102b3a" font-size="26" font-weight="800">조건부 유예</text><text x="28" y="148" fill="#52615d" font-size="18"><tspan x="28" dy="0">병상·고용·진료를</tspan><tspan x="28" dy="30">유지하는 동안에만</tspan><tspan x="28" dy="30">세금 납부를 유예</tspan></text></g>
    <g transform="translate(880 225)"><rect width="245" height="300" rx="18" fill="#123b32"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">4</text><text x="28" y="102" fill="#ffffff" font-size="26" font-weight="800">폐업하면 추징</text><text x="28" y="148" fill="#e4eee9" font-size="18"><tspan x="28" dy="0">폐업·매각·용도변경</tspan><tspan x="28" dy="30">때 유예한 세금을</tspan><tspan x="28" dy="30">다시 부과</tspan></text></g>
  </g>
  <rect x="70" y="565" width="1055" height="54" rx="27" fill="#102b3a"/>
  <text x="597" y="600" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700">보호할 것은 의사 집안의 상속이 아니라 시민이 계속 이용할 병원입니다</text>
</svg>
