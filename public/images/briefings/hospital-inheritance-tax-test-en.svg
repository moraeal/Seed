<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SEED's four-step policy test</title>
  <desc id="desc">Tax property gains, verify essential care, defer conditionally, and claw back after closure</desc>
  <rect width="1200" height="675" fill="#f7f3e8"/>
  <text x="70" y="82" fill="#123b32" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="3">SEED POLICY TEST</text>
  <text x="70" y="132" fill="#102b3a" font-family="sans-serif" font-size="38" font-weight="800">Relief should follow the service, not the family</text>
  <text x="70" y="172" fill="#52615d" font-family="sans-serif" font-size="20">Block property-based avoidance while conditionally protecting essential care</text>
  <g font-family="sans-serif">
    <g transform="translate(70 225)"><rect width="245" height="300" rx="18" fill="#ffffff" stroke="#d7ddd7"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">1</text><text x="28" y="102" fill="#102b3a" font-size="24" font-weight="800">Tax land gains</text><text x="28" y="148" fill="#52615d" font-size="18"><tspan x="28" dy="0">Tax appreciation</tspan><tspan x="28" dy="29">unrelated to medical</tspan><tspan x="28" dy="29">performance</tspan></text></g>
    <g transform="translate(340 225)"><rect width="245" height="300" rx="18" fill="#ffffff" stroke="#d7ddd7"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">2</text><text x="28" y="102" fill="#102b3a" font-size="24" font-weight="800">Verify the service</text><text x="28" y="148" fill="#52615d" font-size="18"><tspan x="28" dy="0">Identify maternity,</tspan><tspan x="28" dy="29">emergency, pediatric</tspan><tspan x="28" dy="29">or other essential care</tspan></text></g>
    <g transform="translate(610 225)"><rect width="245" height="300" rx="18" fill="#ffffff" stroke="#d7ddd7"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">3</text><text x="28" y="102" fill="#102b3a" font-size="24" font-weight="800">Defer conditionally</text><text x="28" y="148" fill="#52615d" font-size="18"><tspan x="28" dy="0">Defer payment only</tspan><tspan x="28" dy="29">while care, beds and</tspan><tspan x="28" dy="29">jobs are maintained</tspan></text></g>
    <g transform="translate(880 225)"><rect width="245" height="300" rx="18" fill="#123b32"/><circle cx="42" cy="42" r="23" fill="#d4a72c"/><text x="42" y="50" text-anchor="middle" fill="#102b3a" font-size="22" font-weight="800">4</text><text x="28" y="102" fill="#ffffff" font-size="24" font-weight="800">Claw back relief</text><text x="28" y="148" fill="#e4eee9" font-size="18"><tspan x="28" dy="0">Collect deferred tax</tspan><tspan x="28" dy="29">after closure, sale</tspan><tspan x="28" dy="29">or conversion</tspan></text></g>
  </g>
  <rect x="70" y="565" width="1055" height="54" rx="27" fill="#102b3a"/>
  <text x="597" y="600" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Protect the hospital citizens can use—not a family's inheritance</text>
</svg>
