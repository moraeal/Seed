<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Seojin School and its neighbors">
<rect width="1200" height="760" fill="#f5f4ea"/>
<rect x="24" y="24" width="1152" height="712" rx="22" fill="#fffdf8" stroke="#d3dfd3" stroke-width="2"/>
<text x="80" y="104" font-family="sans-serif" font-size="38" font-weight="bold" fill="#183f34">Seojin School and its neighbors</text>
<text x="80" y="148" font-family="sans-serif" font-size="22" fill="#556b60">From opposition to ordinary acts of care</text>
<line x1="160" y1="208" x2="160" y2="602" stroke="#b9cdbb" stroke-width="5"/>
<circle cx="160" cy="224" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="231" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2013</text>
<text x="214" y="222" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">Proposal</text>
<text x="214" y="254" font-family="sans-serif" font-size="20" fill="#566a60">Seoul education office pursues a special school</text>
<circle cx="160" cy="318" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="325" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2017</text>
<text x="214" y="316" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">Parents plead</text>
<text x="214" y="348" font-family="sans-serif" font-size="20" fill="#566a60">Parents kneel at a public meeting</text>
<circle cx="160" cy="412" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="419" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2020</text>
<text x="214" y="410" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">School opens</text>
<text x="214" y="442" font-family="sans-serif" font-size="20" fill="#566a60">Seojin begins serving students with disabilities</text>
<circle cx="160" cy="506" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="513" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2025</text>
<text x="214" y="504" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">Flood cleanup</text>
<text x="214" y="536" font-family="sans-serif" font-size="20" fill="#566a60">30 residents and 15 community-center staff help</text>
<circle cx="160" cy="600" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="607" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2026</text>
<text x="214" y="598" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">Walking together</text>
<text x="214" y="630" font-family="sans-serif" font-size="20" fill="#566a60">About 20 students and residents collect litter</text>
<text x="80" y="684" font-family="sans-serif" font-size="16" fill="#66776e">Sources: The Chosun Ilbo (Sept. 23, 2026); Yonhap (July 30, 2019)  ·  SEED VOICE</text>
</svg>