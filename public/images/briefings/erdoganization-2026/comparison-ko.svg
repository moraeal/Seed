<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140">
<rect width="1600" height="1140" fill="#f8f6ef"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Pretendard, DejaVu Sans, sans-serif" fill="#16382f">
<text x="60" y="83" font-size="42" font-weight="700">권력 집중, 무엇을 비교하고 감시할까</text>
<text x="60" y="135" font-size="25" font-weight="500" fill="#556660">역사적 사실과 한국의 변화 · 결과의 동일성이 아닌 제도적 위험 비교</text>
<rect x="60" y="176" width="1480" height="66" fill="#173f34"/>
<text x="82" y="220" font-size="28" font-weight="700" fill="#ffffff">쟁점</text>
<text x="340" y="220" font-size="28" font-weight="700" fill="#ffffff">튀르키에의 경험</text>
<text x="918" y="220" font-size="28" font-weight="700" fill="#ffffff">한국에서 확인할 변화</text>
<rect x="60" y="242" width="1480" height="180" fill="#ffffff"/>
<text x="82" y="304" font-size="28" font-weight="700">사법부</text>
<text x="340" y="291" font-size="27" font-weight="500">2016년 쿠데타 실패 뒤</text>
<text x="340" y="334" font-size="27" font-weight="500">판·검사 대규모 해임</text>
<text x="340" y="377" font-size="27" font-weight="500">2017년 개헌, 대통령 권한 확대</text>
<text x="918" y="291" font-size="27" font-weight="500">대법관 14 → 26명 증원 입법</text>
<text x="918" y="334" font-size="27" font-weight="500">대법원장 국정조사·탄핵 요구</text>
<text x="918" y="377" font-size="27" font-weight="500">감시 기준: 인사·판결의 독립성</text>
<rect x="60" y="422" width="1480" height="180" fill="#edf1e9"/>
<text x="82" y="484" font-size="28" font-weight="700">수사·통제</text>
<text x="340" y="471" font-size="27" font-weight="500">비상조치가 경찰·공직사회</text>
<text x="340" y="514" font-size="27" font-weight="500">언론·기업 등으로 확대</text>
<text x="918" y="471" font-size="27" font-weight="500">경찰·중수청: 행안부 소속</text>
<text x="918" y="514" font-size="27" font-weight="500">감시 기준: 권력 수사의 독립성</text>
<text x="918" y="557" font-size="27" font-weight="500">보완수사 요구·영장심사의 실효성</text>
<rect x="60" y="602" width="1480" height="180" fill="#ffffff"/>
<text x="82" y="664" font-size="28" font-weight="700">재정 지원</text>
<text x="340" y="651" font-size="27" font-weight="500">2023년 일부 조기연금 확대</text>
<text x="340" y="694" font-size="27" font-weight="500">IMF 추산 연간 환산 비용</text>
<text x="340" y="737" font-size="27" font-weight="500">GDP 약 1%</text>
<text x="918" y="651" font-size="27" font-weight="500">2025년 소비쿠폰 총예산</text>
<text x="918" y="694" font-size="27" font-weight="500">13조9천억 원</text>
<text x="918" y="737" font-size="27" font-weight="500">감시 기준: 지속 효과·재원 부담</text>
<rect x="60" y="782" width="1480" height="180" fill="#edf1e9"/>
<text x="82" y="844" font-size="28" font-weight="700">경제의 비용</text>
<text x="340" y="831" font-size="27" font-weight="500">2022년 10월 물가상승률</text>
<text x="340" y="874" font-size="27" font-weight="500">전년 동월 대비 약 85%</text>
<text x="918" y="831" font-size="27" font-weight="500">같은 물가위기가 발생했다는</text>
<text x="918" y="874" font-size="27" font-weight="500">주장이 아님</text>
<text x="918" y="917" font-size="27" font-weight="500">감시 기준: 정책 오류의 수정 능력</text>
<rect x="60" y="990" width="1480" height="66" fill="#e5eadd"/>
<text x="80" y="1032" font-size="26" font-weight="700">씨앗의 해석: 견제 약화와 재량 확대가 시민의 자유·생계를 위협할 위험</text>
<text x="60" y="1100" font-size="21" font-weight="500" fill="#5b6962">자료: 영국 하원·EU·베네치아위원회·법제처·연합뉴스·IMF·행정안전부 | 2026.11.02 확인</text>
</g></svg>