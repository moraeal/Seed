<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140">
<rect width="1600" height="1140" fill="#f8f6ef"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Pretendard, DejaVu Sans, sans-serif" fill="#16382f">
<text x="60" y="83" font-size="42" font-weight="700">Concentrated power: what should citizens watch?</text>
<text x="60" y="135" font-size="25" font-weight="500" fill="#556660">Historical facts and Korea’s changes · Institutional risks, not identical outcomes</text>
<rect x="60" y="176" width="1480" height="66" fill="#173f34"/>
<text x="82" y="220" font-size="28" font-weight="700" fill="#ffffff">Issue</text>
<text x="340" y="220" font-size="28" font-weight="700" fill="#ffffff">Türkiye’s experience</text>
<text x="918" y="220" font-size="28" font-weight="700" fill="#ffffff">Changes and tests in Korea</text>
<rect x="60" y="242" width="1480" height="180" fill="#ffffff"/>
<text x="82" y="304" font-size="28" font-weight="700">Judiciary</text>
<text x="340" y="291" font-size="27" font-weight="500">Mass judicial dismissals after</text>
<text x="340" y="334" font-size="27" font-weight="500">the failed 2016 coup</text>
<text x="340" y="377" font-size="27" font-weight="500">2017: wider presidential powers</text>
<text x="918" y="291" font-size="27" font-weight="500">Legislation: 14 → 26 justices</text>
<text x="918" y="334" font-size="27" font-weight="500">Inquiry and impeachment demands</text>
<text x="918" y="377" font-size="27" font-weight="500">Test: independent appointments/rulings</text>
<rect x="60" y="422" width="1480" height="180" fill="#edf1e9"/>
<text x="82" y="484" font-size="28" font-weight="700">Investigation</text>
<text x="340" y="471" font-size="27" font-weight="500">Emergency measures extended</text>
<text x="340" y="514" font-size="27" font-weight="500">to police, public servants,</text>
<text x="340" y="557" font-size="27" font-weight="500">media and businesses</text>
<text x="918" y="471" font-size="27" font-weight="500">Police/new agency: Interior Ministry</text>
<text x="918" y="514" font-size="27" font-weight="500">Test: independent probes of power</text>
<text x="918" y="557" font-size="27" font-weight="500">Effective warrants and case review</text>
<rect x="60" y="602" width="1480" height="180" fill="#ffffff"/>
<text x="82" y="664" font-size="28" font-weight="700">Fiscal support</text>
<text x="340" y="651" font-size="27" font-weight="500">2023: expanded early retirement</text>
<text x="340" y="694" font-size="27" font-weight="500">IMF annualised cost estimate:</text>
<text x="340" y="737" font-size="27" font-weight="500">about 1% of GDP</text>
<text x="918" y="651" font-size="27" font-weight="500">2025 consumption-coupon budget:</text>
<text x="918" y="694" font-size="27" font-weight="500">KRW 13.9 trillion</text>
<text x="918" y="737" font-size="27" font-weight="500">Test: durable effects and funding</text>
<rect x="60" y="782" width="1480" height="180" fill="#edf1e9"/>
<text x="82" y="844" font-size="28" font-weight="700">Economic cost</text>
<text x="340" y="831" font-size="27" font-weight="500">October 2022 annual inflation:</text>
<text x="340" y="874" font-size="27" font-weight="500">about 85%</text>
<text x="918" y="831" font-size="27" font-weight="500">No claim that Korea has</text>
<text x="918" y="874" font-size="27" font-weight="500">the same inflation crisis</text>
<text x="918" y="917" font-size="27" font-weight="500">Test: ability to correct policy errors</text>
<rect x="60" y="990" width="1480" height="66" fill="#e5eadd"/>
<text x="80" y="1032" font-size="26" font-weight="700">SEED’s interpretation: weaker checks can put civic freedom and livelihoods at risk</text>
<text x="60" y="1100" font-size="21" font-weight="500" fill="#5b6962">Sources: UK Parliament, EU, Venice Commission, Korean authorities, Yonhap, IMF | Checked Nov. 2, 2026</text>
</g></svg>