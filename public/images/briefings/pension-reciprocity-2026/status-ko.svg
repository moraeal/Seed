<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#faf9f5"/><g font-family="Noto Sans KR, Arial, sans-serif" fill="#18392f">
