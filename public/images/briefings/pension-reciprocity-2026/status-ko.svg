<text x="80" y="449" font-size="27" font-weight="400" fill="#18392f">10월 1일 통과안: 상호주의 확대 · 해당 조항은 공포 후 즉시 시행</text>
<text x="80" y="486" font-size="27" font-weight="400" fill="#18392f">실제 공포·시행일과 장기 거주·근로·납세 관련 대통령령 예외 확인 필요</text>
