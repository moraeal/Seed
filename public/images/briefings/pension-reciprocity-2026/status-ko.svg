<text x="80" y="696" font-size="27" font-weight="400" fill="#18392f">상호주의 조건 없음 · 씨앗 제안: 상호 호혜와 실질적 정주 기준</text>
<text x="54" y="823" font-size="22" font-weight="400" fill="#52635d">자료: 법령 안내 · 보건복지부 · 개편 방향은 씨앗의 판단</text>
