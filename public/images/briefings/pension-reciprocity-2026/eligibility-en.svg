<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#faf9f5"/><g font-family="Noto Sans KR, Arial, sans-serif" fill="#18392f">
<text x="54" y="65" font-size="40" font-weight="700" fill="#18392f">Pension rights and extra public support</text>
<text x="54" y="111" font-size="25" font-weight="400" fill="#52635d">SEED proposals · These review criteria are distinct from current eligibility rules.</text>
<rect x="54" y="150" width="1092" height="185" rx="10" fill="#ffffff" stroke="#c8d6cf"/>
<text x="80" y="195" font-size="30" font-weight="700" fill="#18392f">Rights earned through contributions</text>
<text x="80" y="239" font-size="27" font-weight="400" fill="#18392f">Respect the pension rights of members who work and pay premiums.</text>
<text x="80" y="276" font-size="27" font-weight="400" fill="#18392f">Benefits should fairly reflect their contributions and insured periods.</text>
<rect x="54" y="360" width="1092" height="185" rx="10" fill="#ffffff" stroke="#c8d6cf"/>
<text x="80" y="405" font-size="30" font-weight="700" fill="#18392f">Support added from public funds</text>
<text x="80" y="449" font-size="27" font-weight="400" fill="#18392f">Review actual residence, caregiving, contributions and employment ties.</text>
<text x="80" y="486" font-size="27" font-weight="400" fill="#18392f">Show the link to policy goals, the number of beneficiaries and the cost.</text>
<rect x="54" y="570" width="1092" height="185" rx="10" fill="#ffffff" stroke="#c8d6cf"/>
<text x="80" y="615" font-size="30" font-weight="700" fill="#18392f">Rights and benefits across borders</text>
<text x="80" y="659" font-size="27" font-weight="400" fill="#18392f">Check corresponding rights for Koreans and relevant agreements.</text>
<text x="80" y="696" font-size="27" font-weight="400" fill="#18392f">Explain the reason, cost and public benefit of unilateral extra support.</text>
<text x="54" y="823" font-size="22" font-weight="400" fill="#52635d">The Voice of SEED · Policy proposals</text>
</g></svg>