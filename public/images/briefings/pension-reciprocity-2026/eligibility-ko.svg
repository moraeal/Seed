<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#faf9f5"/><g font-family="Noto Sans KR, Arial, sans-serif" fill="#18392f">
<text x="54" y="65" font-size="40" font-weight="700" fill="#18392f">연금의 권리와 추가 지원의 기준</text>
<text x="54" y="111" font-size="25" font-weight="400" fill="#52635d">씨앗의 제안 · 아래 검토 항목은 현행 자격 요건과 구별됩니다.</text>
<rect x="54" y="150" width="1092" height="185" rx="10" fill="#ffffff" stroke="#c8d6cf"/>
<text x="80" y="195" font-size="30" font-weight="700" fill="#18392f">보험료를 내고 쌓은 권리</text>
<text x="80" y="239" font-size="27" font-weight="400" fill="#18392f">국내에서 일하고 보험료를 낸 가입자의 권리는 존중해야 합니다.</text>
<text x="80" y="276" font-size="27" font-weight="400" fill="#18392f">납부와 가입 이력에 따른 급여를 공정하게 보장합니다.</text>
<rect x="54" y="360" width="1092" height="185" rx="10" fill="#ffffff" stroke="#c8d6cf"/>
<text x="80" y="405" font-size="30" font-weight="700" fill="#18392f">공적 재원으로 더하는 지원</text>
<text x="80" y="449" font-size="27" font-weight="400" fill="#18392f">국내 실거주 · 실제 양육 장소 · 보험료 납부와 고용관계</text>
<text x="80" y="486" font-size="27" font-weight="400" fill="#18392f">지원 목적과의 연결을 확인하고, 수혜 규모와 비용을 공개합니다.</text>
<rect x="54" y="570" width="1092" height="185" rx="10" fill="#ffffff" stroke="#c8d6cf"/>
<text x="80" y="615" font-size="30" font-weight="700" fill="#18392f">국가 간 권리와 혜택</text>
<text x="80" y="659" font-size="27" font-weight="400" fill="#18392f">상대국이 한국인에게 주는 상응 권리와 협정 내용을 확인합니다.</text>
<text x="80" y="696" font-size="27" font-weight="400" fill="#18392f">일방적 추가 지원에는 이유와 비용, 국민의 이익을 설명해야 합니다.</text>
<text x="54" y="823" font-size="22" font-weight="400" fill="#52635d">씨앗의 소리 · 정책 제안</text>
</g></svg>