<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">경기도 재정 경고등</title>
  <desc id="desc">경기도 재정은 공식 부도는 아니지만 지방채, 기금 차입, 필수예산 부족 등 여러 경고등이 켜진 상태를 표현한 그림</desc>
  <rect width="1200" height="800" fill="#F4F1E8"/>
  <rect x="64" y="64" width="1072" height="672" rx="36" fill="#FFFDF7" stroke="#174C3A" stroke-opacity=".18" stroke-width="3"/>
  <text x="112" y="138" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="800" fill="#174C3A" letter-spacing="3">SEED CITIZEN BRIEFING</text>
  <text x="112" y="208" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="900" fill="#13243A">부도는 아니다.</text>
  <text x="112" y="270" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="900" fill="#A33B2B">그러나 경고등은 켜졌다.</text>

  <g transform="translate(112 344)">
    <rect x="0" y="0" width="442" height="250" rx="26" fill="#13243A"/>
    <path d="M66 196 C102 90 332 90 370 196" fill="none" stroke="#E7E0CC" stroke-width="18" stroke-linecap="round"/>
    <path d="M66 196 C81 153 111 122 145 104" fill="none" stroke="#89A797" stroke-width="18" stroke-linecap="round"/>
    <path d="M145 104 C202 73 276 77 324 113" fill="none" stroke="#D7A13D" stroke-width="18" stroke-linecap="round"/>
    <path d="M324 113 C347 132 362 160 370 196" fill="none" stroke="#B94B39" stroke-width="18" stroke-linecap="round"/>
    <line x1="218" y1="178" x2="324" y2="118" stroke="#FFF7E5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="218" cy="178" r="17" fill="#FFF7E5"/>
    <text x="30" y="44" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="800" fill="#D8B66A">재정 위험 신호</text>
    <text x="34" y="226" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#FFFFFF" opacity=".75">정상</text>
    <text x="188" y="82" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#FFFFFF" opacity=".75">주의</text>
    <text x="350" y="226" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#FFFFFF" opacity=".75">위험</text>
  </g>

  <g transform="translate(602 344)" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <g>
      <circle cx="28" cy="28" r="28" fill="#D7A13D"/>
      <text x="28" y="36" text-anchor="middle" font-size="24" font-weight="900" fill="#13243A">!</text>
      <text x="76" y="22" font-size="18" font-weight="800" fill="#13243A">지방채 발행</text>
      <text x="76" y="49" font-size="26" font-weight="900" fill="#174C3A">9,430억 원</text>
      <text x="286" y="49" font-size="16" fill="#6A6A64">발행한도 99.6%</text>
    </g>
    <g transform="translate(0 82)">
      <circle cx="28" cy="28" r="28" fill="#D7A13D"/>
      <text x="28" y="36" text-anchor="middle" font-size="24" font-weight="900" fill="#13243A">!</text>
      <text x="76" y="22" font-size="18" font-weight="800" fill="#13243A">기금 차입</text>
      <text x="76" y="49" font-size="26" font-weight="900" fill="#174C3A">5,588억 원</text>
    </g>
    <g transform="translate(0 164)">
      <circle cx="28" cy="28" r="28" fill="#B94B39"/>
      <text x="28" y="36" text-anchor="middle" font-size="24" font-weight="900" fill="#FFFFFF">!</text>
      <text x="76" y="22" font-size="18" font-weight="800" fill="#13243A">필수 민생사업</text>
      <text x="76" y="49" font-size="26" font-weight="900" fill="#A33B2B">일부 9개월분 편성</text>
    </g>
  </g>

  <rect x="112" y="642" width="976" height="54" rx="27" fill="#E9EFEA"/>
  <text x="600" y="677" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="800" fill="#174C3A">핵심 질문: “부도냐 아니냐”보다 왜 이 지경까지 왔는가?</text>
</svg>