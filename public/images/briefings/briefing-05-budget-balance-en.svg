<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Why can the deficit shrink while spending rises?</title>
  <desc id="desc">The 2027 government proposal assumes total expenditure grows 12.8 percent, total revenue grows 30.4 percent, national tax revenue rises from KRW 390.2 trillion to KRW 584.4 trillion, and the managed fiscal deficit falls from KRW 107.8 trillion to KRW 3.1 trillion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4e9"/><stop offset="1" stop-color="#e8f0eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102c27" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#b58c35"/></marker>
    <style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.navy{fill:#102c27}.muted{fill:#52605c}.white{fill:#fff}.gold{fill:#b58c35}</style>
  </defs>
  <rect width="1400" height="900" rx="30" fill="url(#bg)"/><rect x="42" y="42" width="8" height="816" rx="4" fill="#b58c35"/>
  <text x="700" y="88" text-anchor="middle" class="serif navy" font-size="40" font-weight="800">Why can the deficit shrink while spending rises?</text>
  <text x="700" y="130" text-anchor="middle" class="sans muted" font-size="20" font-weight="600">The calculation depends on revenue growing much faster than expenditure.</text>
  <g filter="url(#shadow)">
    <rect x="100" y="190" width="520" height="300" rx="26" fill="#fff" stroke="#c9d9d1" stroke-width="3"/>
    <text x="145" y="244" class="sans navy" font-size="24" font-weight="800">Growth from the original 2026 budget</text>
    <text x="145" y="304" class="sans muted" font-size="20" font-weight="700">Expenditure</text><rect x="285" y="276" width="240" height="38" rx="10" fill="#d8e7df"/><rect x="285" y="276" width="101" height="38" rx="10" fill="#36745e"/><text x="550" y="305" text-anchor="end" class="sans navy" font-size="25" font-weight="900">+12.8%</text>
    <text x="145" y="379" class="sans muted" font-size="20" font-weight="700">Revenue</text><rect x="285" y="351" width="240" height="38" rx="10" fill="#eee5ca"/><rect x="285" y="351" width="240" height="38" rx="10" fill="#b58c35"/><text x="550" y="380" text-anchor="end" class="sans navy" font-size="25" font-weight="900">+30.4%</text>
    <text x="145" y="445" class="sans muted" font-size="18">Revenue growth is about 2.4× expenditure growth</text>
  </g>
  <path d="M650 340H760" fill="none" stroke="#b58c35" stroke-width="7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="790" y="190" width="510" height="300" rx="26" fill="#173f35"/>
    <text x="1045" y="246" text-anchor="middle" class="sans white" font-size="24" font-weight="800">Managed fiscal-balance deficit</text>
    <text x="895" y="338" text-anchor="middle" class="sans" font-size="34" font-weight="900" fill="#f3d98d">KRW 107.8T</text><text x="895" y="376" text-anchor="middle" class="sans" font-size="18" fill="#d7e7df">2026</text>
    <path d="M1015 338h55" fill="none" stroke="#f3d98d" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="1190" y="338" text-anchor="middle" class="sans white" font-size="34" font-weight="900">KRW 3.1T</text><text x="1190" y="376" text-anchor="middle" class="sans" font-size="18" fill="#d7e7df">2027 proposal</text>
    <text x="1045" y="443" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#d7e7df">Possible only if the revenue forecast holds</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="100" y="550" width="1200" height="210" rx="26" fill="#fff" stroke="#d7c58e" stroke-width="3"/>
    <text x="150" y="610" class="sans gold" font-size="20" font-weight="900">THE KEY ASSUMPTION</text>
    <text x="150" y="674" class="serif navy" font-size="29" font-weight="800">Tax revenue: KRW 390.2T → KRW 584.4T</text>
    <rect x="940" y="608" width="290" height="78" rx="18" fill="#f3ead1"/><text x="1085" y="658" text-anchor="middle" class="sans navy" font-size="28" font-weight="900">+KRW 194.2T</text>
    <text x="150" y="724" class="sans muted" font-size="18">This tax has not yet been collected. The result changes if semiconductor earnings fall short.</text>
  </g>
  <text x="700" y="825" text-anchor="middle" class="sans muted" font-size="17">KRW trillions · 2027 government proposal · projections, not final accounts</text>
</svg>
