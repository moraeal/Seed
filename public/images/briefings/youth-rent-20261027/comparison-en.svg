<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#faf8f0"/><g font-family="Noto Sans KR" fill="#183a32"><text x="70" y="98" font-size="43" font-weight="700">Rent credits are not guaranteed cash refunds</text><text x="70" y="154" font-size="25" fill="#5c655f">Annual calculated credits in KRW · Proposal only · Not actual refunds</text><text x="80" y="240" font-size="29" font-weight="600">Monthly rent</text><text x="450" y="240" font-size="29" font-weight="600">Current 17%</text><text x="790" y="240" font-size="29" font-weight="600">Proposed 20%</text><text x="1130" y="240" font-size="29" font-weight="600">Increase</text><rect x="55" y="275" width="1330" height="96" rx="8" fill="#fff"/><text x="80" y="336" font-size="29" font-weight="500">KRW 500,000</text><text x="450" y="336" font-size="29" font-weight="500">1,020,000</text><text x="790" y="336" font-size="29" font-weight="500">1,200,000</text><text x="1130" y="336" font-size="29" font-weight="700">180,000</text><rect x="55" y="387" width="1330" height="96" rx="8" fill="#edf0e7"/><text x="80" y="448" font-size="29" font-weight="500">KRW 800,000</text><text x="450" y="448" font-size="29" font-weight="500">1,632,000</text><text x="790" y="448" font-size="29" font-weight="500">1,920,000</text><text x="1130" y="448" font-size="29" font-weight="700">288,000</text><rect x="55" y="499" width="1330" height="96" rx="8" fill="#fff"/><text x="80" y="560" font-size="29" font-weight="500">KRW 1,000,000</text><text x="450" y="560" font-size="29" font-weight="500">1,700,000</text><text x="790" y="560" font-size="29" font-weight="500">2,400,000</text><text x="1130" y="560" font-size="29" font-weight="700">700,000</text><text x="70" y="675" font-size="24">Eligible annual rent cap: KRW 10m currently → KRW 12m proposed</text><text x="70" y="724" font-size="23" fill="#5c655f">Assumes full eligibility and sufficient income tax. Local tax excluded.</text><text x="70" y="775" font-size="21" fill="#69736b">SEED VOICE | Current law and official summary of Bill 2222071 | Oct 27, 2026</text></g></svg>