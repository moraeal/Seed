<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f5ef"/><text x="80" y="92" font-family="Noto Sans KR, sans-serif" font-weight="700" font-size="40" fill="#1b3530">Who did what at the inspection</text><rect x="75" y="155" width="1050" height="82" rx="12" fill="#ffffff"/><text x="100" y="207" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#24775c">Prosecutor</text><text x="360" y="207" font-family="Noto Sans KR, sans-serif" font-size="26" fill="#283a35">Directs inspection</text><rect x="75" y="255" width="1050" height="82" rx="12" fill="#ffffff"/><text x="100" y="307" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#24775c">Election staff</text><text x="360" y="307" font-family="Noto Sans KR, sans-serif" font-size="26" fill="#283a35">Assist ballot review</text><rect x="75" y="355" width="1050" height="82" rx="12" fill="#ffffff"/><text x="100" y="407" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#24775c">Observers</text><text x="360" y="407" font-family="Noto Sans KR, sans-serif" font-size="26" fill="#283a35">Watch and raise objections</text><rect x="75" y="455" width="1050" height="82" rx="12" fill="#ffffff"/><text x="100" y="507" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#24775c">Broadcasters</text><text x="360" y="507" font-family="Noto Sans KR, sans-serif" font-size="26" fill="#283a35">Two cameras permitted to record</text><rect x="75" y="555" width="1050" height="82" rx="12" fill="#ffffff"/><text x="100" y="607" font-family="Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#24775c">Next step</text><text x="360" y="607" font-family="Noto Sans KR, sans-serif" font-size="26" fill="#283a35">Forensic testing of selected ballots</text></svg>