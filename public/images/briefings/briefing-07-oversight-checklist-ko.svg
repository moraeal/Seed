<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f5f1e7"/>
  <text x="70" y="92" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#173b35">민간위원 공무출장, 시민은 무엇을 확인해야 합니까</text>
  <text x="70" y="136" font-family="Arial, sans-serif" font-size="23" fill="#596862">정치적 망신주기 대신 출장 전·중·후에 같은 공개 기준을 적용해야 합니다.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="190" width="320" height="400" rx="24" fill="#ffffff" stroke="#9db9ad" stroke-width="3"/>
    <circle cx="120" cy="246" r="26" fill="#1f5a4d"/><text x="112" y="255" font-size="25" font-weight="700" fill="#fff">1</text>
    <text x="165" y="257" font-size="31" font-weight="700" fill="#173b35">출장 전</text>
    <text x="105" y="330" font-size="24" fill="#303b38">• 공무 목적과 기간</text>
    <text x="105" y="382" font-size="24" fill="#303b38">• 개인·기업 일정 구분</text>
    <text x="105" y="434" font-size="24" fill="#303b38">• 비용 부담 주체</text>
    <text x="105" y="486" font-size="24" fill="#303b38">• 이해충돌 사전 신고</text>
    <rect x="440" y="190" width="320" height="400" rx="24" fill="#ffffff" stroke="#d0ad64" stroke-width="3"/>
    <circle cx="490" cy="246" r="26" fill="#b88628"/><text x="482" y="255" font-size="25" font-weight="700" fill="#fff">2</text>
    <text x="535" y="257" font-size="31" font-weight="700" fill="#173b35">출장 중</text>
    <text x="475" y="330" font-size="24" fill="#303b38">• 면담 기관과 내용 기록</text>
    <text x="475" y="382" font-size="24" fill="#303b38">• 공적 지원 범위</text>
    <text x="475" y="434" font-size="24" fill="#303b38">• 사적 일정 지원 금지</text>
    <text x="475" y="486" font-size="24" fill="#303b38">• 기업 일정 연결 공개</text>
    <rect x="810" y="190" width="320" height="400" rx="24" fill="#ffffff" stroke="#9db9ad" stroke-width="3"/>
    <circle cx="860" cy="246" r="26" fill="#1f5a4d"/><text x="852" y="255" font-size="25" font-weight="700" fill="#fff">3</text>
    <text x="905" y="257" font-size="31" font-weight="700" fill="#173b35">출장 후</text>
    <text x="845" y="330" font-size="24" fill="#303b38">• 실제 집행 비용 공개</text>
    <text x="845" y="382" font-size="24" fill="#303b38">• 공무 성과와 후속 정책</text>
    <text x="845" y="434" font-size="24" fill="#303b38">• 특정 기업 수혜 점검</text>
    <text x="845" y="486" font-size="24" fill="#303b38">• 이해충돌 시 심의 회피</text>
    <path d="M390 390h40m330 0h40" stroke="#b88628" stroke-width="8" stroke-linecap="round"/>
    <text x="70" y="660" font-size="25" font-weight="700" fill="#173b35">씨드의 기준  |  일정 · 비용 · 공적 지원 · 이해충돌 · 성과를 누구에게나 동일하게 공개</text>
  </g>
</svg>
