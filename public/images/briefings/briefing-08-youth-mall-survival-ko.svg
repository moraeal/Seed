<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">청년몰 최초 입점 점포의 폐업 현황</title>
  <desc id="desc">2024년 8월 기준 최초 입점 점포 741곳 가운데 401곳이 폐업해 폐업률이 54.1퍼센트였음을 보여주는 도표</desc>
  <rect width="1200" height="675" fill="#F6F1E7"/>
  <text x="80" y="92" fill="#163C35" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" letter-spacing="3">청년몰 실패가 남긴 숫자</text>
  <text x="80" y="148" fill="#102A43" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="39" font-weight="800">최초 입점 점포의 절반 이상이 문을 닫았습니다</text>
  <line x1="80" y1="184" x2="1120" y2="184" stroke="#D3C7AE" stroke-width="2"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <rect x="80" y="238" width="320" height="250" rx="20" fill="#FFFFFF" stroke="#D9D2C3"/>
    <text x="115" y="295" fill="#58666D" font-size="22">최초 입점</text>
    <text x="115" y="396" fill="#163C35" font-size="92" font-weight="800">741</text>
    <text x="302" y="396" fill="#58666D" font-size="27">곳</text>
    <rect x="440" y="238" width="320" height="250" rx="20" fill="#FFFFFF" stroke="#D9D2C3"/>
    <text x="475" y="295" fill="#58666D" font-size="22">폐업</text>
    <text x="475" y="396" fill="#A44736" font-size="92" font-weight="800">401</text>
    <text x="662" y="396" fill="#58666D" font-size="27">곳</text>
    <rect x="800" y="238" width="320" height="250" rx="20" fill="#163C35"/>
    <text x="835" y="295" fill="#EADDBD" font-size="22">폐업률</text>
    <text x="835" y="396" fill="#FFFFFF" font-size="88" font-weight="800">54.1%</text>
    <text x="80" y="558" fill="#102A43" font-size="25" font-weight="700">점포를 만드는 것과 시장을 만드는 것은 다릅니다.</text>
    <text x="80" y="610" fill="#6E777A" font-size="18">기준: 2024년 8월 · 최초 입점 점포 기준 · 자료: 국회입법조사처</text>
  </g>
</svg>
