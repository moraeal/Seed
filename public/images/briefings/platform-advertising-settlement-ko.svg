<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">치킨집 하루 매출과 정산 입금액</title><desc id="desc">매출 300만 400원 중 입금액은 216만 5,838원, 정산 차액은 83만 4,562원입니다. 이 가게는 이날 광고를 집행하지 않았습니다.</desc>
<rect width="1000" height="610" fill="#f5f3ed"/><rect x="24" y="24" width="952" height="562" rx="24" fill="#fffefa" stroke="#dce3d8" stroke-width="2"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="74" y="90" font-size="24" font-weight="700" fill="#487064">실제 하루 정산 사례 · 서울 관악구 치킨집</text>
<text x="74" y="147" font-size="41" font-weight="800" fill="#213f36">300만 원을 팔고, 얼마가 입금됐나</text>
<text x="74" y="217" font-size="28" fill="#48594f">하루 배달앱 매출</text><text x="926" y="217" text-anchor="end" font-size="40" font-weight="800" fill="#213f36">3,000,400원</text>
<rect x="74" y="242" width="852" height="78" rx="12" fill="#c39554"/><path d="M86 242H689V320H86Q74 320 74 308V254Q74 242 86 242Z" fill="#205443"/>
<text x="99" y="294" font-size="26" font-weight="700" fill="white">입금 72.2%</text><text x="726" y="294" font-size="25" font-weight="700" fill="#213f36">차액 27.8%</text>
<text x="74" y="370" font-size="26" fill="#48594f">가게 계좌 입금액</text><text x="926" y="370" text-anchor="end" font-size="36" font-weight="800" fill="#205443">2,165,838원</text>
<text x="74" y="421" font-size="26" fill="#48594f">매출과 입금액의 차이</text><text x="926" y="421" text-anchor="end" font-size="36" font-weight="800" fill="#856032">834,562원</text>
<line x1="74" y1="449" x2="926" y2="449" stroke="#dce3d8" stroke-width="2"/>
<text x="74" y="498" font-size="26" font-weight="800" fill="#205443">이날 광고비 0원</text><text x="74" y="541" font-size="23" fill="#48594f">차액에는 중개이용료·배달비·할인 분담액 등이 포함됩니다.</text>
</g></svg>
