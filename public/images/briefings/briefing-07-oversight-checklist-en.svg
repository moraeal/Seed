<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f5f1e7"/>
  <text x="70" y="92" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#173b35">How citizens should review official travel by private appointees</text>
  <text x="70" y="136" font-family="Arial, sans-serif" font-size="23" fill="#596862">Use the same disclosure rules before, during and after travel—not political humiliation.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="190" width="320" height="400" rx="24" fill="#fff" stroke="#9db9ad" stroke-width="3"/>
    <circle cx="120" cy="246" r="26" fill="#1f5a4d"/><text x="112" y="255" font-size="25" font-weight="700" fill="#fff">1</text>
    <text x="165" y="257" font-size="31" font-weight="700" fill="#173b35">Before</text>
    <text x="105" y="330" font-size="23" fill="#303b38">• Public purpose and dates</text>
    <text x="105" y="382" font-size="23" fill="#303b38">• Separate private itinerary</text>
    <text x="105" y="434" font-size="23" fill="#303b38">• Who pays each cost</text>
    <text x="105" y="486" font-size="23" fill="#303b38">• Declare conflicts</text>
    <rect x="440" y="190" width="320" height="400" rx="24" fill="#fff" stroke="#d0ad64" stroke-width="3"/>
    <circle cx="490" cy="246" r="26" fill="#b88628"/><text x="482" y="255" font-size="25" font-weight="700" fill="#fff">2</text>
    <text x="535" y="257" font-size="31" font-weight="700" fill="#173b35">During</text>
    <text x="475" y="330" font-size="23" fill="#303b38">• Record meetings</text>
    <text x="475" y="382" font-size="23" fill="#303b38">• Define public support</text>
    <text x="475" y="434" font-size="23" fill="#303b38">• No support for private work</text>
    <text x="475" y="486" font-size="23" fill="#303b38">• Disclose business links</text>
    <rect x="810" y="190" width="320" height="400" rx="24" fill="#fff" stroke="#9db9ad" stroke-width="3"/>
    <circle cx="860" cy="246" r="26" fill="#1f5a4d"/><text x="852" y="255" font-size="25" font-weight="700" fill="#fff">3</text>
    <text x="905" y="257" font-size="31" font-weight="700" fill="#173b35">After</text>
    <text x="845" y="330" font-size="23" fill="#303b38">• Publish actual spending</text>
    <text x="845" y="382" font-size="23" fill="#303b38">• Report public outcomes</text>
    <text x="845" y="434" font-size="23" fill="#303b38">• Review private benefits</text>
    <text x="845" y="486" font-size="23" fill="#303b38">• Recuse when conflicted</text>
    <path d="M390 390h40m330 0h40" stroke="#b88628" stroke-width="8" stroke-linecap="round"/>
    <text x="70" y="660" font-size="24" font-weight="700" fill="#173b35">SEED standard  |  itinerary · cost · public support · conflicts · outcomes</text>
  </g>
</svg>
