<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Public spending and contraction after a decade of Youth Malls</title>
  <desc id="desc">About KRW 160.8 billion was spent, while Youth Malls fell from 43 to 31 and their shops from 741 to 331 by February 2026</desc>
  <rect width="1200" height="675" fill="#F6F1E7"/>
  <text x="80" y="92" fill="#163C35" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">A DECADE OF YOUTH MALLS</text>
  <text x="80" y="148" fill="#102A43" font-family="Arial, sans-serif" font-size="38" font-weight="800">KRW 160.8 billion spent, yet the shop base halved</text>
  <line x1="80" y1="184" x2="1120" y2="184" stroke="#D3C7AE" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="238" width="320" height="250" rx="20" fill="#FFFFFF" stroke="#D9D2C3"/>
    <text x="115" y="295" fill="#58666D" font-size="22">Public funds</text>
    <text x="115" y="396" fill="#163C35" font-size="35" font-weight="800">KRW 160.8bn</text>
    <rect x="440" y="238" width="320" height="250" rx="20" fill="#FFFFFF" stroke="#D9D2C3"/>
    <text x="475" y="295" fill="#58666D" font-size="22">Youth Malls</text>
    <text x="475" y="396" fill="#A44736" font-size="69" font-weight="800">43→31</text>
    <rect x="800" y="238" width="320" height="250" rx="20" fill="#163C35"/>
    <text x="835" y="295" fill="#EADDBD" font-size="22">Shops</text>
    <text x="835" y="396" fill="#FFFFFF" font-size="55" font-weight="800">741→331</text>
    <text x="80" y="558" fill="#102A43" font-size="25" font-weight="700">Shops down 55.4% — building premises did not build a market.</text>
    <text x="80" y="610" fill="#6E777A" font-size="18">As of Feb. 2026 · Source: SEMAS data submitted to the National Assembly</text>
  </g>
</svg>
