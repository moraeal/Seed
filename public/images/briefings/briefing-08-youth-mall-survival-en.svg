<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Closures among original Youth Mall tenants</title>
  <desc id="desc">Of 741 original tenant shops, 401 had closed by August 2024, a closure rate of 54.1 percent</desc>
  <rect width="1200" height="675" fill="#F6F1E7"/>
  <text x="80" y="92" fill="#163C35" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">THE NUMBER BEHIND YOUTH MALLS</text>
  <text x="80" y="148" fill="#102A43" font-family="Arial, sans-serif" font-size="38" font-weight="800">More than half of the original shops closed</text>
  <line x1="80" y1="184" x2="1120" y2="184" stroke="#D3C7AE" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="238" width="320" height="250" rx="20" fill="#FFFFFF" stroke="#D9D2C3"/>
    <text x="115" y="295" fill="#58666D" font-size="22">Original tenants</text>
    <text x="115" y="396" fill="#163C35" font-size="92" font-weight="800">741</text>
    <rect x="440" y="238" width="320" height="250" rx="20" fill="#FFFFFF" stroke="#D9D2C3"/>
    <text x="475" y="295" fill="#58666D" font-size="22">Closed</text>
    <text x="475" y="396" fill="#A44736" font-size="92" font-weight="800">401</text>
    <rect x="800" y="238" width="320" height="250" rx="20" fill="#163C35"/>
    <text x="835" y="295" fill="#EADDBD" font-size="22">Closure rate</text>
    <text x="835" y="396" fill="#FFFFFF" font-size="88" font-weight="800">54.1%</text>
    <text x="80" y="558" fill="#102A43" font-size="25" font-weight="700">Building shops is not the same as building a market.</text>
    <text x="80" y="610" fill="#6E777A" font-size="18">As of Aug. 2024 · Original tenants · Source: National Assembly Research Service</text>
  </g>
</svg>
