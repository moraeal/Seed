<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">미래대응기금을 판단하는 세 가지 기준</title>
  <desc id="desc">사업 타당성, 국회 통제, 지속가능성의 세 기준으로 미래대응기금을 살펴보는 도표</desc>
  <rect width="1400" height="760" fill="#f5f2e9"/>
  <text x="700" y="95" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="42" font-weight="800" fill="#173a36">‘미래’라는 이름보다 먼저 볼 것</text>
  <text x="700" y="145" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="22" fill="#4b5d59">162조 원의 크기보다 사업·통제·지속가능성을 확인해야 합니다</text>
  <g transform="translate(95 220)">
    <rect width="370" height="390" rx="28" fill="#ffffff" stroke="#1f5a50" stroke-width="4"/>
    <circle cx="185" cy="88" r="48" fill="#dcece6"/>
    <text x="185" y="101" text-anchor="middle" font-family="serif" font-size="42" font-weight="700" fill="#1f5a50">1</text>
    <text x="185" y="180" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="30" font-weight="800" fill="#173a36">사업 타당성</text>
    <text x="185" y="236" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="21" fill="#465a56">소비인가, 투자입니까?</text>
    <text x="185" y="278" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="21" fill="#465a56">성과를 측정할 수 있습니까?</text>
    <rect x="55" y="322" width="260" height="44" rx="22" fill="#1f5a50"/>
    <text x="185" y="352" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#ffffff">선정 전에 검증</text>
  </g>
  <g transform="translate(515 220)">
    <rect width="370" height="390" rx="28" fill="#ffffff" stroke="#b68a2b" stroke-width="4"/>
    <circle cx="185" cy="88" r="48" fill="#f3e7c8"/>
    <text x="185" y="101" text-anchor="middle" font-family="serif" font-size="42" font-weight="700" fill="#9b711d">2</text>
    <text x="185" y="180" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="30" font-weight="800" fill="#173a36">국회 통제</text>
    <text x="185" y="236" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="21" fill="#465a56">30% 변경은 적정합니까?</text>
    <text x="185" y="278" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="21" fill="#465a56">변경 내역은 즉시 공개됩니까?</text>
    <rect x="55" y="322" width="260" height="44" rx="22" fill="#b68a2b"/>
    <text x="185" y="352" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#ffffff">재량만큼 책임</text>
  </g>
  <g transform="translate(935 220)">
    <rect width="370" height="390" rx="28" fill="#ffffff" stroke="#263d58" stroke-width="4"/>
    <circle cx="185" cy="88" r="48" fill="#e0e6ec"/>
    <text x="185" y="101" text-anchor="middle" font-family="serif" font-size="42" font-weight="700" fill="#263d58">3</text>
    <text x="185" y="180" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="30" font-weight="800" fill="#173a36">지속가능성</text>
    <text x="185" y="236" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="21" fill="#465a56">호황이 끝나면 어찌합니까?</text>
    <text x="185" y="278" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="21" fill="#465a56">사업 종료 기준이 있습니까?</text>
    <rect x="55" y="322" width="260" height="44" rx="22" fill="#263d58"/>
    <text x="185" y="352" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#ffffff">미래 부담까지 계산</text>
  </g>
  <text x="700" y="690" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="24" font-weight="800" fill="#173a36">좋은 명분은 검증과 통제를 대신하지 못합니다</text>
</svg>
