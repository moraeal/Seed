<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="서진학교와 동네, 함께 바뀐 시간">
<rect width="1200" height="760" fill="#f5f4ea"/>
<rect x="24" y="24" width="1152" height="712" rx="22" fill="#fffdf8" stroke="#d3dfd3" stroke-width="2"/>
<text x="80" y="104" font-family="sans-serif" font-size="38" font-weight="bold" fill="#183f34">서진학교와 동네, 함께 바뀐 시간</text>
<text x="80" y="148" font-family="sans-serif" font-size="22" fill="#556b60">설립을 둘러싼 갈등에서 일상의 협력으로</text>
<line x1="160" y1="208" x2="160" y2="602" stroke="#b9cdbb" stroke-width="5"/>
<circle cx="160" cy="224" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="231" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2013</text>
<text x="214" y="222" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">설립 추진</text>
<text x="214" y="254" font-family="sans-serif" font-size="20" fill="#566a60">서울시교육청, 특수학교 설립 추진</text>
<circle cx="160" cy="318" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="325" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2017</text>
<text x="214" y="316" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">학부모의 호소</text>
<text x="214" y="348" font-family="sans-serif" font-size="20" fill="#566a60">주민설명회에서 부모들이 무릎을 꿇다</text>
<circle cx="160" cy="412" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="419" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2020</text>
<text x="214" y="410" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">서진학교 개교</text>
<text x="214" y="442" font-family="sans-serif" font-size="20" fill="#566a60">발달장애 학생을 위한 학교가 문을 열다</text>
<circle cx="160" cy="506" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="513" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2025</text>
<text x="214" y="504" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">폭우 뒤 함께 청소</text>
<text x="214" y="536" font-family="sans-serif" font-size="20" fill="#566a60">주민 30명과 주민센터 직원 15명이 참여</text>
<circle cx="160" cy="600" r="14" fill="#207253" stroke="#fffdf8" stroke-width="5"/>
<text x="84" y="607" font-family="sans-serif" font-size="23" font-weight="bold" fill="#207253">2026</text>
<text x="214" y="598" font-family="sans-serif" font-size="25" font-weight="bold" fill="#203832">학생과 이웃이 함께 걷다</text>
<text x="214" y="630" font-family="sans-serif" font-size="20" fill="#566a60">봄에 학생 20여 명과 주민들이 쓰레기를 줍다</text>
<text x="80" y="684" font-family="sans-serif" font-size="16" fill="#66776e">자료: 조선일보(2026.9.23), 연합뉴스(2019.7.30)  ·  씨앗의 소리 재구성</text>
</svg>