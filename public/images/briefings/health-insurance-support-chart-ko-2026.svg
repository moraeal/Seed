<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="건강보험 국고지원, 같은 분모로 비교하면">
 <rect width="1200" height="680" fill="#f8f7f2"/>
 <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" fill="#173544">
 <text x="80" y="98" font-size="43" font-weight="800">건강보험 국고지원, 같은 분모로 비교하면</text>
 <text x="80" y="147" font-size="25" fill="#53636b">2027년 정부 예산안 · 보험료 예상 수입 대비</text>
 <text x="80" y="244" font-size="29" font-weight="700">법률상 지원 기준</text>
 <rect x="80" y="268" width="1000" height="76" rx="4" fill="#d8e8df"/>
 <rect x="80" y="268" width="700" height="76" rx="4" fill="#176b59"/>
 <rect x="780" y="268" width="300" height="76" fill="#407e68"/>
 <text x="1050" y="324" text-anchor="end" font-size="46" fill="#fff" font-weight="800">20%</text>
 <text x="80" y="380" font-size="24" fill="#53636b">일반회계 14% + 국민건강증진기금 6%</text>
 <text x="80" y="455" font-size="29" font-weight="700">정부 예산안</text>
 <rect x="80" y="478" width="1000" height="76" rx="4" fill="#e4e8e5"/>
 <rect x="80" y="478" width="720" height="76" rx="4" fill="#c97f3b"/>
 <text x="765" y="534" text-anchor="end" font-size="46" fill="#fff" font-weight="800">14.4%</text>
 <text x="80" y="590" font-size="24" fill="#53636b">13조 8천억 원 편성 · 국회 심의 전</text>
 <text x="1080" y="398" text-anchor="end" font-size="28" font-weight="800" fill="#a4502d">차이 5.6%포인트</text>
 <text x="80" y="644" font-size="19" fill="#66777b">법률의 예산 범위·기금 재원 조건이 적용됩니다.</text>
 </g>
</svg>