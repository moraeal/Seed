<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">시민은 수혜자가 아니라 주인입니다</title>
  <desc id="desc">정치권력이 혜택을 나눠주는 구조와 시민이 세금과 권한을 맡기고 정부에 책임을 요구하는 구조를 비교한 그림</desc>
  <rect width="1200" height="675" fill="#F4F1E8"/>
  <text x="72" y="86" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800" fill="#174C3A" letter-spacing="2">SEED VIEW</text>
  <text x="72" y="138" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="40" font-weight="900" fill="#13243A">시민은 권력의 고객이 아니라 주인입니다</text>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <rect x="72" y="205" width="486" height="350" rx="30" fill="#FFFDF8" stroke="#A33B2B" stroke-opacity=".25" stroke-width="2"/>
    <text x="112" y="250" font-size="18" font-weight="900" fill="#A33B2B">시혜 정치의 시선</text>
    <rect x="196" y="292" width="238" height="78" rx="16" fill="#A33B2B"/>
    <text x="315" y="328" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">정치권력</text>
    <text x="315" y="353" text-anchor="middle" font-size="14" fill="#FFFFFF" opacity=".8">“우리가 혜택을 줍니다”</text>
    <path d="M315 387v54" stroke="#D7A13D" stroke-width="7" stroke-linecap="round"/>
    <path d="M299 426l16 20 16-20" fill="none" stroke="#D7A13D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(135 450)" fill="#13243A">
      <circle cx="42" cy="27" r="22"/><path d="M5 90c3-35 20-52 37-52s34 17 37 52z"/>
      <circle cx="180" cy="27" r="22"/><path d="M143 90c3-35 20-52 37-52s34 17 37 52z"/>
      <circle cx="318" cy="27" r="22"/><path d="M281 90c3-35 20-52 37-52s34 17 37 52z"/>
    </g>
    <text x="315" y="585" text-anchor="middle" font-size="18" font-weight="800" fill="#676760">시민 = 혜택을 기다리는 수혜자</text>

    <rect x="642" y="205" width="486" height="350" rx="30" fill="#FFFDF8" stroke="#174C3A" stroke-opacity=".25" stroke-width="2"/>
    <text x="682" y="250" font-size="18" font-weight="900" fill="#174C3A">씨드가 보는 시민</text>
    <g transform="translate(700 290)" fill="#174C3A">
      <circle cx="42" cy="27" r="22"/><path d="M5 90c3-35 20-52 37-52s34 17 37 52z"/>
      <circle cx="180" cy="27" r="22"/><path d="M143 90c3-35 20-52 37-52s34 17 37 52z"/>
      <circle cx="318" cy="27" r="22"/><path d="M281 90c3-35 20-52 37-52s34 17 37 52z"/>
    </g>
    <text x="885" y="412" text-anchor="middle" font-size="18" font-weight="900" fill="#174C3A">세금과 권한을 위탁</text>
    <path d="M885 428v42" stroke="#D7A13D" stroke-width="7" stroke-linecap="round"/>
    <path d="M869 455l16 20 16-20" fill="none" stroke="#D7A13D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="766" y="485" width="238" height="72" rx="16" fill="#13243A"/>
    <text x="885" y="515" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">정부</text>
    <text x="885" y="540" text-anchor="middle" font-size="14" fill="#FFFFFF" opacity=".82">사용내역·성과·책임 설명</text>
    <path d="M1030 518h45V350h-40" fill="none" stroke="#174C3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1048 336l-18 14 18 14" fill="none" stroke="#174C3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="885" y="585" text-anchor="middle" font-size="18" font-weight="800" fill="#174C3A">시민 = 묻고 판단하고 책임을 요구하는 주권자</text>
  </g>

  <text x="600" y="635" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="900" fill="#13243A">정부가 시민에게 돈을 주는 것이 아닙니다. 시민이 맡긴 돈을 쓰는 것입니다.</text>
</svg>