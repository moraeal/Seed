<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#f8f6ef"/><g font-family="Noto Sans KR, NanumGothic, sans-serif" fill="#173b34"><text x="70" y="90" font-size="47" font-weight="700">퇴직급여 사외적립, 정부 추진 일정</text><text x="70" y="150" font-size="31" fill="#805d28">법 개정을 전제로 한 계획 · 확정 시행일 아님</text><path d="M145 235V580" stroke="#3a8068" stroke-width="7"/><g fill="#275e4b"><circle cx="145" cy="260" r="18"/><circle cx="145" cy="405" r="18"/><circle cx="145" cy="550" r="18"/></g><text x="205" y="275" font-size="48" font-weight="700">2028년</text><text x="490" y="275" font-size="43">100인 이상 사업장</text><text x="205" y="420" font-size="48" font-weight="700">2029년</text><text x="490" y="420" font-size="43">10~99인 사업장</text><text x="205" y="565" font-size="48" font-weight="700">2030년</text><text x="490" y="565" font-size="43">10인 미만 사업장</text><path d="M70 635H1130" stroke="#c9d1c9" stroke-width="2"/><text x="70" y="695" font-size="32">각 단계 시행 이후의 근속기간부터 적용하는 계획</text><text x="70" y="750" font-size="29">과거 근속분 전액을 첫날 일시 납입한다는 발표가 아닙니다.</text><text x="70" y="805" font-size="24" fill="#61716a">자료: 고용노동부 2026.10.29 발표 · 씨앗의 소리 구성</text></g></svg>
