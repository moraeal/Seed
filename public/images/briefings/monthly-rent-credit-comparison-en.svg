<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f8f6ed"/><rect x="54" y="54" width="1092" height="552" rx="8" fill="white" stroke="#dbe8dc"/><text x="92" y="116" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="32" font-weight="700" fill="#143e32">Rent tax credit · Annual eligible rent cap</text><text x="92" y="151" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="17" fill="#62736a">Current law and 2026 proposals</text><text x="94" y="215" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f3b32">Current law</text><rect x="342" y="185" width="400" height="48" rx="4" fill="#85ad95"/><text x="755" y="215" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="23" font-weight="700" fill="#173e32">KRW 10m</text><text x="94" y="322" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f3b32">Government proposal</text><rect x="342" y="292" width="480" height="48" rx="4" fill="#4b9671"/><text x="835" y="322" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="23" font-weight="700" fill="#173e32">KRW 12m</text><text x="94" y="429" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f3b32">Bill 2221532</text><rect x="342" y="399" width="600" height="48" rx="4" fill="#176045"/><text x="955" y="429" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="23" font-weight="700" fill="#173e32">KRW 15m</text><text x="92" y="564" font-family="Noto Sans CJK KR,Arial,sans-serif" font-size="16" fill="#64756a">These caps are eligible rent, not cash refunds. The proposals are not law.</text><text x="1080" y="574" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#176045" text-anchor="end">SEED VOICE</text></svg>