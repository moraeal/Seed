<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">지출은 늘었는데 왜 적자는 줄어드는가</title>
  <desc id="desc">2027년 정부 예산안에서 총지출은 12.8퍼센트, 총수입은 30.4퍼센트 증가하고 국세수입은 390.2조 원에서 584.4조 원으로 늘어난다는 전망에 따라 관리재정수지 적자가 107.8조 원에서 3.1조 원으로 줄어드는 계산을 설명하는 도표</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4e9"/><stop offset="1" stop-color="#e8f0eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102c27" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#b58c35"/></marker>
    <style>
      .sans{font-family:Pretendard,'Noto Sans KR',Arial,sans-serif}.serif{font-family:'Noto Serif KR',Georgia,serif}.navy{fill:#102c27}.muted{fill:#52605c}.white{fill:#fff}.gold{fill:#b58c35}
    </style>
  </defs>
  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <rect x="42" y="42" width="8" height="816" rx="4" fill="#b58c35"/>
  <text x="700" y="88" text-anchor="middle" class="serif navy" font-size="42" font-weight="800">지출은 늘었는데 왜 적자는 줄어드나</text>
  <text x="700" y="130" text-anchor="middle" class="sans muted" font-size="21" font-weight="600">정부안의 계산은 ‘수입이 지출보다 더 빠르게 늘어난다’는 전망에 달려 있습니다.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="190" width="520" height="300" rx="26" fill="#fff" stroke="#c9d9d1" stroke-width="3"/>
    <text x="145" y="244" class="sans navy" font-size="25" font-weight="800">2026년 본예산 대비 증가율</text>
    <text x="145" y="304" class="sans muted" font-size="20" font-weight="700">총지출</text>
    <rect x="275" y="276" width="250" height="38" rx="10" fill="#d8e7df"/>
    <rect x="275" y="276" width="105" height="38" rx="10" fill="#36745e"/>
    <text x="550" y="305" text-anchor="end" class="sans navy" font-size="25" font-weight="900">+12.8%</text>
    <text x="145" y="379" class="sans muted" font-size="20" font-weight="700">총수입</text>
    <rect x="275" y="351" width="250" height="38" rx="10" fill="#eee5ca"/>
    <rect x="275" y="351" width="250" height="38" rx="10" fill="#b58c35"/>
    <text x="550" y="380" text-anchor="end" class="sans navy" font-size="25" font-weight="900">+30.4%</text>
    <text x="145" y="445" class="sans muted" font-size="18">수입 증가율이 지출 증가율의 약 2.4배</text>
  </g>

  <path d="M650 340H760" fill="none" stroke="#b58c35" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="790" y="190" width="510" height="300" rx="26" fill="#173f35"/>
    <text x="1045" y="246" text-anchor="middle" class="sans white" font-size="25" font-weight="800">관리재정수지 적자 전망</text>
    <text x="895" y="338" text-anchor="middle" class="sans" font-size="42" font-weight="900" fill="#f3d98d">107.8조</text>
    <text x="895" y="376" text-anchor="middle" class="sans" font-size="18" fill="#d7e7df">2026년</text>
    <path d="M1015 338h55" fill="none" stroke="#f3d98d" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="1190" y="338" text-anchor="middle" class="sans white" font-size="42" font-weight="900">3.1조</text>
    <text x="1190" y="376" text-anchor="middle" class="sans" font-size="18" fill="#d7e7df">2027년 정부안</text>
    <text x="1045" y="443" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#d7e7df">세입 전망이 맞을 때 가능한 계산</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="100" y="550" width="1200" height="210" rx="26" fill="#fff" stroke="#d7c58e" stroke-width="3"/>
    <text x="150" y="610" class="sans gold" font-size="20" font-weight="900">계산의 핵심 전제</text>
    <text x="150" y="674" class="serif navy" font-size="35" font-weight="800">국세수입 390.2조 원 → 584.4조 원</text>
    <rect x="890" y="608" width="340" height="78" rx="18" fill="#f3ead1"/>
    <text x="1060" y="658" text-anchor="middle" class="sans navy" font-size="30" font-weight="900">+194.2조 원</text>
    <text x="150" y="724" class="sans muted" font-size="19" font-weight="650">아직 들어오지 않은 세금입니다. 반도체 경기와 기업 실적이 전망에 미치지 못하면 계산도 달라집니다.</text>
  </g>
  <text x="700" y="825" text-anchor="middle" class="sans muted" font-size="17">단위: 조 원 · 2027년 정부 예산안 기준 · 수치는 확정 결산이 아닌 정부 전망</text>
</svg>
