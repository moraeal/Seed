<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="50" y="65" font-size="34" font-weight="700" fill="#174c3a">설명 다음에 확인할 결과</text><text x="50" y="105" font-size="22" fill="#465b54">제도의 안내가 실제 보호로 이어지는지 살핍니다</text><rect x="50" y="145" width="1100" height="55" rx="3" fill="#174c3a"/><text x="70" y="182" font-size="23" font-weight="700" fill="#fff">확인 대상</text><text x="360" y="182" font-size="23" font-weight="700" fill="#fff">공개할 기준</text><text x="770" y="182" font-size="23" font-weight="700" fill="#fff">확인할 결과</text><rect x="50" y="200" width="1100" height="105" fill="#f0f5f2"/><text x="70" y="240" font-size="22" font-weight="700" fill="#18372d">적용 근거</text><text x="360" y="240" font-size="22" font-weight="400" fill="#18372d">기존 법 / 추가 입법</text><text x="360" y="270" font-size="22" font-weight="400" fill="#18372d">각 조치의 시행 시점</text><text x="770" y="240" font-size="22" font-weight="400" fill="#18372d">현재 신청 가능한 보호</text><text x="770" y="270" font-size="22" font-weight="400" fill="#18372d">대기 중 시민의 처리</text><rect x="50" y="305" width="1100" height="105" fill="#fafcfb"/><text x="70" y="345" font-size="22" font-weight="700" fill="#18372d">농지은행</text><text x="360" y="345" font-size="22" font-weight="400" fill="#18372d">매입·매도·임대·관리</text><text x="360" y="375" font-size="22" font-weight="400" fill="#18372d">통로별 수용 조건</text><text x="770" y="345" font-size="22" font-weight="400" fill="#18372d">신청·승인·거절</text><text x="770" y="375" font-size="22" font-weight="400" fill="#18372d">처리 기간과 거절 뒤 보호</text><rect x="50" y="410" width="1100" height="105" fill="#f0f5f2"/><text x="70" y="450" font-size="22" font-weight="700" fill="#18372d">매각 노력</text><text x="360" y="450" font-size="22" font-weight="400" fill="#18372d">정당한 사유 인정</text><text x="360" y="480" font-size="22" font-weight="400" fill="#18372d">증빙과 판단 기준</text><text x="770" y="450" font-size="22" font-weight="400" fill="#18372d">거래 불성립 사례</text><text x="770" y="480" font-size="22" font-weight="400" fill="#18372d">강제금 면제·유예</text><rect x="50" y="515" width="1100" height="105" fill="#fafcfb"/><text x="70" y="555" font-size="22" font-weight="700" fill="#18372d">노후 생활</text><text x="360" y="555" font-size="22" font-weight="400" fill="#18372d">임대 계약과 연금</text><text x="360" y="585" font-size="22" font-weight="400" fill="#18372d">승인·지급 조건</text><text x="770" y="555" font-size="22" font-weight="400" fill="#18372d">실제 지급액</text><text x="770" y="585" font-size="22" font-weight="400" fill="#18372d">소득이 이어지는 시점</text><text x="50" y="655" font-size="19" fill="#586a63">현재 확인되지 않은 처리 실적은 계획과 구분해 지속 확인합니다.</text><text x="50" y="683" font-size="19" fill="#586a63">정리: 씨앗의 소리 · 검토 기준일: 2026.10.3</text></g></svg>