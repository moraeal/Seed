<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="50" y="65" font-size="34" font-weight="700" fill="#174c3a">농지 기사, 무엇을 고쳤나</text><text x="50" y="105" font-size="22" fill="#465b54">2026년 10월 3일 수정판 · 정부 설명과 기존 글 대조</text><rect x="50" y="145" width="1100" height="55" rx="3" fill="#174c3a"/><text x="70" y="182" font-size="23" font-weight="700" fill="#fff">대목</text><text x="360" y="182" font-size="23" font-weight="700" fill="#fff">기존 설명</text><text x="770" y="182" font-size="23" font-weight="700" fill="#fff">수정·보완</text><rect x="50" y="200" width="1100" height="105" fill="#f0f5f2"/><text x="70" y="240" font-size="22" font-weight="700" fill="#18372d">강제금</text><text x="360" y="240" font-size="22" font-weight="400" fill="#18372d">팔지 못하면</text><text x="360" y="270" font-size="22" font-weight="400" fill="#18372d">25% 반복 가능</text><text x="770" y="240" font-size="22" font-weight="400" fill="#18372d">정당한 사유 없는 미이행</text><text x="770" y="270" font-size="22" font-weight="400" fill="#18372d">부과 요건을 명시</text><rect x="50" y="305" width="1100" height="105" fill="#fafcfb"/><text x="70" y="345" font-size="22" font-weight="700" fill="#18372d">처분 유예</text><text x="360" y="345" font-size="22" font-weight="400" fill="#18372d">유예·의무 소멸 설명</text><text x="360" y="375" font-size="22" font-weight="400" fill="#18372d">불충분</text><text x="770" y="345" font-size="22" font-weight="400" fill="#18372d">자경·매도위탁 유예</text><text x="770" y="375" font-size="22" font-weight="400" fill="#18372d">요건 유지 시 의무 소멸</text><rect x="50" y="410" width="1100" height="105" fill="#f0f5f2"/><text x="70" y="450" font-size="22" font-weight="700" fill="#18372d">구두 임대차</text><text x="360" y="450" font-size="22" font-weight="400" fill="#18372d">적법한 임대의 조건</text><text x="360" y="480" font-size="22" font-weight="400" fill="#18372d">충분히 설명하지 않음</text><text x="770" y="450" font-size="22" font-weight="400" fill="#18372d">임대 허용 사유가 있으면</text><text x="770" y="480" font-size="22" font-weight="400" fill="#18372d">구두계약도 유효</text><rect x="50" y="515" width="1100" height="105" fill="#fafcfb"/><text x="70" y="555" font-size="22" font-weight="700" fill="#18372d">면적 비교</text><text x="360" y="555" font-size="22" font-weight="400" fill="#18372d">의심 면적과 공급 규모</text><text x="360" y="585" font-size="22" font-weight="400" fill="#18372d">배수·가정 비교</text><text x="770" y="555" font-size="22" font-weight="400" fill="#18372d">성격이 다른 비교 삭제</text><text x="770" y="585" font-size="22" font-weight="400" fill="#18372d">확정 수요와 실적 확인</text><text x="50" y="655" font-size="19" fill="#586a63">25% 제도는 2021년 도입 · 2026년 개정은 처분명령 의무화 등 집행 보완</text><text x="50" y="683" font-size="19" fill="#586a63">정리: 씨앗의 소리 · 근거: 농식품부 2026.10.2 설명 및 기존 기사</text></g></svg>