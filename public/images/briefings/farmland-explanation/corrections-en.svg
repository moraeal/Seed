<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="50" y="65" font-size="34" font-weight="700" fill="#174c3a">Farmland coverage: what changed</text><text x="50" y="105" font-size="22" fill="#465b54">Revision of October 3, 2026</text><rect x="50" y="145" width="1100" height="55" rx="3" fill="#174c3a"/><text x="70" y="182" font-size="23" font-weight="700" fill="#fff">Passage</text><text x="360" y="182" font-size="23" font-weight="700" fill="#fff">Earlier account</text><text x="770" y="182" font-size="23" font-weight="700" fill="#fff">Revision</text><rect x="50" y="200" width="1100" height="105" fill="#f0f5f2"/><text x="70" y="240" font-size="22" font-weight="700" fill="#18372d">Charges</text><text x="360" y="240" font-size="22" font-weight="400" fill="#18372d">Unsuccessful sale could</text><text x="360" y="270" font-size="22" font-weight="400" fill="#18372d">mean recurring 25% charges</text><text x="770" y="240" font-size="22" font-weight="400" fill="#18372d">Add noncompliance without</text><text x="770" y="270" font-size="22" font-weight="400" fill="#18372d">a legitimate reason</text><rect x="50" y="305" width="1100" height="105" fill="#fafcfb"/><text x="70" y="345" font-size="22" font-weight="700" fill="#18372d">Deferral</text><text x="360" y="345" font-size="22" font-weight="400" fill="#18372d">Safeguards not</text><text x="360" y="375" font-size="22" font-weight="400" fill="#18372d">fully explained</text><text x="770" y="345" font-size="22" font-weight="400" fill="#18372d">Cultivation / sale entrustment;</text><text x="770" y="375" font-size="22" font-weight="400" fill="#18372d">obligation may expire</text><rect x="50" y="410" width="1100" height="105" fill="#f0f5f2"/><text x="70" y="450" font-size="22" font-weight="700" fill="#18372d">Oral leases</text><text x="360" y="450" font-size="22" font-weight="400" fill="#18372d">Conditions for lawful</text><text x="360" y="480" font-size="22" font-weight="400" fill="#18372d">leasing not fully explained</text><text x="770" y="450" font-size="22" font-weight="400" fill="#18372d">Oral contract can be effective</text><text x="770" y="480" font-size="22" font-weight="400" fill="#18372d">when leasing is permitted</text><rect x="50" y="515" width="1100" height="105" fill="#fafcfb"/><text x="70" y="555" font-size="22" font-weight="700" fill="#18372d">Area comparison</text><text x="360" y="555" font-size="22" font-weight="400" fill="#18372d">Ratio and hypothetical</text><text x="360" y="585" font-size="22" font-weight="400" fill="#18372d">comparison of unlike areas</text><text x="770" y="555" font-size="22" font-weight="400" fill="#18372d">Remove comparison; check</text><text x="770" y="585" font-size="22" font-weight="400" fill="#18372d">confirmed demand / results</text><text x="50" y="655" font-size="19" fill="#586a63">The 25% charge dates to 2021; the 2026 change strengthens disposal-order enforcement.</text><text x="50" y="683" font-size="19" fill="#586a63">SEED VOICE analysis · Ministry explanation of October 2 and earlier coverage</text></g></svg>