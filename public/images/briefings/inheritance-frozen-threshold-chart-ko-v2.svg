<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:37px;font-weight:800;fill:#173F3D}.label{font-size:22px;font-weight:650;fill:#465D56}.value{font-size:44px;font-weight:850;fill:#193C39}.operator{font-size:42px;font-weight:700;fill:#527268}.foot{font-size:28px;font-weight:750;fill:#FFFFFF}.note{font-size:18px;fill:#526760}</style><rect width="1400" height="560" rx="22" fill="#F5F6F1"/><rect x="0" y="0" width="1400" height="15" fill="#246251"/><text x="60" y="98" class="title">12억 원짜리 집 한 채, 세금은 어떻게 계산되나</text><line x1="60" y1="126" x2="1340" y2="126" stroke="#D0DDD2" stroke-width="2"/><rect x="60" y="164" width="360" height="210" rx="19" fill="#FFFFFF" stroke="#D4DED6" stroke-width="2"/><rect x="60" y="164" width="360" height="12" rx="6" fill="#437B6A"/><text x="87" y="238" class="label">상속 주택 시가</text><text x="87" y="327" class="value">12억 원</text><rect x="520" y="164" width="360" height="210" rx="19" fill="#FFFFFF" stroke="#D4DED6" stroke-width="2"/><rect x="520" y="164" width="360" height="12" rx="6" fill="#AE9656"/><text x="547" y="238" class="label">일괄공제</text><text x="547" y="327" class="value">5억 원</text><rect x="980" y="164" width="360" height="210" rx="19" fill="#FFFFFF" stroke="#D4DED6" stroke-width="2"/><rect x="980" y="164" width="360" height="12" rx="6" fill="#C07856"/><text x="1007" y="238" class="label">단순 과세표준</text><text x="1007" y="327" class="value">약 7억 원</text><text x="454" y="287" class="operator">−</text><text x="914" y="287" class="operator">=</text><rect x="60" y="402" width="1280" height="83" rx="15" fill="#245D50"/><text x="91" y="457" class="foot">현행 누진세율로 계산한 산출세액 약 1.5억 원</text><text x="60" y="529" class="note">가상 사례: 배우자·채무·다른 재산 없음 | 장례비·신고세액공제 등 제외</text></svg>