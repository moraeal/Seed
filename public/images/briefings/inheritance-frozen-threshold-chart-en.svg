<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:37px;font-weight:800;fill:#173F3D}.label{font-size:22px;font-weight:650;fill:#465D56}.value{font-size:44px;font-weight:850;fill:#193C39}.operator{font-size:42px;font-weight:700;fill:#527268}.foot{font-size:28px;font-weight:750;fill:#FFFFFF}.note{font-size:18px;fill:#526760}</style><rect width="1400" height="560" rx="22" fill="#F5F6F1"/><rect x="0" y="0" width="1400" height="15" fill="#246251"/><text x="60" y="98" class="title">How tax applies to one KRW 1.2bn home</text><line x1="60" y1="126" x2="1340" y2="126" stroke="#D0DDD2" stroke-width="2"/><rect x="60" y="164" width="360" height="210" rx="19" fill="#FFFFFF" stroke="#D4DED6" stroke-width="2"/><rect x="60" y="164" width="360" height="12" rx="6" fill="#437B6A"/><text x="87" y="238" class="label">Home value</text><text x="87" y="327" class="value">KRW 1.2bn</text><rect x="520" y="164" width="360" height="210" rx="19" fill="#FFFFFF" stroke="#D4DED6" stroke-width="2"/><rect x="520" y="164" width="360" height="12" rx="6" fill="#AE9656"/><text x="547" y="238" class="label">Lump-sum deduction</text><text x="547" y="327" class="value">KRW 500m</text><rect x="980" y="164" width="360" height="210" rx="19" fill="#FFFFFF" stroke="#D4DED6" stroke-width="2"/><rect x="980" y="164" width="360" height="12" rx="6" fill="#C07856"/><text x="1007" y="238" class="label">Simplified tax base</text><text x="1007" y="327" class="value">About KRW 700m</text><text x="454" y="287" class="operator">−</text><text x="914" y="287" class="operator">=</text><rect x="60" y="402" width="1280" height="83" rx="15" fill="#245D50"/><text x="91" y="457" class="foot">Tax before credits at current rates: about KRW 150m</text><text x="60" y="529" class="note">Illustration: no spouse, debt or other assets | Excludes funeral and filing credits</text></svg>