<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">투표용지 부족과 투표 중단</title><desc id="desc">67개 투표소에 추가 용지가 필요했고, 그중 22개 투표소에서 투표가 일시 중단됐습니다.</desc><rect width="1200" height="680" fill="#f7f9f5"/><text x="86" y="112" font-family="Noto Sans, Arial, sans-serif" font-size="42" font-weight="800" fill="#173c32">투표용지 부족과 투표 중단</text><text x="86" y="175" font-family="Noto Sans, Arial, sans-serif" font-size="24" fill="#52665d">2026.06.03 · 제9회 전국동시지방선거</text><rect x="86" y="230" width="1028" height="152" rx="18" fill="#e1ede6"/><text x="118" y="285" font-family="Noto Sans, Arial, sans-serif" font-size="27" fill="#183d31">추가 용지가 필요했던 투표소</text><text x="118" y="356" font-family="Arial, sans-serif" font-size="70" font-weight="800" fill="#173c32">67</text><rect x="86" y="409" width="550" height="152" rx="18" fill="#dba954"/><text x="118" y="464" font-family="Noto Sans, Arial, sans-serif" font-size="25" fill="#142820">그중 투표가 일시 중단된 곳</text><text x="118" y="536" font-family="Arial, sans-serif" font-size="70" font-weight="800" fill="#142820">22</text><text x="672" y="489" font-family="Noto Sans, Arial, sans-serif" font-size="24" fill="#52665d">22곳은 67곳에 포함됩니다.</text><text x="86" y="624" font-family="Noto Sans, Arial, sans-serif" font-size="21" fill="#62756b">자료: 뉴시스의 선관위 집계 보도 · 씨앗의 소리</text></svg>