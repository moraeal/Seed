<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The days between the DMZ blast and site investigation</title>
  <desc id="desc">September 21 blast, September 22 UNC visit, September 26 entry for preparations, September 27 inquiry near but not at the blast site</desc>
  <rect width="1200" height="560" fill="#f6f4ee"/>
  <text x="68" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#173a32">From the blast to the site inquiry</text>
  <text x="68" y="117" font-family="Arial, sans-serif" font-size="19" fill="#52635f">September 2026 · Reported military account</text>
  <path d="M140 270H1035" stroke="#b3c6bc" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="145" cy="270" r="22" fill="#9b4b38"/>
    <text x="145" y="220" font-size="25" font-weight="800" fill="#173a32">21 SEP</text>
    <text x="145" y="325" font-size="20" font-weight="700" fill="#173a32">Blast</text>
    <text x="145" y="356" font-size="17" fill="#52635f">Three officers injured</text>
    <circle cx="440" cy="270" r="22" fill="#24594d"/>
    <text x="440" y="220" font-size="25" font-weight="800" fill="#173a32">22 SEP</text>
    <text x="440" y="325" font-size="20" font-weight="700" fill="#173a32">UNC visit</text>
    <text x="440" y="356" font-size="17" fill="#52635f">Division briefed</text>
    <circle cx="735" cy="270" r="22" fill="#24594d"/>
    <text x="735" y="220" font-size="25" font-weight="800" fill="#173a32">26 SEP</text>
    <text x="735" y="325" font-size="20" font-weight="700" fill="#173a32">DMZ entry</text>
    <text x="735" y="356" font-size="17" fill="#52635f">Route and safety checks</text>
    <circle cx="1030" cy="270" r="25" fill="#c98434"/>
    <text x="1030" y="220" font-size="25" font-weight="800" fill="#173a32">27 SEP</text>
    <text x="1030" y="325" font-size="20" font-weight="700" fill="#173a32">Site not reached</text>
    <text x="1030" y="356" font-size="17" fill="#52635f">Team approached area</text>
  </g>
  <rect x="68" y="420" width="1064" height="83" rx="12" fill="#e2eae3"/>
  <text x="94" y="458" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173a32">The missing record</text>
  <text x="94" y="487" font-family="Arial, sans-serif" font-size="18" fill="#345b50">What safety work and investigative decisions were made from September 21 to 26?</text>
</svg>
