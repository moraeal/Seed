<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Public agency structure diagram</title>
  <desc id="desc">A text-free diagram showing two public institutions merging into one and later separating into two functions, with citizens at the center.</desc>
  <defs>
