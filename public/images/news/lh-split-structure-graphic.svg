      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#e5efe9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173f31" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#6f8c80"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#paper)"/>
  <circle cx="600" cy="376" r="270" fill="#ffffff" opacity="0.48"/>
  <path d="M80 608 C244 560 384 602 548 574 C720 543 867 589 1120 540" fill="none" stroke="#d6e3db" stroke-width="38" stroke-linecap="round" opacity="0.72"/>

