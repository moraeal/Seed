<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Ballot shortages and voting pauses</title><desc id="desc">67 polling stations needed more ballots; voting paused at 22 of them.</desc><rect width="1200" height="680" fill="#f7f9f5"/><text x="86" y="112" font-family="Noto Sans, Arial, sans-serif" font-size="42" font-weight="800" fill="#173c32">Ballot shortages and voting pauses</text><text x="86" y="175" font-family="Noto Sans, Arial, sans-serif" font-size="24" fill="#52665d">2026.06.03 · 6·3 local elections</text><rect x="86" y="230" width="1028" height="152" rx="18" fill="#e1ede6"/><text x="118" y="285" font-family="Noto Sans, Arial, sans-serif" font-size="27" fill="#183d31">Polling stations needing more ballots</text><text x="118" y="356" font-family="Arial, sans-serif" font-size="70" font-weight="800" fill="#173c32">67</text><rect x="86" y="409" width="550" height="152" rx="18" fill="#dba954"/><text x="118" y="464" font-family="Noto Sans, Arial, sans-serif" font-size="25" fill="#142820">Of those, stations where voting paused</text><text x="118" y="536" font-family="Arial, sans-serif" font-size="70" font-weight="800" fill="#142820">22</text><text x="672" y="489" font-family="Noto Sans, Arial, sans-serif" font-size="24" fill="#52665d">The 22 stations are included in the 67.</text><text x="86" y="624" font-family="Noto Sans, Arial, sans-serif" font-size="21" fill="#62756b">Source: Election commission figures reported by Newsis · SEED VOICE</text></svg>