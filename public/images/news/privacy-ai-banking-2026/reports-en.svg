<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#fffdf8"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#163b34"><text x="65" y="88" font-size="37" font-weight="700">Personal-data breach notifications are rising</text><text x="65" y="134" font-size="24" font-weight="500" fill="#62706c">National notified incidents · Not people or exposed records</text><text x="65" y="257" font-size="25" font-weight="500">2024 full year</text><rect x="315" y="220" width="399.09999999999997" height="55" fill="#27634e"/><text x="729.0999999999999" y="258" font-size="30" font-weight="700">307</text><text x="65" y="367" font-size="25" font-weight="500">2025 full year</text><rect x="315" y="330" width="581.1" height="55" fill="#27634e"/><text x="911.1" y="368" font-size="30" font-weight="700">447</text><text x="65" y="477" font-size="25" font-weight="500">2026 first half</text><rect x="315" y="440" width="561.6" height="55" fill="#b26738"/><text x="891.6" y="478" font-size="30" font-weight="700">432</text><text x="65" y="590" font-size="26" font-weight="700">432 in H1 2026 = 96.6% of the 447 recorded in all of 2025</text><text x="65" y="633" font-size="23" font-weight="500" fill="#62706c">Half-year vs full-year comparison; this is not an annual growth rate.</text><text x="65" y="699" font-size="19" font-weight="500" fill="#737a75">Sources: PIPC; reporting citing parliamentary submissions | Oct 8, 2026</text></g></svg>