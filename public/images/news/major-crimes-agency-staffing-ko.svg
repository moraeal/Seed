<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="중수청 1차 임용, 숫자의 기준">
<rect width="1200" height="690" fill="#f7f5ec"/><rect x="40" y="40" width="1120" height="610" rx="30" fill="white" stroke="#d7e5da" stroke-width="3"/>
<text x="88" y="117" font-family="Noto Sans KR,Arial,sans-serif" font-size="36" font-weight="800" fill="#173e32">중수청 1차 임용, 숫자의 기준</text>
<text x="88" y="174" font-family="Noto Sans KR,Arial,sans-serif" font-size="25" fill="#41524a">1차 임용 합격 검사  <tspan font-size="34" font-weight="800" fill="#173e32">80</tspan></text>
<rect x="88" y="212" width="510" height="136" rx="18" fill="#16805b"/><rect x="598" y="212" width="510" height="136" rx="18" fill="#38564c"/>
<text x="116" y="274" font-family="Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="700" fill="white">평검사 약 40명</text>
<text x="626" y="274" font-family="Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="700" fill="white">부장검사 이상 약 40명</text>
<text x="88" y="416" font-family="Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" fill="#173e32">수사관 전체 정원 2,874명</text>
<line x1="88" y1="445" x2="1108" y2="445" stroke="#a8c3ad" stroke-width="3"/>
<text x="88" y="506" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" fill="#334c40">40 ÷ 2,874 ≈ 1.4%  ·  서로 다른 직무·기준의 비교</text>
<rect x="88" y="548" width="1020" height="64" rx="13" fill="#eef4e9"/>
<text x="108" y="589" font-family="Noto Sans KR,Arial,sans-serif" font-size="22" fill="#334c40">2차 지원 인원은 최종 임용 인원이 아닙니다.</text></svg>