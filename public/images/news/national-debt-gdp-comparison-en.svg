    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="92" y="105" fill="#13263b" font-size="38" font-weight="800">Same debt, different GDP basis—opposite story</text>
    <text x="92" y="144" fill="#59645f" font-size="20">National debt: KRW 1,413.8tn in 2026 → KRW 1,519.8tn in 2027</text>
    <line x1="600" y1="184" x2="600" y2="547" stroke="#d7d5cc" stroke-width="2"/>
    <text x="102" y="226" fill="#174c3a" font-size="24" font-weight="800">Government presentation</text>
    <text x="650" y="226" fill="#174c3a" font-size="24" font-weight="800">Latest-GDP comparison</text>
    <text x="102" y="286" fill="#13263b" font-size="25" font-weight="700">2026</text>
    <text x="102" y="346" fill="#13263b" font-size="52" font-weight="900">51.6%</text>
    <text x="102" y="383" fill="#67716c" font-size="19">Older GDP forecast: ~KRW 2,740tn</text>
    <line x1="330" y1="304" x2="410" y2="344" stroke="#ad3f32" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-down-en)"/>
    <text x="469" y="286" fill="#13263b" font-size="25" font-weight="700">2027</text>
    <text x="438" y="346" fill="#13263b" font-size="52" font-weight="900">48.3%</text>
    <text x="350" y="439" fill="#ad3f32" font-size="27" font-weight="800">Down 3.3pp</text>
    <text x="650" y="286" fill="#13263b" font-size="25" font-weight="700">2026</text>
    <text x="650" y="346" fill="#13263b" font-size="52" font-weight="900">46.9%</text>
    <text x="650" y="383" fill="#67716c" font-size="19">Latest GDP outlook: ~KRW 3,015tn</text>
    <line x1="842" y1="344" x2="922" y2="304" stroke="#c29222" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-up-en)"/>
    <text x="1000" y="286" fill="#13263b" font-size="25" font-weight="700">2027</text>
    <text x="958" y="346" fill="#13263b" font-size="52" font-weight="900">48.3%</text>
    <text x="880" y="439" fill="#ad3f32" font-size="27" font-weight="800">Up 1.4pp</text>
