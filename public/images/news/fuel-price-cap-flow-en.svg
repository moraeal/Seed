<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How Korea's petroleum price ceiling transfers costs</title>
  <desc id="desc">Four steps show a refinery supply-price cap, consumer relief, refinery losses and compensation from the public budget.</desc>
  <rect width="1600" height="900" fill="#f5f1e7"/>
  <text x="800" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#173a4f">The price is capped. The cost remains.</text>
  <text x="800" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#48606d">The fiscal path of Korea's petroleum price ceiling</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(95 235)">
      <rect width="300" height="250" rx="18" fill="#ffffff" stroke="#176044" stroke-width="4"/>
      <circle cx="150" cy="72" r="42" fill="#dceade"/>
      <text x="150" y="84" text-anchor="middle" font-size="34" font-weight="700" fill="#176044">1</text>
      <text x="150" y="150" text-anchor="middle" font-size="27" font-weight="700" fill="#173a4f">Supply-price cap</text>
      <text x="150" y="192" text-anchor="middle" font-size="19" fill="#48606d">Wholesale ceiling for</text>
      <text x="150" y="220" text-anchor="middle" font-size="19" fill="#48606d">gasoline, diesel and kerosene</text>
    </g>
    <path d="M415 360h70" stroke="#c89b3c" stroke-width="10" stroke-linecap="round"/>
    <path d="m475 340 28 20-28 20" fill="none" stroke="#c89b3c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(500 235)">
      <rect width="300" height="250" rx="18" fill="#ffffff" stroke="#176044" stroke-width="4"/>
      <circle cx="150" cy="72" r="42" fill="#dceade"/>
      <text x="150" y="84" text-anchor="middle" font-size="34" font-weight="700" fill="#176044">2</text>
      <text x="150" y="150" text-anchor="middle" font-size="27" font-weight="700" fill="#173a4f">Consumer relief</text>
      <text x="150" y="192" text-anchor="middle" font-size="19" fill="#48606d">Lower wholesale prices can</text>
      <text x="150" y="220" text-anchor="middle" font-size="19" fill="#48606d">slow retail and inflation pressure</text>
    </g>
    <path d="M820 360h70" stroke="#c89b3c" stroke-width="10" stroke-linecap="round"/>
    <path d="m880 340 28 20-28 20" fill="none" stroke="#c89b3c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(905 235)">
      <rect width="300" height="250" rx="18" fill="#ffffff" stroke="#176044" stroke-width="4"/>
      <circle cx="150" cy="72" r="42" fill="#dceade"/>
      <text x="150" y="84" text-anchor="middle" font-size="34" font-weight="700" fill="#176044">3</text>
      <text x="150" y="150" text-anchor="middle" font-size="27" font-weight="700" fill="#173a4f">Refinery losses</text>
      <text x="150" y="192" text-anchor="middle" font-size="19" fill="#48606d">The ceiling creates a gap</text>
      <text x="150" y="220" text-anchor="middle" font-size="19" fill="#48606d">against verified market costs</text>
    </g>
    <path d="M1225 360h70" stroke="#c89b3c" stroke-width="10" stroke-linecap="round"/>
    <path d="m1285 340 28 20-28 20" fill="none" stroke="#c89b3c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1310 235)">
      <rect width="195" height="250" rx="18" fill="#173a4f"/>
      <circle cx="97" cy="72" r="42" fill="#c89b3c"/>
      <text x="97" y="84" text-anchor="middle" font-size="34" font-weight="700" fill="#173a4f">4</text>
      <text x="97" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Fiscal</text>
      <text x="97" y="177" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">compensation</text>
      <text x="97" y="218" text-anchor="middle" font-size="18" fill="#e9dec5">Public funds cover</text>
      <text x="97" y="242" text-anchor="middle" font-size="18" fill="#e9dec5">recognized losses</text>
    </g>
  </g>
  <rect x="140" y="575" width="1320" height="104" rx="14" fill="#dceade"/>
  <text x="800" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#176044">The price was capped. The cost did not disappear.</text>
  <line x1="180" y1="735" x2="1420" y2="735" stroke="#c9c2b4"/>
  <text x="800" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#48606d">KRW 4.2 trillion is the allocated contingency reserve—not the amount already paid.</text>
  <text x="800" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#48606d">Final payments will be determined after cost and loss claims are reviewed.</text>
</svg>
