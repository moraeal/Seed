<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f7f5ed"/><g font-family="DejaVu Sans, Noto Sans CJK KR, sans-serif" fill="#193d34"><text x="70" y="83" font-size="36" font-weight="700">기업의 요구와 제도 개선 방향</text><text x="70" y="160" font-size="25" font-weight="700">기업들이 건의한 내용</text><text x="645" y="160" font-size="25" font-weight="700">씨앗이 제시하는 우선순위</text><rect x="55" y="205" width="1090" height="82" rx="10" fill="#e7eee4"/><text x="75" y="255" font-size="23">세제지원 대상 확대</text><text x="650" y="255" font-size="23">성장에 따른 혜택 급감 완화</text><rect x="55" y="310" width="1090" height="82" rx="10" fill="#edf0e8"/><text x="75" y="360" font-size="23">전용 신용보증·투자 지원</text><text x="650" y="360" font-size="23">확장 시 자금조달 연속성 확보</text><rect x="55" y="415" width="1090" height="82" rx="10" fill="#e7eee4"/><text x="75" y="465" font-size="23">근로시간·중복 규제 개선</text><text x="650" y="465" font-size="23">실제 위험에 맞는 규제와 경영 자율성</text><text x="70" y="590" font-size="19">자료: 중견련 건의를 다룬 뉴스핌 보도 · 오른쪽은 씨앗의 제안</text></g></svg>