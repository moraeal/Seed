<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>씨드시민파트너스</title>
    <script>
      (function () {
        var base = "/Seed/";
        var path = window.location.pathname;
        if (path.indexOf(base) === 0) {
          path = path.slice(base.length);
        } else {
          path = path.replace(/^\/+/, "");
        }
        var target = base + "#/" + path + window.location.search;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p><a href="/Seed/#/">씨드시민파트너스 홈페이지로 이동</a></p>
  </body>
</html>
