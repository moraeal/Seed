<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>페이지를 찾을 수 없습니다 | 씨드 시민저널</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var hashRoute = window.location.hash.indexOf("#/") === 0
          ? window.location.hash.slice(1)
          : "";
        if (hashRoute) {
          window.location.replace("https://seedpartners.org" + hashRoute + window.location.search);
          return;
        }
        if (path.indexOf("/Seed/") === 0) {
          window.location.replace("https://seedpartners.org/" + path.slice(6) + window.location.search);
          return;
        }
        window.location.replace("https://seedpartners.org/");
      })();
    </script>
  </head>
  <body>
    <p><a href="https://seedpartners.org/">씨드 시민저널 홈페이지로 이동</a></p>
  </body>
</html>
